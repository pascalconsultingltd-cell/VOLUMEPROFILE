<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bell grids</title>
    <style>
      :root {
        --bg: #f6f7f9; --card: #fff; --tx: #1f2328; --mu: #6b7684; --line: #e3e6ea;
        --g: #089981; --r: #e53935; --bl: rgba(41, 98, 255, 0.12); --k: #434651;
      }
      body { margin: 0; background: var(--bg); color: var(--tx);
        font: 14px/1.4 ui-monospace, Menlo, Consolas, monospace; }
      main { max-width: 1100px; margin: 0 auto; padding: 16px; }
      h1 { font-size: 18px; margin: 0 0 4px; }
      h2 { font-size: 15px; margin: 24px 0 8px; }
      .mu { color: var(--mu); }
      .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px;
        padding: 12px; margin: 12px 0; }
      table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
      th, td { padding: 4px 6px; text-align: right; border-bottom: 1px solid var(--line);
        white-space: nowrap; }
      th:first-child, td:first-child { text-align: left; }
      th { color: var(--mu); font-weight: 600; }
      .wrap { overflow-x: auto; }
      .g { color: var(--g); } .r { color: var(--r); }
      canvas { width: 100%; height: 260px; display: block; margin-top: 8px; }
      .tag { font-weight: 700; }
      tr[data-id] { cursor: pointer; }
      tr[data-id]:hover { background: #f0f3f7; }
      tr.on { background: #e7eefc; }
    </style>
  </head>
  <body>
    <main id="m"></main>
    <script>
      const D = /*DATA*/null;
      const $m = document.getElementById("m"),
        f0 = (v) => v.toFixed(0), f2 = (v) => v.toFixed(2),
        sg = (v) => (v >= 0 ? "+" : "") + v.toFixed(2) + "σ",
        tm = (t) => new Date(t).toISOString().slice(5, 16).replace("T", " "),
        col = (mv) => (mv > 0 ? "g" : mv < 0 ? "r" : ""),
        el = (h) => { const d = document.createElement("div"); d.innerHTML = h; return d.firstElementChild; };
      $m.appendChild(el(`<div><h1>Bell grids, short only</h1>
        <div class="mu">${D.cap} FDUSD per bell, from its birth to its exit (price out of the
        curve, no re-entry before the next bell). Sells bought back one step lower, maker
        both ways; open shorts at the exit bought back at market (0.10%). Ranked by RoMaD
        (DD at each minute's high). Built ${D.made}.</div>
        <div class="mu">Grids allowed: step ≤ ${D.con.max_step}σ, ${D.con.min_sells}+ sells,
        first sell ≤ +${D.con.max_first}σ, size ${D.con.sizes.join(" / ")}.</div></div>`));
      /* best grids over every bell; a row clicked: that grid on every bell */
      const n = D.cards.length;
      $m.appendChild(el(`<div><h2>Best grids over all ${n} bells (σ from the P)</h2>
        <div class="mu">Click a row to draw it on every bell; a bell's own row to draw it on
        that bell. Bigger lines and marks = more FDUSD on that level.</div>
        <div class="card wrap"><table id="sum"><tr><th>Sells</th><th>Step</th><th>Size</th>
        <th>RoMaD</th><th>PnL</th><th>Worst DD</th><th>Won</th></tr>
        ${D.summary.map((s, j) => `<tr data-id="s${j}"><td>${s.lv} from ${sg(s.first)}</td><td>${s.step}σ</td>
          <td>${s.alloc}</td><td>${f2(s.romad)}</td><td class="${s.pnl >= 0 ? "g" : "r"}">${s.pnl.toFixed(1)}</td>
          <td>${s.dd.toFixed(1)}</td><td>${s.won}/${s.n}</td></tr>`).join("")}</table></div></div>`));
      /* held out: each bell with the shape that did best on the others */
      if (D.loo.length) {
        const L = D.loo, tot = L.reduce((a, x) => a + x.pnl, 0);
        $m.appendChild(el(`<div><h2>Held out: each bell with the best shape of the others</h2>
          <div class="mu">What the rule would have made live (the shape is chosen without the
          bell it is scored on). Click a row to draw it on that bell.</div>
          <div class="card wrap"><table><tr><th>Bell</th><th>Shape (σ from the P)</th><th>Trips</th>
          <th>Open</th><th>PnL</th><th>DD</th><th>RoMaD</th></tr>
          ${L.map((x) => { const b = D.cards[x.k].bell; return `<tr data-id="h" data-k="${x.k}">
            <td><span class="tag ${col(b.mv)}">${b.day} ${b.n}</span></td>
            <td>${x.lv} from ${sg(x.first)} every ${x.step}σ, ${x.alloc}</td><td>${x.trips}</td>
            <td>${x.open}</td><td class="${x.pnl >= 0 ? "g" : "r"}">${f2(x.pnl)}</td><td>${f2(x.dd)}</td>
            <td>${f2(x.romad)}</td></tr>`; }).join("")}
          <tr><th>Total</th><th>won ${L.filter((x) => x.pnl > 0).length}/${L.length}</th><th></th><th></th>
          <th class="${tot >= 0 ? "g" : "r"}">${tot.toFixed(1)}</th>
          <th>${Math.max(...L.map((x) => x.dd)).toFixed(1)}</th>
          <th>${(L.reduce((a, x) => a + x.romad, 0) / L.length).toFixed(2)}</th></tr></table></div></div>`));
      }
      /* the two rolling strategies chained over the forward bells */
      if (D.roll.length) {
        const C = D.cmp, ks = Object.keys(C);
        $m.appendChild(el(`<div><h2>Rolling: #1 vs ${D.N} best, chained over ${D.roll.length} forward bells</h2>
          <div class="mu">Each bell's grid picked on the ${D.R} bells before it; the bells' equity
          chained in time (their windows do not overlap). DD over the whole run, open shorts at
          each minute's high.</div>
          <div class="card wrap"><table><tr><th></th>${ks.map((k) => `<th>${k}</th>`).join("")}</tr>
          ${[["Total PnL", "pnl", 1], ["Overall DD", "dd", 1], ["RoMaD", "romad", 2], ["Mean per bell", "mean", 2],
             ["Worst bell", "worst", 2]].map(([t, f, d]) => `<tr><td>${t}</td>${ks.map((k) =>
               `<td>${C[k][f].toFixed(d)}</td>`).join("")}</tr>`).join("")}
          <tr><td>Bells won</td>${ks.map((k) => `<td>${C[k].won}/${C[k].n}</td>`).join("")}</tr></table>
          <canvas id="cmpcv"></canvas>
          <div class="mu">equity: ${ks.map((k, i) => `<span style="color:${["#2962ff", "#ff6d00"][i]}">${k}</span>`).join(" · ")}</div></div></div>`));
        drawCmp(document.getElementById("cmpcv"), C);
      }
      function drawCmp(cv, C) {
        const ks = Object.keys(C), dpr = devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
        cv.width = W * dpr; cv.height = H * dpr;
        const g = cv.getContext("2d");
        g.scale(dpr, dpr);
        const all = ks.flatMap((k) => C[k].curve), n = Math.max(...ks.map((k) => C[k].curve.length)),
          hi = Math.max(0, ...all.map((q) => q[1])), lo = Math.min(0, ...all.map((q) => q[1])),
          L = 48, Rr = W - 6, X = (i) => L + (i / (n - 1)) * (Rr - L),
          Y = (v) => 6 + ((hi - v) / (hi - lo || 1)) * (H - 24);
        g.font = "10px ui-monospace,Menlo,monospace"; g.fillStyle = "#6b7684"; g.textAlign = "right";
        [hi, 0, lo].forEach((v) => g.fillText(v.toFixed(0), L - 4, Y(v) + 3));
        g.strokeStyle = "#c5ccd5"; g.beginPath(); g.moveTo(L, Y(0)); g.lineTo(Rr, Y(0)); g.stroke();
        ks.forEach((k, j) => {
          g.strokeStyle = ["#2962ff", "#ff6d00"][j]; g.lineWidth = 1.5; g.beginPath();
          C[k].curve.forEach((q, i) => g[i ? "lineTo" : "moveTo"](X(i), Y(q[1])));
          g.stroke();
        });
        g.textAlign = "left"; g.fillStyle = "#6b7684";
        g.fillText(tm(C[ks[0]].curve[0][0]), L, H - 4);
        g.textAlign = "right";
        g.fillText(tm(C[ks[0]].curve[C[ks[0]].curve.length - 1][0]), Rr, H - 4);
      }
      /* rolling: each bell with the best shapes of the bells before it */
      if (D.roll.length) {
        const L = D.roll, t1 = L.reduce((a, x) => a + x.pnl, 0), tn = L.reduce((a, x) => a + x.pnlN, 0);
        $m.appendChild(el(`<div><h2>Rolling: each bell with the ${D.N} best shapes of the ${D.R} bells before it</h2>
          <div class="mu">No look ahead: the shapes are picked on the ${D.R} bells before, then used on the
          next. #1 = the best of them alone; ${D.N} best = their average (about the ${D.cap} split over
          them). Click a row to draw #1 on that bell.</div>
          <div class="card wrap"><table><tr><th>Bell</th><th>#1 shape (σ from the P)</th><th>Trips</th>
          <th>PnL #1</th><th>DD #1</th><th>PnL ${D.N} best</th><th>DD ${D.N} best</th><th>Won of ${D.N}</th></tr>
          ${L.map((x) => { const b = D.cards[x.k].bell; return `<tr data-id="r" data-k="${x.k}">
            <td><span class="tag ${col(b.mv)}">${b.day} ${b.n}</span></td>
            <td>${x.lv} from ${sg(x.first)} every ${x.step}σ</td><td>${x.trips}</td>
            <td class="${x.pnl >= 0 ? "g" : "r"}">${f2(x.pnl)}</td><td>${f2(x.dd)}</td>
            <td class="${x.pnlN >= 0 ? "g" : "r"}">${f2(x.pnlN)}</td><td>${f2(x.ddN)}</td><td>${x.wonN}/${x.n}</td></tr>`; }).join("")}
          <tr><th>Total</th><th>won ${L.filter((x) => x.pnl > 0).length}/${L.length}</th><th></th>
          <th class="${t1 >= 0 ? "g" : "r"}">${t1.toFixed(1)}</th>
          <th>${Math.max(...L.map((x) => x.dd)).toFixed(1)}</th>
          <th class="${tn >= 0 ? "g" : "r"}">${tn.toFixed(1)}</th>
          <th>${Math.max(...L.map((x) => x.ddN)).toFixed(1)}</th>
          <th>won ${L.filter((x) => x.pnlN > 0).length}/${L.length}</th></tr></table></div></div>`));
      }
      $m.appendChild(el(`<h2>Each bell</h2>`));
      const cards = D.cards.map((c, k) => {
        const b = c.bell;
        const card = el(`<div class="card">
          <div><span class="tag ${col(b.mv)}">${b.day} ${b.n}</span> P ${f0(b.px)}
            σ ${f0(b.sigma)} · curve ${b.lo}–${b.hi} · ${tm(b.birth)} → ${tm(c.end)} (${c.hours}h)</div>
          <div class="mu" id="gi${k}"></div>
          <canvas id="cv${k}"></canvas>
          <div class="wrap"><table><tr><th>Bottom</th><th>Top</th><th>Step</th><th>Size</th>
            <th>Sells</th><th>Trips</th><th>Open</th><th>PnL</th><th>DD</th><th>RoMaD</th></tr>
            ${c.best.map((r, i) => `<tr data-id="b${i}" data-k="${k}"><td>${sg(r.B)}</td><td>${sg(r.T)}</td>
              <td>${r.step}σ</td><td>${r.alloc}</td><td>${r.lv}</td><td>${r.trips}</td><td>${r.open}</td>
              <td class="${r.pnl >= 0 ? "g" : "r"}">${f2(r.pnl)}</td><td>${f2(r.dd)}</td>
              <td>${f2(r.romad)}</td></tr>`).join("")}</table></div></div>`);
        $m.appendChild(card);
        return card;
      });
      /* show grid id on card k: its sells in prices, sizes, and the chart */
      const show = (k, id) => {
        const c = D.cards[k], gr = c.grids[id];
        document.getElementById("gi" + k).textContent =
          `${id === "h" ? "held out" : id === "r" ? "rolling #1" : (id[0] === "s" ? "summary row " : "row ") + (+id.slice(1) + 1)}: ` +
          gr.levels.map((L, i) => `sell ${f0(L)} (${f0(gr.sizes[i])})`).join(", ") +
          `, each bought back ${f0(gr.step)} lower · PnL ${f2(gr.pnl)} · DD ${f2(gr.dd)}` +
          ` · RoMaD ${f2(gr.romad)} · ${gr.trips} trips, ${gr.open} open`;
        cards[k].querySelectorAll("tr[data-id]").forEach((tr) =>
          tr.classList.toggle("on", tr.dataset.id === id));
        draw(document.getElementById("cv" + k), c, gr);
      };
      document.addEventListener("click", (e) => {
        const tr = e.target.closest("tr[data-id]");
        if (!tr) return;
        if (tr.dataset.k != null) {
          tr.parentElement.querySelectorAll("tr").forEach((x) => x.classList.toggle("on", x === tr));
          return show(+tr.dataset.k, tr.dataset.id);
        }
        document.querySelectorAll("#sum tr").forEach((x) => x.classList.toggle("on", x === tr));
        D.cards.forEach((c, k) => show(k, tr.dataset.id));
      });
      D.cards.forEach((c, k) => show(k, "b0"));
      /* the window: price by the minute (high-low band, close line), the
         curve's range shaded, the P dashed, the grid's sells (red) and buy
         backs (green), each fill marked; line and mark size by the level's
         FDUSD */
      function draw(cv, c, gr) {
        const b = c.bell, p = c.path, dpr = devicePixelRatio || 1,
          W = cv.clientWidth, H = cv.clientHeight;
        cv.width = W * dpr; cv.height = H * dpr;
        const g = cv.getContext("2d");
        g.scale(dpr, dpr);
        const t0 = p[0][0], t1 = p[p.length - 1][0] + 6e4,
          hi = Math.max(b.hi, ...p.map((q) => q[1])) + 0.2 * b.sigma,
          lo = Math.min(b.lo, ...p.map((q) => q[2])) - 0.2 * b.sigma,
          L = 48, R = W - 6,
          X = (t) => L + ((t - t0) / (t1 - t0)) * (R - L),
          Y = (v) => 6 + ((hi - v) / (hi - lo)) * (H - 24),
          k = (x) => Math.sqrt(x / D.cap);
        g.fillStyle = "rgba(41,98,255,.08)";
        g.fillRect(L, Y(b.hi), R - L, Y(b.lo) - Y(b.hi));
        g.font = "10px ui-monospace,Menlo,monospace";
        g.fillStyle = "#6b7684";
        g.textAlign = "right";
        [b.hi, b.px, b.lo].forEach((v) => g.fillText(f0(v), L - 4, Y(v) + 3));
        g.textAlign = "left";
        g.fillText(tm(t0), L, H - 4);
        g.textAlign = "right";
        g.fillText(tm(t1), R, H - 4);
        const hl = (v, c2, d, w) => {
          g.strokeStyle = c2; g.setLineDash(d); g.lineWidth = w;
          g.beginPath(); g.moveTo(L, Y(v)); g.lineTo(R, Y(v)); g.stroke(); g.setLineDash([]);
        };
        hl(b.px, "#000", [5, 4], 1);
        gr.levels.forEach((v, i) => {
          const w = 0.5 + 3 * k(gr.sizes[i]);
          hl(v, "rgba(229,57,53,.75)", [], w);
          hl(v - gr.step, "rgba(8,153,129,.75)", [3, 3], w);
        });
        g.fillStyle = "rgba(67,70,81,.25)";
        p.forEach((q) => g.fillRect(X(q[0]), Y(q[1]), Math.max(1, X(q[0] + 6e4) - X(q[0])), Y(q[2]) - Y(q[1])));
        g.strokeStyle = "#434651"; g.lineWidth = 1.2; g.beginPath();
        p.forEach((q, i) => g[i ? "lineTo" : "moveTo"](X(q[0] + 3e4), Y(q[3])));
        g.stroke();
        const tri = (x, y, up, c2, z) => {
          const h = 3 + 9 * z;
          g.fillStyle = c2; g.beginPath();
          g.moveTo(x, y + (up ? -h : h)); g.lineTo(x - h * 0.7, y); g.lineTo(x + h * 0.7, y);
          g.fill();
        };
        gr.fills.forEach(([ti, Lv, tj, Lb, sz]) => {
          tri(X(ti), Y(Lv) - 2, false, "#e53935", k(sz));
          if (tj != null) tri(X(tj), Y(Lb) + 2, true, "#089981", k(sz));
        });
      }
    </script>
  </body>
</html>
