<style>

.grip[data-c=br]{right:0;bottom:0;cursor:nwse-resize;background:linear-gradient(315deg,#7d8794 0 2px,transparent 2px 5px,#7d8794 5px 7px,transparent 7px 10px,#7d8794 10px 12px,transparent 12px)}

<body>
<header>
  <span class="sym" id="sym">BTCFDUSD 5m</span>
  <span class="px" id="px">—</span>
  <span><i class="dot" id="dot"></i><span id="st">connecting</span></span>
  <div class="ctl">
    <button id="miniTog" title="Show / hide the 15s line break window">15s LB</button>

  </div>
</header>
<div id="info"></div>
<main><canvas id="c"></canvas></main>
<div id="toast"></div>
<div id="mini">
  <div id="mhead"><b>15s</b><span id="mst"></span><button id="mx" title="Hide">×</button></div>
  <div id="mbody"><canvas id="mc"></canvas></div>
  <div class="grip" data-c="tl" title="Drag to resize"></div><div class="grip" data-c="tr" title="Drag to resize"></div><div class="grip" data-c="bl" title="Drag to resize"></div><div class="grip" data-c="br" title="Drag to resize"></div>
</div>
<script>
const SYM='BTCFDUSD', IV='5m', TPO_MS=1800000, DP=0; // DP = decimals shown on prices
// TPO letter colours by UTC hour: Asia (red) → Europe (blue) → US open (green) → US late (yellow)
const STOPS=[[0,[229,57,53]],[8,[30,100,230]],[14,[8,153,129]],[21,[225,165,0]]];
const BIG_WIN=150, BIG_PERC=0.95; // 'big candle + high volume' circles: window length and percentile (nearest-rank, as in the Pine script)
const LET='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz';
function tpoColor(i,a=1){const h=Math.min(21,i*0.5);let k=0;
  while(k<STOPS.length-2&&h>STOPS[k+1][0])k++;
  const [h0,c0]=STOPS[k],[h1,c1]=STOPS[k+1],f=Math.max(0,Math.min(1,(h-h0)/(h1-h0)));
  return `rgba(${c0.map((v,j)=>Math.round(v+(c1[j]-v)*f)).join(',')},${a})`}
const REST=['https://api.binance.com','https://data-api.binance.vision'];
const WS=['wss://stream.binance.com:9443','wss://data-stream.binance.vision'];
// k5 = 5m candles (main chart), k15 = 15m candles (TPO profiles), c15 = 15s candles (line-break window / 15s view)
let k5=[], k15=[], c15=[], charts=[], mid=null, xh=null, activeChart=null, lines=[], linesSig='', nTpo=3, TF='5m', hostI=0, retry=0, ws;
let conn='connecting', everOpen=false, lastT=null;
const histFail=new Set(), seeded={}, olderBusy={}, olderEnd={};

const $=id=>document.getElementById(id);
const HELP=$('info').textContent;
const toC=a=>({t:a[0],o:+a[1],h:+a[2],l:+a[3],c:+a[4],v:+a[5],bv:+a[9]});

function stat(){ // connection state + any history that could not be loaded
  $('dot').className=conn==='live'?'dot on':'dot';
  $('st').textContent=conn+(histFail.size?' · history failed: '+[...histFail].join(', '):'');
}
// vol=false for the kline-backed stores: trades only move the price there, volume comes from the kline stream (no double counting)
function feed(arr,ms,p,q,T,m,vol){
  const t=Math.floor(T/ms)*ms;
  let c=arr[arr.length-1];
  if(!c||t>c.t){
    c={t,o:p,h:p,l:p,c:p,v:0,bv:0};arr.push(c);charts.forEach(h=>h.newCandle(arr));
    if(arr.length>8000)arr.shift();
  }else if(t<c.t){return}
  c.h=Math.max(c.h,p);c.l=Math.min(c.l,p);c.c=p;if(vol){c.v+=q;if(!m)c.bv+=q}
}
// Join between 1s history and live trades for the 15s store: history owns every second before `cut`,
// the trade stream owns everything from `cut` on. `seam` collects the live part of the 15s bucket that contains `cut`.
let cut=null, seam=null, cutArm=false, cutDone=null;
function armCut(){
  cut=null;seam=null;cutArm=true;
  return new Promise(res=>{
    const t=setTimeout(()=>{cutDone=null;cutArm=false;if(cut!=null)setTimeout(res,1500);else res()},4000); // no trades: carry on without a cut
    cutDone=()=>{clearTimeout(t);cutDone=null;res()};
  });
}
function addTrade(p,q,T,m){
  if(!Number.isFinite(p)||!Number.isFinite(q)||!Number.isFinite(T))return; // ignore malformed trades
  lastT=T;
  if(cutArm){cut=Math.floor(T/1000)*1000+1000;cutArm=false}
  if(cut!=null){
    if(T>=cut&&T<Math.floor(cut/15000)*15000+15000){
      if(!seam)seam={h:p,l:p,c:p,v:0,bv:0};
      seam.h=Math.max(seam.h,p);seam.l=Math.min(seam.l,p);seam.c=p;seam.v+=q;if(!m)seam.bv+=q;
    }
    if(cutDone&&T>=cut+1000)cutDone(); // the seconds before the cut are now closed on the exchange
  }
  feed(k5,300000,p,q,T,m,false);feed(k15,900000,p,q,T,m,false);
  feed(c15,15000,p,q,T,m,true);
  if(mid==null)$('px').textContent=document.title=p.toFixed(DP);schedule();
}
function onKline(k){ // 5m store feeds the 5m view, 15m store feeds the TPO profiles
  const A=k.i==='15m'?k15:k5;
  if(![k.t,k.o,k.h,k.l,k.c,k.v,k.V].every(v=>Number.isFinite(+v)))return; // ignore malformed klines
  let c=A.find(x=>x.t===k.t);
  if(!c){c={t:k.t};A.push(c);charts.forEach(h=>h.newCandle(A));A.sort((a,b)=>a.t-b.t)}
  Object.assign(c,{o:+k.o,h:+k.h,l:+k.l,c:+k.c,v:+k.v,bv:+k.V});
  schedule();
}
async function fetch1s(end){
  for(let tr=0;tr<2;tr++)for(const h of REST){
    try{const j=await fj(`${h}/api/v3/klines?symbol=${SYM}&interval=1s&limit=1000&endTime=${end}`);if(Array.isArray(j))return j}catch(e){}
  }
  return null;
}
// 15s candles from 1s klines ending at `end`: `pages` pages of 1000s, fetched 11 at a time, newest first; stops as soon as the callback returns true
async function seed15(m,end,pages,lim,cb){
  const B=11,seen=new Set();
  for(let i=0;i<pages;i+=B){
    const res=await Promise.all(Array.from({length:Math.min(B,pages-i)},(_,k)=>fetch1s(end-(i+k)*1000000)));
    let any=false;
    res.forEach(j=>{if(!j)return;j.forEach(a=>{
      if(seen.has(a[0])||(lim!=null&&a[0]>=lim))return;seen.add(a[0]);any=true;
      const t=Math.floor(a[0]/15000)*15000;let c=m.get(t);
      if(!c){c={t,o:+a[1],h:+a[2],l:+a[3],c:+a[4],v:0,bv:0,fo:a[0],lt:a[0]};m.set(t,c)}
      c.h=Math.max(c.h,+a[2]);c.l=Math.min(c.l,+a[3]);
      if(a[0]<c.fo){c.fo=a[0];c.o=+a[1]}
      if(a[0]>=c.lt){c.lt=a[0];c.c=+a[4]}
      c.v+=+a[5];c.bv+=+a[9];
    })});
    if(cb()===true)break;
    if(!any)break;
  }
}
function schedule(){charts.forEach(h=>h.sched())}
// since==null: first load, adaptive (keeps fetching older 1s history until the 15s line-break chart has enough bricks, up to ≈18h)
// since=time: backfill after a reconnect, from that time up to now
async function fill15(since){
  await armCut();
  const lim=cut,end=lim!=null?lim-1:Date.now(),first=since==null,TARGET=450;
  const pages=first?66:Math.max(1,Math.min(66,Math.ceil((end-since)/1000000)+1));
  const m=new Map();let bricks=0,joined=false;
  await seed15(m,end,pages,lim,()=>{
    if(!joined){ // add the live part of the bucket that straddles the cut, once
      joined=true;
      const b=lim!=null&&seam?m.get(Math.floor(lim/15000)*15000):null;
      if(b){b.h=Math.max(b.h,seam.h);b.l=Math.min(b.l,seam.l);b.c=seam.c;b.v+=seam.v;b.bv+=seam.bv}
      cut=null;seam=null;
    }
    let lo=Infinity;m.forEach((c,t)=>{if(t<lo)lo=t});
    const all=new Map(c15.map(c=>[c.t,c]));
    m.forEach((c,t)=>{if(!first&&t===lo&&all.has(t))return;all.set(t,c)}); // a backfill's oldest bucket may be partial: keep the one we have
    c15=[...all.values()].sort((x,y)=>x.t-y.t).slice(-8000);
    if(first){bricks=lbBars(c15).length;$('mst').textContent=bricks>=TARGET?'':'loading 15s '+bricks+'/'+TARGET}
    schedule();return first&&bricks>=TARGET;
  });
  cut=null;seam=null;
  if(first)$('mst').textContent=m.size&&bricks<TARGET?'15s history: only '+bricks+' bricks available':'';
  return m.size>0;
}
let q15=Promise.resolve(); // 15s fills run one at a time
const load15=since=>hist('15s',()=>(q15=q15.then(()=>fill15(since)).catch(e=>{console.error(e);return false})));
// Three-line break bricks built from candle closes; each brick carries the volume since the previous brick
function lbBars(arr){
  const out=[];let av=0,ab=0;
  arr.forEach(c=>{
    if(c.c==null)return;
    av+=c.v||0;ab+=c.bv||0;const x=c.c;
    if(!out.length){if(x!==c.o){out.push({t:c.t,o:c.o,c:x,h:Math.max(c.o,x),l:Math.min(c.o,x),v:av,bv:ab});av=ab=0}return}
    const L=out[out.length-1],last3=out.slice(-3);let nb=null;
    if(L.c>L.o){
      if(x>L.c)nb={o:L.c,c:x};else if(x<Math.min(...last3.map(q=>q.l)))nb={o:L.o,c:x};
    }else{
      if(x<L.c)nb={o:L.c,c:x};else if(x>Math.max(...last3.map(q=>q.h)))nb={o:L.o,c:x};
    }
    if(nb){nb.t=c.t;nb.h=Math.max(nb.o,nb.c);nb.l=Math.min(nb.o,nb.c);nb.v=av;nb.bv=ab;out.push(nb);av=ab=0}
  });
  return out;
}
async function fj(url,ms=10000){
  const ac=new AbortController(),t=setTimeout(()=>ac.abort(),ms);
  try{const r=await fetch(url,{signal:ac.signal});return await r.json()}finally{clearTimeout(t)}
}
const store=iv=>iv==='15m'?k15:k5, setStore=(iv,a)=>{if(iv==='15m')k15=a;else k5=a};
async function seedIv(iv){ // recent kline history (5m for the chart, 15m for the TPO profiles); merges into what is already loaded, so it also heals gaps after a reconnect
  for(const h of REST){
    try{
      const j=await fj(`${h}/api/v3/klines?symbol=${SYM}&interval=${iv}&limit=${iv==='15m'?1000:700}`);
      if(!Array.isArray(j)||!j.length)continue;
      const arr=j.map(toC),f=arr[0].t,lt=arr[arr.length-1].t,old=store(iv);
      setStore(iv,old.filter(c=>c.t<f).concat(arr,old.filter(c=>c.t>lt)));
      seeded[iv]=true;
      if(iv===IV&&mid==null)$('px').textContent=k5[k5.length-1].c.toFixed(DP);
      schedule();return true;
    }catch(e){}
  }
  return false;
}
async function older(iv){ // lazy history: one more page of older klines when the view reaches the start of what is loaded
  if(olderBusy[iv]||olderEnd[iv]||!store(iv).length)return;
  olderBusy[iv]=true;let ok=false;
  for(const h of REST){
    try{
      const j=await fj(`${h}/api/v3/klines?symbol=${SYM}&interval=${iv}&limit=1000&endTime=${store(iv)[0].t-1}`);
      if(!Array.isArray(j))continue;
      const cur=store(iv),arr=j.map(toC).filter(c=>c.t<cur[0].t);
      if(arr.length)setStore(iv,arr.concat(cur));
      if(!arr.length||store(iv).length>=6000)olderEnd[iv]=true;
      ok=true;schedule();break;
    }catch(e){}
  }
  setTimeout(()=>{olderBusy[iv]=false},ok?0:10000);
}
async function hist(name,fn){ // run a history load, show it in the status while it is failing, retry a few times
  for(let i=0;;i++){
    if(await fn()){histFail.delete(name);stat();return}
    histFail.add(name);stat();
    if(i>=5)return;
    await new Promise(r=>setTimeout(r,5000*(i+1)));
  }
}
function resync(){ // after a reconnect: refetch what was missed while the stream was down
  hist(IV,()=>seedIv(IV));hist('15m',()=>seedIv('15m'));load15(lastT!=null?lastT-60000:null);
}
function connect(){
  const s=`${SYM.toLowerCase()}@aggTrade/${SYM.toLowerCase()}@kline_${IV}/${SYM.toLowerCase()}@kline_15m/${SYM.toLowerCase()}@bookTicker`;
  ws=new WebSocket(`${WS[hostI%WS.length]}/stream?streams=${s}`);
  ws.onopen=()=>{retry=0;conn='live';stat();if(everOpen)resync();everOpen=true};
  ws.onmessage=e=>{
    let m;try{m=JSON.parse(e.data).data}catch(err){return}
    if(!m)return;
    if(m.e==='aggTrade')addTrade(+m.p,+m.q,m.T,m.m);
    else if(m.e==='kline'&&m.k)onKline(m.k);
    else if(m.b!==undefined&&m.a!==undefined){mid=(+m.b+ +m.a)/2;$('px').textContent=document.title=mid.toFixed(DP);schedule()} // bookTicker: mid = (bid+ask)/2
  };
  ws.onclose=()=>{
    conn='reconnecting…';stat();
    hostI++;setTimeout(connect,Math.min(1000*2**retry++,15000));
  };
  ws.onerror=()=>ws.close();
}

function makeChart(cv,cfg){
  const g=cv.getContext('2d');
  const src=()=>cfg.main?(TF==='5m'?k5:c15):c15,sec=()=>cfg.main?TF==='15s':true;
  const TS=()=>sec()?{hour:'2-digit',minute:'2-digit',second:'2-digit'}:{hour:'2-digit',minute:'2-digit'};
let W=0,H=0,raf=0,geo=null,view=null,hl=null,drag=null,hitEdge=null,dragEdge=null,boxTool=0,dotTool=0,draft=null,off=0,pan=null,sc=null,ysc=1,ypan=0,N=cfg.N,mode=cfg.mode,hover=-1,mouse=null,profs=[],arrLen=0,moveInfo=null,tpoFrac=null,divDrag=false,lbT=null,fit=null,lock=null; // fit = auto-fitted price range, lock = range frozen once the chart has been dragged
const pts=new Map();let pinch=null; // pointers currently down on this canvas; pinch = two-finger zoom in progress
const pdist=()=>{const [a,b]=[...pts.values()];return Math.max(10,Math.hypot(a.x-b.x,a.y-b.y))};
function size(){
  const r=cv.getBoundingClientRect(),d=devicePixelRatio||1;
  W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;g.setTransform(d,0,0,d,0,0);draw();
}
addEventListener('resize',size);
function sched(){if(!raf)raf=requestAnimationFrame(()=>{raf=0;draw()})}
function nice(x){const e=Math.pow(10,Math.floor(Math.log10(x))),f=x/e;return (f<1.5?1:f<3.5?2:f<7.5?5:10)*e}

const okC=c=>!!c&&Number.isFinite(c.h)&&Number.isFinite(c.l)&&Number.isFinite(c.o)&&Number.isFinite(c.c);
function draw(){
  try{drawInner();if(cfg.main)$('info').style.color=''}
  catch(e){
    console.error(e);
    const d=devicePixelRatio||1;cv.width=cv.width;g.setTransform(d,0,0,d,0,0); // reset canvas state (clip stack)
    if(cfg.main){const el=$('info');el.style.color='#c0392b';el.textContent='Draw error: '+e.message}
  }
}
function drawInner(){
  g.clearRect(0,0,W,H);
  const arr=mode==='lb'?lbBars(src()):src();arrLen=arr.length;
  if(mode==='lb'){ // a panned line-break view is counted in bricks: stay on the same bricks when new ones print
    if(off>0&&lbT!=null)for(let i=arr.length-1;i>=0&&arr[i].t>lbT;i--)off++;
    lbT=arr.length?arr[arr.length-1].t:null;
  }else lbT=null;
  off=Math.max(-(N-3),Math.min(off,Math.max(0,arr.length-N)));
  if(cfg.main&&TF==='5m'&&seeded[IV]&&arr.length-off-N<=0)older(IV); // view reaches the oldest loaded candle: load more
  const vis=arr.slice(Math.max(0,arr.length-off-N),arr.length-off).filter(okC);
  if(!vis.length||!W)return;
  const dayStart=Math.floor(vis[vis.length-1].t/86400000)*86400000;
  const dayC=cfg.tpo?k15.filter(c=>c.t>=dayStart&&okC(c)):[];
  let hi=-1e12,lo=1e12;vis.concat(dayC).forEach(c=>{hi=Math.max(hi,c.h);lo=Math.min(lo,c.l)});
  const pad=(hi-lo)*0.06||1;hi+=pad;lo-=pad;fit={hi,lo};if(lock){hi=lock.hi;lo=lock.lo}
  const hi0=hi,lo0=lo,mid0=(hi+lo)/2+ypan;hi=mid0+(hi0-lo0)/2*ysc;lo=mid0-(hi0-lo0)/2*ysc;
  const axW=62,tpoW=cfg.tpo?(tpoFrac!=null?Math.max(80,Math.min(W*0.75,tpoFrac*W)):Math.max(80,W*0.20-5)):0,legendH=cfg.main?22:0,timeH=16,px0=W-axW; // legendH = room for the TPO session legend and day labels
  const x0=tpoW+10,x1=W-axW-Math.max(cfg.main?60:24,W*(cfg.main?0.07:0.04)),top=8,bot=H-legendH-timeH-6,ch=bot-top;
  const Y=p=>top+(hi-p)/(hi-lo)*ch;
  // price tag in the axis column / time tag under the chart
  const ptag=(y,txt,bg,fg='#fff')=>{g.fillStyle=bg;g.fillRect(px0,y-9,axW,18);g.fillStyle=fg;g.textAlign='left';g.textBaseline='middle';g.fillText(txt,px0+5,y)};
  const ttag=(cx,txt,bg,fg='#fff')=>{const tw=g.measureText(txt).width+12,bx=Math.max(4,Math.min(px0-tw,cx-tw/2));
    g.fillStyle=bg;g.fillRect(bx,bot+2,tw,16);g.fillStyle=fg;g.textAlign='center';g.textBaseline='middle';g.fillText(txt,bx+tw/2,bot+10)};
  const dlabel=t=>{const d=new Date(t);return d.toLocaleDateString([],{day:'2-digit',month:'short'})+' '+d.toLocaleTimeString([],TS())};

  // grid + price axis
  const gs=Math.max(1,nice((hi-lo)/6));g.font='11px ui-monospace,Menlo,monospace';g.textBaseline='middle';

    pinch={d:pdist(),N:Math.min(N,Math.max(20,arrLen))};pan=null;sc=null;drag=null;divDrag=false;e.preventDefault();return}
  if(pts.size>2)return;
  move(e);try{cv.setPointerCapture(e.pointerId)}catch(err){} // touch has no hover: hit-test at the press point, and keep receiving moves outside the canvas
  if(dotTool){dotClick(e);e.preventDefault();return}
  if(boxTool){boxClick(e);e.preventDefault();return}
  {const rc0=cv.getBoundingClientRect();if(isDiv(e.clientX-rc0.left,e.clientY-rc0.top)){divDrag=true;e.preventDefault();return}}
  if(hl){drag=hl;dragEdge=hitEdge;e.preventDefault();
    if(dragEdge==='move'){
      const rc=cv.getBoundingClientRect(),mx=e.clientX-rc.left,my=e.clientY-rc.top,se=geoAt(hl.t);
      moveInfo={y:my,lo:hl.lo,hi:hl.hi,si:se?geo.indexOf(se):-1,ci:geo.findIndex(q=>mx>=q.x&&mx<q.x+q.w),rng:view.hi-view.lo,ch:view.ch};
    }
    return}
  if(view){if(e.clientX-cv.getBoundingClientRect().left>view.px0){sc={y:e.clientY,v:ysc};cv.style.cursor='ns-resize'}else{if(!lock&&fit)lock=fit;pan={x:e.clientX,y:e.clientY,off,yp:ypan,rng:view.hi-view.lo,vy:false};cv.style.cursor='grabbing'}e.preventDefault()}
});
const release=()=>{drag=null;divDrag=false;if(pan||sc){pan=null;sc=null;cv.style.cursor='crosshair'}};
addEventListener('pointerup',release);addEventListener('pointercancel',release);
cv.addEventListener('pointerup',e=>{pts.delete(e.pointerId);if(pts.size<2)pinch=null});cv.addEventListener('pointercancel',e=>{pts.delete(e.pointerId);if(pts.size<2)pinch=null});
cv.addEventListener('dblclick',()=>{if(hl){lines=lines.filter(l=>l!==hl);hl=null;cv.style.cursor='crosshair';draw()}else if(mouse&&isDiv(mouse.x,mouse.y)){tpoFrac=null;draw()}else if(view&&mouse&&mouse.x>view.px0){ysc=1;ypan=0;lock=null;draw()}});
addEventListener('keydown',e=>{
  if(activeChart!==api)return;
  if(e.altKey&&e.code==='KeyH'){e.preventDefault();addLine('h')}
  else if(e.altKey&&e.code==='KeyV'){e.preventDefault();addLine('v')}
  else if(e.altKey&&e.code==='KeyB'){e.preventDefault();if(draft)lines=lines.filter(l=>l!==draft);draft=null;dotTool=0;boxTool=1;const m=mouseAt();if(m){draft={k:'b',t:m.o.c.t,lo:m.p,hi:m.p};lines.push(draft);boxTool=2}draw()}
  else if(e.altKey&&e.code==='KeyJ'){e.preventDefault();if(draft)lines=lines.filter(l=>l!==draft);draft=null;boxTool=0;dotTool=1;const m=mouseAt();if(m){lines.push({k:'d',t:m.o.c.t,p:m.p});dotTool=0}draw()}
  else if(e.key==='Escape'&&(boxTool||dotTool)){if(draft)lines=lines.filter(l=>l!==draft);draft=null;boxTool=0;dotTool=0;draw()}
  else if((e.key==='Delete'||e.key==='Backspace')&&hl){lines=lines.filter(l=>l!==hl);hl=null;draw()}
});

cv.addEventListener('wheel',e=>{
  e.preventDefault();
  // zoom relative to what is actually shown (line-break charts have fewer bricks than candles, so N can exceed what exists)
  const sg=Math.sign(e.deltaY),mx=Math.max(20,Math.min(arrLen||src().length,3000)),b0=Math.min(N,mx);
  let n=Math.round(b0*(sg>0?1.12:1/1.12));if(n===b0)n+=sg;
  N=Math.max(20,Math.min(mx,n));if(cfg.main)ui();draw();
},{passive:false});

  const fcache=new Map();
  // flag = body size > percentile of last BIG_WIN bodies AND volume > percentile of last BIG_WIN volumes (current bar included)
  function bigFlags(arr,i0,i1){
    const out=new Map(),tag=(cfg.main?TF:'')+mode;
    if(fcache.size>30000)fcache.clear();
    const r=Math.ceil(BIG_PERC*BIG_WIN)-1;
    for(let k=Math.max(i0,BIG_WIN-1);k<i1;k++){
      const c=arr[k];if(!c||c.h==null)continue;
      const key=tag+'|'+c.t+'|'+c.o+'|'+c.c+'|'+c.v+'|'+arr[k-BIG_WIN+1].t;
      let f=fcache.get(key);
      if(f===undefined){
        const bs=new Float64Array(BIG_WIN),vs=new Float64Array(BIG_WIN);
        for(let j=0;j<BIG_WIN;j++){const q=arr[k-BIG_WIN+1+j];bs[j]=Math.abs(q.c-q.o);vs[j]=q.v}
        bs.sort();vs.sort();
        f=Math.abs(c.c-c.o)>bs[r]&&c.v>vs[r];fcache.set(key,f);
      }
      if(f)out.set(c,true);
    }
    return out;
  }
  function newCandle(a){if(mode!=='lb'&&src()===a&&off>0)off++} // line-break views re-anchor on bricks in drawInner
  cv.addEventListener('pointerenter',()=>{activeChart=api});
  cv.addEventListener('pointermove',()=>{activeChart=api});
  const api={sched,draw,newCandle,size,
    resetView:()=>{N=cfg.N;off=0;ysc=1;ypan=0;lock=null;tpoFrac=null;draft=null;boxTool=0;dotTool=0;hl=null;drag=null;if(cfg.main)ui();draw()},
    getState:()=>({N,mode,off,ysc,ypan,lock,tpoFrac,TF:cfg.main?TF:undefined,nTpo:cfg.main?nTpo:undefined}),
    setState:st=>{
      if(!st)return;
      if(st.N>=20&&st.N<=3000)N=st.N;
      if(['eq','std','lb'].includes(st.mode))mode=st.mode;
      if(Number.isFinite(st.off))off=st.off;
      if(st.ysc>0)ysc=st.ysc;
      if(st.tpoFrac>0)tpoFrac=st.tpoFrac;
      if(Number.isFinite(st.ypan))ypan=st.ypan;
      if(st.lock&&st.lock.hi>st.lock.lo)lock={hi:st.lock.hi,lo:st.lock.lo};
      if(cfg.main){
        if(st.TF==='5m'||st.TF==='15s'){TF=st.TF;$('sym').textContent=SYM+' '+TF}
        if([1,2,3].includes(st.nTpo))nTpo=st.nTpo;
        ui();
      }
      draw();
    }};
  function mkBtns(el,opts,get,set){
    el.innerHTML='';
    opts.forEach(([v,l])=>{const b=document.createElement('button');b.textContent=l;
      b.className=get()===v?'a':'';b.onclick=()=>{set(v);mkBtns(el,opts,get,set);draw()};el.appendChild(b)});
  }
  function ui(){
    mkBtns($('modeBtns'),[['eq','Volume candles'],['std','Standard'],['lb','Line break']],()=>mode,v=>mode=v);
    mkBtns($('tfBtns'),[['15s','15s'],['5m','5m']],()=>TF,v=>setTF(v));
    mkBtns($('tpoBtns'),[[1,'1d'],[2,'2d'],[3,'3d']],()=>nTpo,v=>nTpo=v);
    mkBtns($('nBtns'),[[40,'40'],[80,'80'],[120,'120'],[160,'160'],[288,'288'],[576,'576']],()=>N,v=>N=v);
  }
  
  function setTF(v){TF=v;off=0;lock=null;draft=null;boxTool=0;dotTool=0;$('sym').textContent=SYM+' '+v;draw()}
  if(cfg.main)ui();
  if(window.ResizeObserver)new ResizeObserver(()=>size()).observe(cv);
  size();
  return api;
}
const mainChart=makeChart($('c'),{main:true,mode:'eq',N:288,tpo:true});
const miniChart=makeChart($('mc'),{main:false,mode:'lb',N:200,tpo:false});
charts=[mainChart,miniChart];

// Ctrl+S (or Cmd+S) saves drawings + all settings in this browser's localStorage; restored on reload
const SAVE_KEY='btcfdusd-state-v2';
function toast(t){const el=$('toast');el.textContent=t;el.style.opacity=1;clearTimeout(toast.h);toast.h=setTimeout(()=>{el.style.opacity=0},1800)}
let miniBox=null;
function snapshot(){
  const r=mini.getBoundingClientRect();
  if(r.width>0)miniBox={x:Math.round(r.left),y:Math.round(r.top),w:Math.round(r.width),h:Math.round(r.height)};
  return {v:2,lines:lines.filter(l=>!(l.k==='b'&&l.lo===l.hi)),main:mainChart.getState(),mini:miniChart.getState(),
    win:Object.assign({hidden:mini.style.display==='none'},miniBox||{})};
}
function restore(){
  let st=null;
  try{st=JSON.parse(localStorage.getItem(SAVE_KEY)||'null')}catch(e){}
  if(!st){try{const old=JSON.parse(localStorage.getItem('btcfdusd-drawings-v1')||'null');if(Array.isArray(old))st={lines:old}}catch(e){}}
  if(!st)return;
  if(Array.isArray(st.lines))lines.push(...st.lines.filter(l=>l&&l.k));
  if(st.win){
    if(st.win.w>0&&st.win.h>0){
      const w=st.win.w,h=st.win.h;
      miniBox={x:st.win.x!=null?st.win.x:innerWidth-w-12,y:st.win.y!=null?st.win.y:innerHeight-h-12,w,h};setMiniBox(miniBox);
    }
    if(st.win.hidden)mini.style.display='none';
  }
  mainChart.setState(st.main);miniChart.setState(st.mini);schedule();
}
addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&!e.altKey&&String(e.key).toLowerCase()==='s'){
    e.preventDefault();
    try{const snap=snapshot();localStorage.setItem(SAVE_KEY,JSON.stringify(snap));toast('Layout, settings and drawings saved ('+snap.lines.length+' drawings)')}
    catch(err){toast('Could not save: browser storage is blocked')}
  }
});

// floating 15s line-break window: drag the top-left grip to resize (anchored bottom-right)
const mini=$('mini');
function setMiniBox(bx){ // keep the window inside the viewport
  const w=Math.max(240,Math.min(innerWidth,bx.w)),h=Math.max(160,Math.min(innerHeight,bx.h));
  mini.style.left=Math.max(0,Math.min(innerWidth-w,bx.x))+'px';mini.style.top=Math.max(0,Math.min(innerHeight-h,bx.y))+'px';
  mini.style.width=w+'px';mini.style.height=h+'px';
}
{const r0=mini.getBoundingClientRect();setMiniBox({x:innerWidth-r0.width-12,y:innerHeight-r0.height-12,w:r0.width,h:r0.height})} // default: bottom-right
addEventListener('resize',()=>{const r=mini.getBoundingClientRect();if(r.width>0)setMiniBox({x:r.left,y:r.top,w:r.width,h:r.height})});
document.querySelectorAll('#mini .grip').forEach(gp=>gp.addEventListener('pointerdown',e=>{ // resize from any corner; the opposite corner stays put
  const c=gp.dataset.c,r=mini.getBoundingClientRect(),sx=e.clientX,sy=e.clientY;
  gp.setPointerCapture(e.pointerId);e.preventDefault();
  const mv=ev=>{
    const dx=ev.clientX-sx,dy=ev.clientY-sy;let x1=r.left,x2=r.right,y1=r.top,y2=r.bottom;
    if(c[1]==='l')x1=Math.max(0,Math.min(r.right-240,r.left+dx));else x2=Math.min(innerWidth,Math.max(r.left+240,r.right+dx));
    if(c[0]==='t')y1=Math.max(0,Math.min(r.bottom-160,r.top+dy));else y2=Math.min(innerHeight,Math.max(r.top+160,r.bottom+dy));
    setMiniBox({x:x1,y:y1,w:x2-x1,h:y2-y1});
  };
  const up=()=>{gp.removeEventListener('pointermove',mv);gp.removeEventListener('pointerup',up)};
  gp.addEventListener('pointermove',mv);gp.addEventListener('pointerup',up);
}));
$('mhead').addEventListener('pointerdown',e=>{ // title bar: move the window
  if(e.target.closest&&e.target.closest('button'))return;
  const hd=$('mhead'),r=mini.getBoundingClientRect(),sx=e.clientX,sy=e.clientY;
  hd.setPointerCapture(e.pointerId);e.preventDefault();
  const mv=ev=>setMiniBox({x:r.left+ev.clientX-sx,y:r.top+ev.clientY-sy,w:r.width,h:r.height});
  const up=()=>{hd.removeEventListener('pointermove',mv);hd.removeEventListener('pointerup',up)};
  hd.addEventListener('pointermove',mv);hd.addEventListener('pointerup',up);
});
$('mx').onclick=()=>{mini.style.display='none'};
$('miniTog').onclick=()=>{mini.style.display=mini.style.display==='none'?'flex':'none';miniChart.size()};

addEventListener('keydown',e=>{
  if(e.altKey&&e.code==='KeyR'){
    e.preventDefault();
    if(lines.length&&!confirm('Reset both charts and delete all '+lines.length+' drawings?'))return;
    lines=[];linesSig='';
    mini.style.display='flex';mini.style.width='';mini.style.height='';  // back to the CSS default size, bottom-right
    {const r=mini.getBoundingClientRect();setMiniBox({x:innerWidth-r.width-12,y:innerHeight-r.height-12,w:r.width,h:r.height})}
    mainChart.resetView();miniChart.resetView();schedule();
    toast('Charts reset to default, drawings deleted');
  }
});
$('sym').textContent=SYM+' '+TF;document.title=SYM;
restore();
connect();hist(IV,()=>seedIv(IV));hist('15m',()=>seedIv('15m'));load15(null);
