      }
      body.noctl .ctl {

      }
      .ctl {
        display: flex;
        gap: 6px 10px;
        flex-wrap: wrap;
        min-width: 0;
        flex: 1 1 100%;

      /* the Main chart section keeps to the right edge */

    <script>
      /* DP = decimals shown on prices */
      const SYM = "BTCFDUSD",
        IV = "5m",
        TPO_MS = 1800000,
        DP = 0;
      /*
       * TPO letter colours by UTC hour: Asia (red) →
       * Europe (blue) → US open (green) → US late (yellow)
       */

      const STOPS = [
        [0, [229, 57, 53]],
        [8, [30, 100, 230]],
        [14, [8, 153, 129]],
        [21, [225, 165, 0]],
      ];
      /*
       * 'big candle + high volume' circles: window length
       * and percentile (nearest-rank, as in the Pine
       * script)
       */
      const BIG_WIN = 150,
        BIG_PERC = 0.95;
      const LET =
        "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz";
      function tpoColor(i, a = 1) {
        const h = Math.min(21, i * 0.5);
        let k = 0;
        while (k < STOPS.length - 2 && h > STOPS[k + 1][0]) k++;
        const [h0, c0] = STOPS[k],
          [h1, c1] = STOPS[k + 1],
          f = Math.max(0, Math.min(1, (h - h0) / (h1 - h0)));
        const rgb = c0.map((v, j) =>
          Math.round(v + (c1[j] - v) * f),
        );
        return "rgba(" + rgb.join(",") + "," + a + ")";
      }
      /*
       * sub POCs, same rules as simplified/POC/poc.py: the
       * brick shrinks 5% a pass from `start` down to the
       * chart's brick `fine`. A peak counts once it stands
       * a quarter of its own count above its valley. A POC
       * is born only while the brick is `vol` or more and
       * range/10 (or 1.5 bricks) away from the others;
       * smaller bricks only refine it, within `vol` of
       * where detection left it. Up to 3 per day.
       */
      function peaks(c) {
        /* [row, count, prominence]; flat tops merged */
        const R = [],
          out = [];
        c.forEach((v, r) => {
          const z = R[R.length - 1];
          if (z && z[0] === v) z[2] = r;
          else R.push([v, r, r]);
        });
        R.forEach(([v, a, b], k) => {
          const up = (j) => j >= 0 && j < R.length && R[j][0] > v;
          if (up(k - 1) || up(k + 1)) return;
          /* lowest point before something higher, each side */
          const sd = [];
          for (const d of [-1, 1]) {
            let m = null;
            for (
              let j = k + d;
              j >= 0 && j < R.length && R[j][0] <= v;
              j += d
            )
              m = Math.min(R[j][0], m == null ? v : m);
            if (m != null) sd.push(m);
          }
          out.push([
            (a + b) / 2,
            v,
            sd.length ? v - Math.max(...sd) : v,
          ]);
        });
        return out;
      }
      const subCache = new Map(),
        /* zigzag points per day (see the profiles) */
        zCache = new Map(),
        /* St colours of closed periods, frozen (see stAt) */
        stFz = new Map();
      /* first brick of the sub POC search: SUB_K x the vol
         step, whatever the view, so every device agrees */
      const SUB_K = 5;
      function subPocs(dS, ps, vol, fine) {
        if (!ps.length) return [];
        const start = SUB_K * vol,
          z = ps[ps.length - 1],
          key = [dS, ps.length, z.h, z.l, vol, fine];
        if (subCache.has(key.join())) return subCache.get(key.join());
        let lo = Infinity,
          hi = -Infinity;
        ps.forEach((q) => {
          lo = Math.min(lo, q.l);
          hi = Math.max(hi, q.h);
        });
        const rg = hi - lo,
          pocs = [];
        for (let s = start; s >= fine; s *= 0.95) {
          /* TPO count per row, rows anchored on the day low */
          const c = [];
          ps.forEach((q) => {
            const a = Math.floor((q.l - lo) / s),
              b = Math.floor((q.h - lo) / s);
            for (let r = a; r <= b; r++) c[r] = (c[r] || 0) + 1;
          });
          for (let r = 0; r < c.length; r++) c[r] = c[r] || 0;
          const pk = peaks(c),
            top = Math.max(...pk.map((p) => p[1])),
            free = pk
              .filter(([, v, p]) => v === top || p >= 0.25 * v)
              .map(([r, v]) => [Math.min(hi, lo + (r + 0.5) * s), v])
              .sort((x, y) => y[1] - x[1]),
            gap = Math.max(rg / 10, 1.5 * s),
            moved = new Set(),
            pr = [];
          pocs.forEach((P, i) =>
            free.forEach((q) =>
              pr.push([Math.abs(q[0] - P.px), i, q]),
            ),
          );
          /* closest pairs first */
          pr.sort(
            (x, y) =>
              x[0] - y[0] ||
              x[1] - y[1] ||
              x[2][0] - y[2][0] ||
              x[2][1] - y[2][1],
          );
          pr.forEach(([d, i, q]) => {
            const P = pocs[i];
            if (d >= gap || moved.has(i) || !free.includes(q)) return;
            if (s < vol && Math.abs(q[0] - P.at) >= vol) return;
            moved.add(i);
            free.splice(free.indexOf(q), 1);
            P.px = q[0];
          });
          free.forEach((q) => {
            if (s < vol || pocs.length > 2) return;
            if (pocs.every((P) => Math.abs(q[0] - P.px) >= gap))
              pocs.push({ born: s, px: q[0] });
          });
          if (s >= vol) pocs.forEach((P) => (P.at = P.px));
        }
        if (subCache.size > 300) subCache.clear();
        subCache.set(key.join(), pocs);
        return pocs;
      }
      /*
       * steps colours (simplified/POC): from each sub POC
       * one row each side per step, up to the lowest row
       * towards the next POC or the day's end; green = more
       * bricks above so far, red = more below, stronger =
       * more lopsided. A POC row takes its P colour, the
       * low rows in between stay grey. Map row -> colour.
       */
      const SPC = ["0,51,102", "47,128,200", "107,118,132"],
        SGREY = "rgba(107,118,132,.3)";
      function stepCols(rows, step, sp) {
        const ks = [...rows.keys()],
          r0 = Math.min(...ks),
          c = [],
          out = new Map();
        for (let r = r0; r <= Math.max(...ks); r++)
          c.push((rows.get(r) || []).length);
        const n = c.length,
          rs = sp.map((S) => {
            const r = Math.floor(S.px / step) - r0;
            return Math.min(n - 1, Math.max(0, r));
          });
        /* lowest row between two POC rows */
        const cut = (x, y) => {
          let m = x + 1;
          for (let r = x + 2; r < y; r++) if (c[r] < c[m]) m = r;
          return m;
        };
        rs.forEach((p, k) => {
          const dn = Math.max(-1, ...rs.filter((r) => r < p)),
            up = Math.min(n, ...rs.filter((r) => r > p)),
            a = dn < 0 ? 0 : Math.min(p, cut(dn, p) + 1),
            b = up >= n ? n - 1 : Math.max(p, cut(p, up) - 1);
          out.set(p + r0, "rgb(" + SPC[k] + ")");
          const J = Math.max(b - p, p - a);
          for (let j = 1, U = 0, L = 0; j <= J; j++) {
            U += p + j <= b ? c[p + j] : 0;
            L += p - j >= a ? c[p - j] : 0;
            const v = (U - L) / (U + L || 1),
              /* only a clear imbalance (over 60 / 40) */
              col = Math.abs(v) <= 0.2
                ? SGREY
                : (v > 0 ? "rgba(8,153,129," : "rgba(229,57,53,") +
                  (0.15 + 0.85 * Math.abs(v)).toFixed(2) + ")";
            if (p + j <= b) out.set(p + j + r0, col);
            if (p - j >= a) out.set(p - j + r0, col);
          }
        });
        return out;
      }
      /*
       * swing zigzag over POC points in time order: a point
       * below the last low is a new low, and the highest
       * point between the previous low and it becomes the

          slotsFor = (v) => Math.round(v / (1 - ROOM));
        let W = 0,
          H = 0,
          raf = 0,
          geo = null,
          view = null,
          hl = null,
          drag = null,
          hitEdge = null,
          dragEdge = null,
          boxTool = 0,
          dotTool = 0,
          draft = null,
          off = -Math.round(slotsFor(cfg.N) * ROOM),
          pan = null,
          sc = null,
          ysc = 1,
          ypan = 0,
          N = slotsFor(cfg.N),
          mode = cfg.mode,
          hover = -1,
          mouse = null,
          profs = [],
          arrLen = 0,
          moveInfo = null,
          tpoFrac = null,
          /* DPoc candles shown: 7 at start, wheel 3-60 */
          pcN = 7,
          /* SPoc window: width once dragged, slots shown
             (11: 7 candles and 4 empty on the right) */
          spPx = null,
          spN = 11,
          /* 4 empty slots on the right by default */
          spBack = -4,
          /* VP alert events, from the last draw */
          vpEv = null,
          /* DPoc panel P&F: columns shown (wheel) */
          pfN = 200,
          /* pcPx: DPoc width once dragged (null = as the

          pcPx = null,
          full = null,
          /* pcBack / tpoBack: candles / days dragged back */
          pcBack = 0,
          /* subX: the chart's slide between two candles, 0-1 */
          subX = 0,
          tpoBack = 0,
          divDrag = false,
          lbT = null,
          fit = null,
          lock = null,
          /* Alt+R: centre the prices on the latest POC */
          pocHome = false;
        /* pan position of the default view: latest candle,
           with the empty room at its right */
        const home = () => -Math.round(N * ROOM);
        /*
         * pointers currently down on this canvas; pinch =
         * two-finger zoom in progress
         */
        const pts = new Map();
        let pinch = null;
        const pdist = () => {
          const [a, b] = [...pts.values()];
          return Math.max(10, Math.hypot(a.x - b.x, a.y - b.y));
        };
        const pmid = () => {
          const [a, b] = [...pts.values()];
          return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
        };
        /* full screen: one window fills the screen, header,
           info bar and 15s window hide */
        function setFull(k) {
          const was = full,
            de = document.documentElement;
          full = k;
          document.body.classList.toggle("fs", !!k);
          try {
            if (k && !document.fullscreenElement)
              de.requestFullscreen().catch(() => {});
            if (!k && was && document.fullscreenElement)
              document.exitFullscreen().catch(() => {});
          } catch (e) {}
          requestAnimationFrame(() =>
            charts.forEach((h) => h.size()),
          );
        }
        /* Esc or the phone's back gesture leaves full screen */
        if (cfg.main)
          document.addEventListener("fullscreenchange", () => {
            if (!document.fullscreenElement && full) setFull(null);
          });
        function size() {
          const r = cv.getBoundingClientRect(),
            d = devicePixelRatio || 1;
          W = r.width;
          H = r.height;
          cv.width = W * d;
          cv.height = H * d;
          g.setTransform(d, 0, 0, d, 0, 0);
          draw();
        }
        addEventListener("resize", size);
        function sched() {
          if (!raf)
            raf = requestAnimationFrame(() => {
              raf = 0;
              draw();
            });
        }
        function nice(x) {
          const e = Math.pow(10, Math.floor(Math.log10(x))),
            f = x / e;
          return (
            (f < 1.5 ? 1 : f < 3.5 ? 2 : f < 7.5 ? 5 : 10) * e
          );
        }

        const okC = (c) =>
          !!c &&
          Number.isFinite(c.h) &&
          Number.isFinite(c.l) &&
          Number.isFinite(c.o) &&
          Number.isFinite(c.c);
        function draw() {
          try {
            drawInner();
            if (cfg.main) alignHdr();
            if (cfg.main) $("info").style.color = "";
          } catch (e) {
            console.error(e);
            /* reset canvas state (clip stack) */
            const d = devicePixelRatio || 1;
            cv.width = cv.width;
            g.setTransform(d, 0, 0, d, 0, 0);
            if (cfg.main) {
              const el = $("info");
              el.style.color = "#c0392b";
              el.textContent = "Draw error: " + e.message;

        }
        /*
         * header sections over their windows: profiles, POC
         * candles, P&F (the chart section keeps to the right

        let hdrKey = "";
        function alignHdr() {
          if (!view || document.body.classList.contains("noctl"))
            return;
          const v = view,
            ox = cv.getBoundingClientRect().left,
            T = [
              ["Profile and levels", 0],
              [
                "Chart",
                v.spW ? v.sL : !pcPf && v.pcW ? v.pS : null,
              ],
              ["P&F", pcPf && v.pcW ? v.pS : null],
            ],
            key = [W, v.sL, v.pS, v.x0, pcPf, v.spW].join();
          if (key === hdrKey) return;
          hdrKey = key;
          let prev = null;
          T.forEach(([t, x]) => {
            const el = document.querySelector(
              '.ctl .grp[title="' + t + '"]',
            );
            if (!el) return;
            el.style.marginLeft = "";
            const r = el.getBoundingClientRect();
            if (
              x != null &&
              prev &&
              Math.abs(r.top - prev.top) < 4 &&
              ox + x > r.left

              el.style.marginLeft = ox + x - r.left + "px";
              /* pushed onto the next line: leave it as it was */
              const t2 = el.getBoundingClientRect().top;

            }
            prev = el.getBoundingClientRect();
          });
        }
        function drawInner() {
          g.clearRect(0, 0, W, H);
          const arr = mode === "lb" ? lbBars(src()) : src();
          arrLen = arr.length;
          /*
           * a panned line-break view is counted in bricks:
           * stay on the same bricks when new ones print
           */
          if (mode === "lb") {
            if (off > 0 && lbT != null)
              for (
                let i = arr.length - 1;
                i >= 0 && arr[i].t > lbT;
                i--
              )
                off++;
            lbT = arr.length ? arr[arr.length - 1].t : null;
          } else lbT = null;
          off = Math.max(
            -(N - 3),
            Math.min(off, Math.max(0, arr.length - N)),
          );
          if (off >= arr.length - N) subX = 0;
          /* view reaches the oldest loaded candle: load more */
          if (
            cfg.main &&
            TF === "5m" &&
            seeded[IV] &&
            arr.length - off - N <= 0
          )
            older(IV);
          const vis = arr
            .slice(
              Math.max(0, arr.length - off - N),
              arr.length - off,
            )
            .filter(okC);
          if (!vis.length || !W) return;
          /*
           * legendH = room for the TPO session legend and day
           * labels
           */
          /* DPoc / profiles full screen: no room right of the
             chart, they reach the price scale */
          const axW = 62,
            side =
              cfg.main &&
              (full === "pc" || full === "tpo" || full === "sp"),
            x1 =
              W -
              axW -
              (side
                ? 4
                : Math.max(
                    cfg.main ? 60 : 24,
                    W * (cfg.main ? 0.07 : 0.04),
                  )),
            tpoW0 = cfg.tpo
              ? tpoFrac != null
                ? Math.max(80, Math.min(W * 0.75, tpoFrac * W))
                : Math.max(80, W * 0.2 - 5)
              : 0,
            /*
             * full = "main" / "tpo" / "pc": that window takes
             * the width, the others hide (the chart keeps a
             * thin strip so its scale still works)
             */
            fl = cfg.main ? full : null,
            /* SPoc and P&F both on: 4 windows, profiles 20%,
               sub POC candles 10%, P&F 30%, chart 40% */
            four =
              cfg.main && cfg.tpo && pcPf && (pocC || pcSub) && !fl,
            /* "sp" full: the POC candles take the P&F panel */
            tpoW =
              !cfg.tpo || fl === "main" || fl === "pc" || fl === "sp"
              ? 0
              : fl === "tpo"
                ? x1 - 25
                : tpoW0,
            pcW = !(cfg.main && cfg.tpo && (pocC || pcSub || pcPf)) ||
              fl === "main" || fl === "tpo"
              ? 0
              : fl === "pc" || fl === "sp"
                ? x1 - 35
                : pcPx ||
                  /* P&F 40%, the chart 60% of what the profiles
                     leave */
                  (four
                    ? Math.round(0.3 * W)
                    : pcPf
                      ? Math.round(0.4 * (W - tpoW - 20))
                      : tpoW0),
            spW = four ? spPx || Math.round(W * 0.07) : 0,
            legendH = cfg.main ? 22 : 0,
            timeH = 16,
            px0 = W - axW;
          /* profiles at the far left, then the DPoc panel (pcW
             wide, from pL), then the chart from x0; tR = the
             profiles' right edge */
          const pcOff = pcW ? pcW + 10 : 0,
            spOff = spW ? spW + 10 : 0,
            x0 = tpoW + 10 + spOff + pcOff,
            pL = x0 - 3 - pcW,
            /* sL: the SPoc window's left edge; pS: where the

            sL = pL - spOff,
            pS = pL - 2,
            tR = sL - 2,
            top = 8,
            bot = H - legendH - timeH - 6,
            ch = bot - top;
          /*
           * candle widths: Standard = sw each. Volume candles:
           * a small minimum plus a share of the rest in
           * proportion to volume (true size)
           */
          const cw = x1 - x0,
            slots = vis.length + Math.max(0, -off),
            sw = cw / slots,
            cwE = sw * vis.length,
            vsum = vis.reduce((s, c) => s + (c.v || 0), 0) || 1,
            minW = Math.min(3, sw * 0.4),
            wOf = (c) =>
              mode === "eq"
                ? minW +
                  ((cwE - vis.length * minW) * (c.v || 0)) / vsum
                : sw;
          const dayStart = dayOf(vis[vis.length - 1].t);
          const dayC = cfg.tpo
            ? k15.filter((c) => c.t >= dayStart && okC(c))
            : [];
          let hi = -1e12,
            lo = 1e12;
          vis.concat(dayC).forEach((c) => {
            hi = Math.max(hi, c.h);
            lo = Math.min(lo, c.l);

          const pad = (hi - lo) * 0.06 || 1;
          hi += pad;
          lo -= pad;
          fit = { hi, lo };
          if (lock) {
            hi = lock.hi;
            lo = lock.lo;
          }
          const hi0 = hi,
            lo0 = lo,
            mid0 = (hi + lo) / 2 + ypan;
          hi = mid0 + ((hi0 - lo0) / 2) * ysc;
          lo = mid0 - ((hi0 - lo0) / 2) * ysc;
          const Y = (p) => top + ((hi - p) / (hi - lo)) * ch;

          const panel = (x, w) => {
            g.save();
            g.setLineDash([]);
            g.lineWidth = 1;
            g.strokeStyle = "#c3ccd6";
            g.beginPath();
            g.roundRect(x + 0.5, top - 3.5, w - 1, bot - top + 7, 4);
            g.stroke();
            g.restore();
          };

           * price tag in the axis column / time tag under the
           * chart
           */

          /* axis tags wait in tq until just before the
             crosshair (tagsNow), the vol ladder's white ones
             first, so coloured tags (zigzag, boxes, lines)
             sit on top of them */
          const tq = [];
          let tagsNow = false;
          const ptag = (y, txt, bg, fg = "#fff", font = g.font) => {
            if (!tagsNow) return void tq.push([y, txt, bg, fg, font]);
            g.font = font;
            g.fillStyle = bg;
            g.fillRect(px0, y - 9, axW, 18);
            g.fillStyle = fg;
            g.textAlign = "left";
            g.textBaseline = "middle";
            g.fillText(txt, px0 + 5, y);
          };
          /* atTop: at the top of the line instead */
          const ttag = (cx, txt, bg, fg = "#fff", atTop) => {
            const tw = g.measureText(txt).width + 12,
              bx = Math.max(4, Math.min(px0 - tw, cx - tw / 2)),
              ty = atTop ? top : bot + 2;
            g.fillStyle = bg;
            g.fillRect(bx, ty, tw, 16);
            g.fillStyle = fg;
            g.textAlign = "center";
            g.textBaseline = "middle";
            g.fillText(txt, bx + tw / 2, ty + 8);
          };
          const dlabel = (t) => {
            const d = new Date(t);
            return (
              d.toLocaleDateString([], {
                day: "2-digit",
                month: "short",
              }) +
              " " +
              d.toLocaleTimeString([], TS())
            );
          };

          /* grid + price axis */

          const gs = Math.max(1, nice((hi - lo) / 6));
          g.font = "11px ui-monospace,Menlo,monospace";
          g.textBaseline = "middle";
          for (let p = Math.ceil(lo / gs) * gs; p < hi; p += gs) {
            /* the main chart has no grid at all, lines or
               prices: its only horizontals are the vol steps */
            if (!cfg.main) {
              g.strokeStyle = "#eef0f3";
              g.beginPath();
              g.moveTo(4, Y(p));
              g.lineTo(W - axW, Y(p));
              g.stroke();
              g.fillStyle = "#6b7684";
              g.textAlign = "left";
              g.fillText(p.toFixed(DP), W - axW + 6, Y(p));
            }
          }

          /*
           * TPO (Market Profile): one brick per 30 min; up to
           * 5 UTC days side by side (oldest left, latest next
           * to the chart)
           */

          /*
           * a day's row size comes from the vol step (see
           * dayProf); without one, from the average range of
           * the two days before it. Either way it does not
           * depend on zoom or pan.
           * volAmt = the vol step as a price amount; a percent
           * is taken of the latest 15m close
           */
          const volRef = k15.length ? k15[k15.length - 1].c : 0,
            volAmt = volPct ? (volRef * volN) / 100 : volN;

          /* dayR = high/low of every loaded day */
          const gap = 10,
            DAY = 86400000,
            dayR = new Map();
          if (cfg.tpo)
            k15.forEach((c) => {
              if (!okC(c)) return;
              const k = dayOf(c.t),
                q = dayR.get(k);
              if (!q) dayR.set(k, { h: c.h, l: c.l });
              else {
                q.h = Math.max(q.h, c.h);
                q.l = Math.min(q.l, c.l);
              }
            });
          const prevR = (dS) => {
            const r = [prevDay(dS), prevDay(prevDay(dS))]
              .filter(
                (s) => k15.length && k15[0].t <= s && dayR.has(s),
              )
              .map((s) => dayR.get(s))
              .map((q) => q.h - q.l)

            return r.length
              ? r.reduce((a, b) => a + b, 0) / r.length

           * candle geometry first: the levels below are cut

          geo = [];
          /* exG: the older candle sliding in on the left; only

          let exG = null;
          {
            let x = x0;
            vis.forEach((c) => {
              const w = wOf(c);
              geo.push({ x, w, c });
              x += w;
            });
            const i0 = Math.max(0, arr.length - off - N) - 1,
              ec = subX > 0 && i0 >= 0 ? arr[i0] : null;
            if (ec && okC(ec)) {

          }

           * one day's TPO profile: rows of 30-minute
           * bricks, its POC row and its 70% value area.
           * Worked out once per day per frame.
           */
          const profCache = new Map();
          /* stp: brick size to use instead of the vol one */
          const dayProf = (dS, stp) => {
            const pk = stp ? dS + "|" + stp : dS;
            if (profCache.has(pk)) return profCache.get(pk);
            const rows = new Map(),
              per = new Map();
            let dh = -Infinity,
              dl = Infinity;
            const dE = nextDay(dS);
            k15.forEach((c) => {
              if (!okC(c) || c.t < dS || c.t >= dE) return;
              dh = Math.max(dh, c.h);
              dl = Math.min(dl, c.l);
              const i = Math.floor((c.t - dS) / TPO_MS),
                q = per.get(i);
              if (!q) per.set(i, { i, h: c.h, l: c.l });
              else {
                q.h = Math.max(q.h, c.h);
                q.l = Math.min(q.l, c.l);
              }
            });
            /*
             * brick height = one tenth of the vol step, rounded
             * up (330 gives 33). With no vol step set it falls
             * back to the two-day range rule, or the day's own
             * range when no earlier day is loaded.
             */
            const rng = prevR(dS) || dh - dl,
              step = stp
                ? stp
                : volAmt > 0
                  ? Math.max(1, Math.ceil(volAmt / 10))
                  : rng > 0
                    ? Math.max(1, nice(rng / 40))
                    : 1;
            const ps = [...per.values()].sort((m, n) => m.i - n.i);
            ps.forEach((q) => {
              for (
                let r = Math.floor(q.l / step);
                r <= Math.floor(q.h / step);
                r++
              ) {
                if (!rows.has(r)) rows.set(r, []);
                rows.get(r).push(q.i);
              }
            });
            /* dev[i] = POC row once period i is in (the
               developing POC), same rule as the final one */
            const cnt = new Map(),
              dev = [];
            let r0 = Infinity,
              r1 = -Infinity;
            ps.forEach((q) => {
              const qa = Math.floor(q.l / step),
                qb = Math.floor(q.h / step);
              for (let r = qa; r <= qb; r++)
                cnt.set(r, (cnt.get(r) || 0) + 1);
              r0 = Math.min(r0, qa);
              r1 = Math.max(r1, qb);
              const C = (r) => cnt.get(r) || 0,
                md = (r0 + r1) / 2,
                D = (r) => Math.abs(r - md);
              let p = r0;
              for (let r = r0; r <= r1; r++)
                if (C(r) > C(p) || (C(r) === C(p) && D(r) < D(p)))
                  p = r;
              dev[q.i] = p;
            });
            /* full = the whole day is loaded */
            const P = {
              dS,
              rows,
              step,
              maxC: 1,
              poc: null,
              a: null,
              b: null,
              dev,
              ps,
              full: k15.length > 0 && k15[0].t <= dS,
            };
            profCache.set(pk, P);
            const keys = [...rows.keys()];
            if (!keys.length) return P;
            const kmin = Math.min(...keys),
              kmax = Math.max(...keys),
              L = (r) => (rows.has(r) ? rows.get(r).length : 0);
            let tot = 0,
              maxC = 1;
            keys.forEach((r) => {
              tot += L(r);
              maxC = Math.max(maxC, L(r));
            });
            const rmid = (kmin + kmax) / 2;
            let poc = kmin;
            for (let r = kmin; r <= kmax; r++)
              if (
                L(r) > L(poc) ||
                (L(r) === L(poc) &&
                  Math.abs(r - rmid) < Math.abs(poc - rmid))
              )
                poc = r;
            let a = poc,
              b = poc,
              acc = L(poc);
            /*
             * 70% value area: compare the two rows above with
             * the two rows below and take the heavier pair
             */
            while (acc < tot * 0.7 && (a > kmin || b < kmax)) {
              const up = b < kmax ? L(b + 1) + L(b + 2) : -1,
                dn = a > kmin ? L(a - 1) + L(a - 2) : -1;
              if (up >= dn)
                for (let n = Math.min(2, kmax - b); n > 0; n--) {
                  b++;
                  acc += L(b);
                }
              else
                for (let n = Math.min(2, a - kmin); n > 0; n--) {
                  a--;
                  acc += L(a);
                }

          };

             when that day is not loaded.
