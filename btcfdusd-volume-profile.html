    <script>
      /* DP = decimals shown on prices */
      const SYM = "BTCFDUSD",
        IV = "5m",
        TPO_MS = 1800000,
        DP = 0;
      /*
       * TPO letter colours by UTC hour: Asia (red) →
       * Europe (blue) → US open (green) → US late (yellow)
       */

      const STOPS = [
        [0, [229, 57, 53]],
        [8, [30, 100, 230]],
        [14, [8, 153, 129]],
        [21, [225, 165, 0]],
      ];
      /*
       * 'big candle + high volume' circles: window length
       * and percentile (nearest-rank, as in the Pine
       * script)
       */
      /* PF zoom out: up to this many columns (2 days hold
         about 4400) */
      const PF_MAX = 5000;
      /* V95's window: 750 min, as 150 bars of 5m; its top 8 */
      const VH_MS = 750 * 60000;
      const BIG_WIN = 150,
        BIG_PERC = 0.95;
      const LET =
        "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz";
      function tpoColor(i, a = 1) {
        const h = Math.min(21, i * 0.5);
        let k = 0;
        while (k < STOPS.length - 2 && h > STOPS[k + 1][0]) k++;
        const [h0, c0] = STOPS[k],
          [h1, c1] = STOPS[k + 1],
          f = Math.max(0, Math.min(1, (h - h0) / (h1 - h0)));
        const rgb = c0.map((v, j) =>
          Math.round(v + (c1[j] - v) * f),
        );
        return "rgba(" + rgb.join(",") + "," + a + ")";
      }
      /*
       * sub POCs, same rules as simplified/POC/poc.py: the
       * brick shrinks 5% a pass from `start` down to the
       * chart's brick `fine`. A peak counts once it stands
       * a quarter of its own count above its valley. A POC
       * is born only while the brick is `vol` or more and
       * range/10 (or 1.5 bricks) away from the others;
       * smaller bricks only refine it, within `vol` of
       * where detection left it. Up to 3 per day.
       */
      function peaks(c) {
        /* [row, count, prominence]; flat tops merged */
        const R = [],
          out = [];
        c.forEach((v, r) => {
          const z = R[R.length - 1];
          if (z && z[0] === v) z[2] = r;
          else R.push([v, r, r]);
        });
        R.forEach(([v, a, b], k) => {
          const up = (j) => j >= 0 && j < R.length && R[j][0] > v;
          if (up(k - 1) || up(k + 1)) return;
          /* lowest point before something higher, each side */
          const sd = [];
          for (const d of [-1, 1]) {
            let m = null;
            for (
              let j = k + d;
              j >= 0 && j < R.length && R[j][0] <= v;
              j += d
            )
              m = Math.min(R[j][0], m == null ? v : m);
            if (m != null) sd.push(m);
          }
          out.push([
            (a + b) / 2,
            v,
            sd.length ? v - Math.max(...sd) : v,
          ]);
        });
        return out;
      }
      const subCache = new Map(),
        /* zigzag points per day (see the profiles) */
        zCache = new Map(),
        /* IC channels of closed periods, frozen (see icFor) */
        stFz = new Map(),
        /* PF columns' final IC by start time (see icFor) */
        icT = new Map();
      /* first brick of the sub POC search: SUB_K x the vol
         step, whatever the view, so every device agrees */
      const SUB_K = 5;
      /* a day's USDT volume per 30m period and row of st (on
         FDUSD prices, split by overlap); null until loaded */
      const pvCur = new Map();
      function perVol(dS, st) {
        const u = usdtOf(dS),
          d = usdtK.get(dS);
        if (!u || !d) return null;
        let v = pvCur.get(dS);
        if (!v || v.st !== st || v.n > u.n) {
          const r = rowsK.get(dS);
          v = r && r.p.st === st && r.p.n <= u.n
            ? { st, n: r.p.n, p: r.p.p.map((m) => m && new Map(m)) }
            : { st, n: 0, p: [] };
          pvCur.set(dS, v);
        }
        for (const a = d.k; v.n < u.n; v.n++) {
          const e = u.rt[v.n],
            [t, h, l, , q] = a[v.n],
            i = Math.floor((t - dS) / TPO_MS);
          if (e == null) continue;
          const m = v.p[i] || (v.p[i] = new Map());
          spread(l * e, h * e, st, (r, k) =>
            m.set(r, (m.get(r) || 0) + q * k));
        }
        v.end = d.end;
        v.last = u.n ? d.k[u.n - 1][0] : -Infinity;
        return v;
      }
      /* P's by the shrinking brick on the USDT volume of the
         periods ps (live: the forming one so far); TPO counts
         while it loads, or if tpo. .vol: on volume */
      function subPocs(dS, ps, vol, fine, tpo) {
        if (!ps.length) return [];
        const z = ps[ps.length - 1],
          te = Math.min(dS + (z.i + 1) * TPO_MS, Date.now()),
          pv = tpo ? null : perVol(dS, fine),
          vo = pv && (pv.end || pv.last >= te - 12e4) ? pv : null,
          key = [dS, ps.length, z.h, z.l, vol, fine, vo && vo.n];
        if (subCache.has(key.join())) return subCache.get(key.join());
        let lo = Infinity,
          hi = -Infinity;
        ps.forEach((q) => {
          lo = Math.min(lo, q.l);
          hi = Math.max(hi, q.h);
        });
        /* volume (or TPO count) per row from the day low */
        const pocs = pocsBy(lo, hi, vol, fine, (s) => {
          const c = [];
          ps.forEach((q) => {
            if (vo)
              /* split by overlap: whole rows alias */
              return (vo.p[q.i] || []).forEach((x, r) =>
                spread(r * fine - lo, (r + 1) * fine - lo, s,
                  (j, k) => (c[Math.max(0, j)] =
                    (c[Math.max(0, j)] || 0) + x * k)));
            const a = Math.floor((q.l - lo) / s),
              b = Math.floor((q.h - lo) / s);
            for (let r = a; r <= b; r++) c[r] = (c[r] || 0) + 1;
          });
          return c;
        });
        pocs.vol = !!vo;
        if (subCache.size > 300) subCache.clear();
        subCache.set(key.join(), pocs);
        return pocs;
      }
      /* the shrinking brick, from SUB_K x vol down to fine:
         cnt(s) = the count per row of size s from lo */
      function pocsBy(lo, hi, vol, fine, cnt) {
        const rg = hi - lo,
          pocs = [];
        for (let s = SUB_K * vol; s >= fine; s *= 0.95) {
          const c = cnt(s);
          for (let r = 0; r < c.length; r++) c[r] = c[r] || 0;
          const pk = peaks(c),
            top = Math.max(...pk.map((p) => p[1])),
            free = pk
              .filter(([, v, p]) => v === top || p >= 0.25 * v)
              .map(([r, v]) => [Math.min(hi, lo + (r + 0.5) * s), v])
              .sort((x, y) => y[1] - x[1]),
            gap = Math.max(rg / 10, 1.5 * s),
            moved = new Set(),
            pr = [];
          pocs.forEach((P, i) =>
            free.forEach((q) =>
              pr.push([Math.abs(q[0] - P.px), i, q]),
            ),
          );
          /* closest pairs first */
          pr.sort(
            (x, y) =>
              x[0] - y[0] ||
              x[1] - y[1] ||
              x[2][0] - y[2][0] ||
              x[2][1] - y[2][1],
          );
          pr.forEach(([d, i, q]) => {
            const P = pocs[i];
            if (d >= gap || moved.has(i) || !free.includes(q)) return;
            if (s < vol && Math.abs(q[0] - P.at) >= vol) return;
            moved.add(i);
            free.splice(free.indexOf(q), 1);
            P.px = q[0];
          });
          free.forEach((q) => {
            if (s < vol || pocs.length > 2) return;
            if (pocs.every((P) => Math.abs(q[0] - P.px) >= gap))
              pocs.push({ born: s, px: q[0] });
          });
          if (s >= vol) pocs.forEach((P) => (P.at = P.px));
        }
        return pocs;
      }
      /* vol mass: bricks of the regimes behind the 240 vol
         (median) */
      const VOL_MASS = 227,
        /* DT: a D's least mass (bricks), a quarter of a bell:
           lighter ones' curves hardly show (20 left 1-px D's) */
        D_MIN = 57;
      /* standard normal CDF (Abramowitz-Stegun 7.1.26) */
      function ncdf(x) {
        const t = 1 / (1 + (0.3275911 * Math.abs(x)) / Math.SQRT2),
          y = 1 - t * (0.254829592 + t * (-0.284496736 + t *
            (1.421413741 + t * (-1.453152027 + t * 1.061405429)))) *
            Math.exp((-x * x) / 2);
        return x >= 0 ? (1 + y) / 2 : (1 - y) / 2;
      }
      function kl(h, q) {
        return h + "/api/v3/klines?symbol=" + SYM + "&" + q;
      } /* klines URL */
      const REST = [
        "https://api.binance.com",
        "https://data-api.binance.vision",
      ];
      const WS = [
        "wss://stream.binance.com:9443",
        "wss://data-stream.binance.vision",
      ];
      /*
       * k5 = 5m candles (main chart), k15 = 15m candles
       * (TPO profiles), c15 = 15s candles (line-break
       * window / 15s view)
       */

      let k5 = [],
        k15 = [],
        c15 = [],
        charts = [],
        mid = null,
        xh = null,
        activeChart = null,
        lines = [],
        linesSig = "",
        nTpo = 3,
        TF = "5m",
        hostI = 0,
        retry = 0,

          const dlabel = (t) => {
            const d = new Date(t);
            return (
              d.toLocaleDateString([], {

                month: "short",

              " " +
              d.toLocaleTimeString([], TS())

          };

          /* grid + price axis */

          const gs = Math.max(1, nice((hi - lo) / 6));
          g.font = "11px ui-monospace,Menlo,monospace";
          g.textBaseline = "middle";
          for (let p = Math.ceil(lo / gs) * gs; p < hi; p += gs) {
            /* the main chart has no grid at all, lines or
               prices: its only horizontals are the vol steps */
            if (!cfg.main) {

              g.beginPath();
              g.moveTo(4, Y(p));
              g.lineTo(W - axW, Y(p));
              g.stroke();

              g.textAlign = "left";

          /*
           * TPO (Market Profile): one brick per 30 min; up to
           * 5 UTC days side by side (oldest left, latest next
           * to the chart)
           */

          /*
           * a day's row size comes from the vol step (see
           * dayProf); without one, from the average range of

           * depend on zoom or pan.

          if (!volFile) volN = volOfDay(dayOf(Date.now())) || volN;

          /* the vol known on that day */
          const volFor = (dS) => volOfDay(dS) || volN;

          /* dayR = high/low of every loaded day */
          const gap = 10,
            DAY = 86400000,
            dayR = new Map();
          if (cfg.tpo)

            const r = [prevDay(dS), prevDay(prevDay(dS))]
              .filter(

              .map((s) => dayR.get(s))
              .map((q) => q.h - q.l)
              .filter((v) => v > 0);

            return r.length

          };

           * candle geometry first: the levels below are cut

          geo = [];
          /* exG: the older candle sliding in on the left; only

          let exG = null;
          {
            let x = x0;
            vis.forEach((c) => {
              const w = wOf(c);
              geo.push({ x, w, c });

            });
            const i0 = Math.max(0, arr.length - off - N) - 1,
              ec = subX > 0 && i0 >= 0 ? arr[i0] : null;
            if (ec && okC(ec)) {

          /* HA (VC / LB): only the big candles and the ZFB; Std:

             colours, very light */
          const ha = cfg.main && !side && geo.length &&
            mode !== "std";
          if (cfg.main && !side && geo.length) {
            g.save();
            g.beginPath();
            g.rect(x0, top, px0 - x0, bot - top);
            g.clip();
            geo.forEach((o, i) => {
              g.fillStyle = tpoColor(
                Math.floor((o.c.t % 86400000) / 1800000),
                0.08,
              );
              const xe =
                i + 1 < geo.length ? geo[i + 1].x : o.x + o.w;
              g.fillRect(o.x, top, xe - o.x, bot - top);
            });
            g.restore();
          }
          /*
           * one day's TPO profile: rows of 30-minute
           * bricks, its POC row and its 70% value area.
           * Worked out once per day per frame.
           */
          const profCache = new Map();
          /* stp: brick size to use instead of the vol one */
          const dayProf = (dS, stp) => {
            const pk = stp ? dS + "|" + stp : dS;
            if (profCache.has(pk)) return profCache.get(pk);
            const rows = new Map(),
              per = new Map();
            let dh = -Infinity,
              dl = Infinity;
            const dE = nextDay(dS);
            k15.forEach((c) => {
              if (!okC(c) || c.t < dS || c.t >= dE) return;
              dh = Math.max(dh, c.h);
              dl = Math.min(dl, c.l);
              const i = Math.floor((c.t - dS) / TPO_MS),
                q = per.get(i);
              if (!q) per.set(i, { i, h: c.h, l: c.l });
              else {
                q.h = Math.max(q.h, c.h);
                q.l = Math.min(q.l, c.l);

             * brick height = one tenth of the vol step, rounded

            const rng = prevR(dS) || dh - dl,
              vd = volFor(dS),

            const ps = [...per.values()].sort((m, n) => m.i - n.i);
            ps.forEach((q) => {
              for (

                r <= Math.floor(q.h / step);

                if (!rows.has(r)) rows.set(r, []);
                rows.get(r).push(q.i);

            const P = {
              dS,

              poc: null,
              a: null,
              b: null,
              ps,

              maxC = 1;
            keys.forEach((r) => {

            for (let r = kmin; r <= kmax; r++)

          const lmK = 0.5,
            colW = Math.max(

            cP = (1 + lmK) * colW + gap,
            x6 = 6 + lmK * colW,

          const tb = Math.floor(tpoBack),

          const lastD = tpoDays[tpoDays.length - 1],

          const zn = cnt && k15.length ? 15 : 0;
          for (let k = 0, s = dayOf(Date.now()); k < zn; k++)
            if (dayR.has(s - k * DAY)) zd.unshift(s - k * DAY);
          zd.forEach((dS) => {
            /* a day's points (price, first brick, row length,
               widest row) are kept; today's are redone when
               its 15m candle changes */
            const lk = k15[k15.length - 1],
              key = [
                dS,
                volFor(dS),
                k15[0].t,
                dS < dayOf(Date.now()) ? "" : lk.t + "|" + lk.v,
                usdtV.has(dS) && usdtV.get(dS).n,
              ].join();
            let zc = zCache.get(key);
            if (!zc) {
              const Q = dayProf(dS),
                vf = volFor(dS) > 0 ? volFor(dS) : Q.step * 10;
              zc =
                Q.poc == null
                  ? []
                  : subPocs(Q.dS, Q.ps, vf, Q.step)
                      .map((S) => {
                        const row =
                          Q.rows.get(Math.floor(S.px / Q.step)) ||
                          [];
                        return {
                          p: S.px,
                          o: !row.length ? 99 : rowAge(row),
                          n: Math.max(1, row.length),
                          m: Q.maxC,
                        };
                      })
                      .sort((a, b) => a.o - b.o);
              if (zCache.size > 500) zCache.clear();
              zCache.set(key, zc);
            }
            const d = cnt + ex - 1 - Math.round((lastD - dS) / DAY),
              cx0 = x6 + (d - ex + tf) * cP;
            zc.forEach((z) =>

                x: cx0 + (z.n - 0.5) * Math.min(11, (colW - 2) / z.m),
                zx:
                  cx0 + (z.m - 0.5) * Math.min(11, (colW - 2) / z.m),
                y: Y(z.p),
                p: z.p,
                ds: dS,
              }),
            );
          });

          const liveHL = (cut, t) => {
            const d = aggrT.get(dayOf(cut)),

           * IC at time t, never repainted: the day's 15m candles

          const kvFor = (dS, sy) => {

             the last vipoc (within vol) stays unless another is

          const volPoc = (zv, vf, step, pv) => {

              h = Math.round(vf / step / 2),
              ps = pocsBy(lo, hi, vf, step, (s) => {
                const c = [];
                /* split by overlap: whole rows alias */
                zv.rows.forEach((q, r) =>

              }),
              age = (P) => {
                const r0 = Math.floor(P.px / step);

                for (let r = r0 - h; r <= r0 + h; r++)
                  (q += zv.rows.get(r) || 0),
                    (qt += zv.tw.get(r) || 0);

              };

                Math.abs(b.px - pv) < Math.abs(a.px - pv) ? b : a),
              P = C && Math.abs(C.px - pv) < vf &&

          };

            /* a column's IC once final: no rebuild of its key */
            const d0 = dayOf(t),
              fk = t + "|" + volFor(t < d0 + 9e5 ? prevDay(d0) : d0) +
                "|" + dVol.BTCUSDT.size;
            if (icT.has(fk)) return icT.get(fk);
            let dS = d0,
              cut = Math.floor(t / 9e5) * 9e5,
              x = null,
              te = t;

              kv = kvFor(dS, "BTCUSDT"),
              /* P's on volume only at each 30m close (as TPO) */
              tp = Math.floor(te / TPO_MS) * TPO_MS,
              key = ["ic", dS, cut, vf, step, x, te, kv].join();

            if (stFz.has(key)) {

            }
            const zv = kv ? zoneVol(dS, te, step) : null,
              pz = zv && tp > dS ? zoneVol(dS, tp, step, pCur) : null;
            const per = new Map(),
              rows = new Map(),

              q = zp.filter((z) => z.ds === yd).pop(),
              p = (q || zp[zp.length - 1]).p;

            ypan = 0;

          g.save();
          g.beginPath();
          g.rect(0, top, tR, bot - top);
          g.clip();
          g.font = "10px ui-monospace,Menlo,monospace";
          g.textBaseline = "middle";
          /* a day's vipocs: black lines from the axis to xe(S),
             the curve; P1 solid, P2 dashed, P3 dotted */
          const drawPs = (P, sp, cx0, xe) =>
            sp.forEach((S, k) => {
              const y = Y(S.px);

              g.lineWidth = 3;
              g.setLineDash([[], [8, 4], [3, 3]][k]);
              g.beginPath();

              g.lineTo(xe(S), y);

          const vipocs = (q) =>
            q.ps.length

                  .map((S) => {

                  .map((x) => x[1])

          };
          /* DT: the delta's own P's (the shrinking brick on each

          const bellFill = (P, sp, vw, kv, vf, dm) => {

              ck = [kv, vf, nC, ...sp.map((S) => S.px),

            const st = P.step,

              rw = new Map(),
              pd = vipocs(dayProf(prevDay(P.dS))).pop(),

            vw.forEach((q, k) => {
              const [r, i] = k.split("|").map(Number);

            sp.forEach((S, k) => {
              const pv = k ? sp[k - 1].px : pd,
                dir = dm ? dm.get(S) || 0
                  : pv == null ? 0 : Math.sign(S.px - pv),
                R = Math.ceil((3 * sg) / st),
                p0 = Math.floor(S.px / st),
                z = { b: [0, 0], u: [0, 0], d: [0, 0] },
                lead = [];
              for (let r = p0 - R; r <= p0 + R; r++) {
                const c = (r + 0.5) * st,
                  x = (c - S.px) / sg;
                if (Math.abs(x) > 3 || sp.some((O) =>
                  Math.abs(c - O.px) < Math.abs(c - S.px)))
                  continue;
                const e = VOL_MASS * kv *
                    (ncdf(((r + 1) * st - S.px) / sg) -
                      ncdf((r * st - S.px) / sg)),
                  w = z[Math.abs(x) <= 1 ? "b" : x > 0 ? "u" : "d"];
                w[0] += Math.min(e, rw.get(r) || 0);
                w[1] += e;
                if (dir && Math.abs(x) > 1 && Math.sign(x) === dir)
                  lead.push(r);
              }
              out.ps.push({ S, dir, lead, b: pc(z.b),
                l: pc(dir > 0 ? z.u : z.d),
                t: pc(dir > 0 ? z.d : z.u) });
            });
            vw.bf = [ck, out];
            return out;
          };
          /* DT core: rows' volume above the P's curves (dp), its
             P's by the shrinking brick, each one's mass (bricks)
             from the rows nearest it */
          const dPs = (rw, exp, kv, vf, st) => {
            const dp = new Map();
            rw.forEach((u, r) => {
              const d = u - (exp.get(r) || 0) * kv;
              if (d > 0) dp.set(r, d);
            });
            const rs = [...dp.keys()];
            if (!rs.length || !kv) return { dp, ps: [], ms: [] };
            const lo = Math.min(...rs) * st,
              hi = (Math.max(...rs) + 1) * st,
              ps = pocsBy(lo, hi, vf, st, (z) => {
                const c = [];
                dp.forEach((q, r) =>
                  spread(r * st - lo, (r + 1) * st - lo, z,
                    (i, k) => (c[i] = (c[i] || 0) + q * k)));
                return c;
              }),
              ms = ps.map(() => 0),
              gap = (r, Q) => Math.abs((r + 0.5) * st - Q.px);
            dp.forEach((q, r) => {
              let j = 0;
              ps.forEach((Q, i) => gap(r, Q) < gap(r, ps[j]) &&
                (j = i));
              ms[j] += q / kv;
            });
            return { dp, ps, ms };
          };
          const dCurve = (P, vw, sp, kv, vf, exp) => {
            const ck = [kv, vf, ...sp.map((S) => S.px)].join();
            if (vw.dc && vw.dc[0] === ck) return vw.dc[1];
            const st = P.step,
              out = new Map(),
              { dp, ps, ms } = dPs(vw.rw, exp, kv, vf, st);
            if (ps.length) {
              const sg = vf / 1.2816,
                N = Math.ceil((4 * sg) / st);
              /* every row's delta, drawn as bars (a dropped D's
                 rows: the bars only) */
              out.dp = dp;
              /* under D_MIN bricks: no D, its curve dropped */
              const kp = ps.filter((Q, i) => ms[i] >= D_MIN);
              ps.forEach((Q, i) => {
                if (ms[i] < D_MIN) return;
                const p = Math.floor(Q.px / st);
                for (let r = p - N; r <= p + N; r++)
                  out.set(r, (out.get(r) || 0) + ms[i] * (
                    ncdf(((r + 1) * st - Q.px) / sg) -
                    ncdf((r * st - Q.px) / sg)));
              });
              /* D1, D2..: ordered as the P's */
              out.ps = byAge(P, kp);
            }
            vw.dc = [ck, out];
            return out;
          };
          /* BS: the day's bells as they first show at each 30m
             close: P's of the closed periods, D's of their volume
             above those P's curves. One within vol of a P (D) of
             the close before follows it (last = where it is
             now), else a new bell born at that close; a D within
             vol of a P (this close's, or a P bell's last) is its
             child. Incremental: each close once (no repaint), its
             seconds all in first; the state (n closes, W rows,
             bells, the last close's P's / D's as bell indexes)
             kept in the browser ("b|day") with its vol, step, kv */
          const dayBells = (P, vw, kv, vf) => {
            const key = [vf, P.step, kv].join(),
              u = usdtOf(P.dS),
              zt = u && u.n ? usdtK.get(P.dS).k[u.n - 1][0] : -1,
              cl = P.ps.filter((q) =>
                P.dS + (q.i + 1) * TPO_MS <= Math.min(Date.now(),
                  zt + 1000));
            let o = bellDays.get(P.dS);
            if (!o || o.key !== key) {
              o = { key, n: 0, W: new Map(), bs: [], prev: null,
                look: true };
              bellDays.set(P.dS, o);
              idb.get("b|" + P.dS).then((v) => {
                if (v && v.key === key && bellDays.get(P.dS) === o &&
                  !o.n) {
                  o.bs = v.bs;
                  o.W = new Map(v.W);
                  const bk = (a) => a.map(([x, i]) => [x, o.bs[i]]);
                  o.prev = { P: bk(v.prev.P), D: bk(v.prev.D) };
                  o.n = v.n;
                  bellVer++;
                }
                o.look = false;
                schedule();
              });
            }
            if (o.look || o.n >= cl.length) return;
            const st = P.step,
              byI = new Map(),
              out = o.bs;
            vw.forEach((v, k) => {
              const [r, i] = k.split("|").map(Number);
              if (!byI.has(i)) byI.set(i, []);
              byI.get(i).push([r, v]);
            });
            let prev = o.prev || { P: [], D: [] };
            for (let n = o.n; n < cl.length; n++) {
              const q = cl[n],
                cp = subPocs(P.dS, cl.slice(0, n + 1), vf, st);
              if (!cp.vol) break;
              (byI.get(q.i) || []).forEach(([r, v]) =>
                o.W.set(r, (o.W.get(r) || 0) + v));
              const d = dPs(o.W, expOf(P, cp, vf), kv, vf, st),
                cur = { P: cp.map((S) => S.px),
                  D: d.ps.filter((Q, i) => d.ms[i] >= D_MIN)
                    .map((Q) => Q.px) },
                now = { P: [], D: [] };
              ["P", "D"].forEach((kind) => cur[kind].forEach((px) => {
                const near = prev[kind].filter(([x]) =>
                  Math.abs(x - px) < vf);
                let b;
                if (near.length) {
                  b = near.reduce((a, z) => Math.abs(z[0] - px) <
                    Math.abs(a[0] - px) ? z : a)[1];
                  b.last = px;
                } else out.push(b = { px, last: px, kind,
                  birth: P.dS + (q.i + 1) * TPO_MS,
                  sigma: vf / 1.2816,
                  child: kind === "D" && cur.P.concat(out.filter(
                    (z) => z.kind === "P").map((z) => z.last))
                    .some((x) => Math.abs(x - px) < vf) });
                now[kind].push([px, b]);
              }));
              prev = now;
              o.n = n + 1;
            }
            o.prev = prev;
            bellVer++;
            const ix = (a) => a.map(([x, b]) => [x, out.indexOf(b)]);
            idb.put("b|" + P.dS, { key, n: o.n, W: [...o.W],
              bs: out.map((b) => ({ ...b })),
              prev: { P: ix(prev.P), D: ix(prev.D) } });
          };
          /* Perf: the curve's edge row by row, a step line from
             the profile's left edge, over its rows of a brick or
             more; w(e) = the width of e bricks */
          const perfLine = (P, exp, cx0, w, col) => {
            const ks = [...exp.keys()]
              .filter((r) => Math.round(exp.get(r)) >= 1)
              .sort((a, b) => b - a);
            if (!ks.length) return;
            g.save();
            g.strokeStyle = col;
            g.lineWidth = 1.5;
            g.beginPath();
            g.moveTo(cx0, Y((ks[0] + 1) * P.step));
            ks.forEach((r) => {
              const x = cx0 + w(exp.get(r));
              g.lineTo(x, Y((r + 1) * P.step));
              g.lineTo(x, Y(r * P.step));
            });
            g.lineTo(cx0, Y(ks[ks.length - 1] * P.step));
            g.stroke();
            g.restore();
          };
          /* rects gathered per colour, filled once per colour
             (layer order kept by filling each layer when done) */
          const batch = () => {
            const m = new Map();
            return {
              rect: (col, x, y, w, h) => {
                if (!m.has(col)) m.set(col, new Path2D());
                m.get(col).rect(x, y, w, h);
              },
              fill: () => m.forEach((p, col) => {
                g.fillStyle = col;
                g.fill(p);
              }),
            };
          };
          /* DT: each day's last bell (by age), for the next day */
          const rkEnd = new Map();
          for (let d = 0; d < cnt + ex; d++) {
            const Q = dayProf(tpoDays[d]),
              cx0 = x6 + (d - ex + tf) * cP,
              rowH = (ch * Q.step) / (hi - lo),
              lw = Math.min(11, (colW - 2) / Q.maxC),
              P = Object.assign(
                { d, cx0, show: true, rowH, lw },
                Q,
              );
            profs.push(P);
            if (P.poc == null) continue;
            /* each day once its data is all in (past: every USDT
               second and FDUSD trade; today: to 2 min ago), with
               its vol and kv; no partial draw first */
            loadAggr(P.dS);
            loadUsdt(P.dS);
            /* one scale for every day: today's row median fills
               a column; a busier row is cut at the column edge */
            const vw = vwOf(P.dS, P.step),
              rm = rowMedOf(dayOf(Date.now())),
              vs = vw && rm > 0 ? (colW - 2) / rm : 0,
              uk = usdtK.get(P.dS),
              at = aggrT.get(P.dS),
              z = uk && uk.k[uk.k.length - 1],
              full = uk && at && (P.dS === dayOf(Date.now())
                ? z && z[0] >= Date.now() - 12e4
                : uk.end && at.end);
            if (!full || !vs || !(volOfDay(P.dS) > 0) ||
              !(kvFor(P.dS, "BTCUSDT") > 0)) {
              g.font = "11px ui-monospace,Menlo,monospace";
              g.textAlign = "left";
              g.fillStyle = "#787b86";
              g.fillText("loading", cx0 + 4, top + 14);
              continue;
            }
            /* for the hover: its volume per brick and scale */
            Object.assign(P, { vw, vs });
            g.save();
            g.beginPath();
            g.rect(cx0 - lmK * colW, top, (1 + lmK) * colW - 2,
              bot - top);
            g.clip();
            const vf = volFor(P.dS) > 0 ? volFor(P.dS) : P.step * 10;
            const sp = byAge(P, subPocs(P.dS, P.ps, vf, P.step));
            /* BS: this day's bells, then every bell's score */
            dayBells(P, vw, kvFor(P.dS, "BTCUSDT"), vf);
            keepRows(P.dS);
            scores = bellScores();
            /* VP alert: the live price out of today's bells, past
               the lowest P - 1.96 sigma / highest P + 1.96 sigma
               (sigma = vol / 1.2816, the curves'); once per side
               and outermost P */
            if (P.dS === dayOf(Date.now()) && k15.length &&
              sp.length) {
              const c = k15[k15.length - 1].c,
                z = (1.96 * vf) / 1.2816,
                hiP = Math.max(...sp.map((S) => S.px)),
                loP = Math.min(...sp.map((S) => S.px)),
                ev = [];
              if (c > hiP + z)
                ev.push({ id: "s" + P.dS + "|u|" + hiP.toFixed(0),
                  up: true, txt: "above +1.96σ " + c.toFixed(0) });
              if (c < loP - z)
                ev.push({ id: "s" + P.dS + "|d|" + loP.toFixed(0),
                  up: false, txt: "below -1.96σ " + c.toFixed(0) });
              /* BS: a bell of the last day whose grid ended under
                 0.25 sigma (red / pale red dot), dir "bs" */
              scores.forEach((q) => {
                if (q.fin && q.sc != null && q.sc < 0.25 &&
                  q.birth > Date.now() - DAY)
                  ev.push({ id: "b" + q.birth + q.kind + q.px,
                    dir: "bs", up: false, txt: q.kind + " " +
                      q.px.toFixed(0) + " grid " + q.sc.toFixed(2) +
                      "σ" });
              });
              /* "s": armed on the old alert, no ring at first */
              vpEv = { ctx: "s" + [vf, P.step].join(), ev };
            }
            /* the vipocs' normal curves in volume, a brick's
               worth = the mean volume / bricks of the 5 finished
               days before (fixed all day: no repaint) */
            /* kept on vw while its P's and vol stay */
            const ek = [vf, ...sp.map((S) => S.px)].join();
            if (!vw.ex || vw.ex[0] !== ek)
              vw.ex = [ek, expOf(P, sp, vf)];
            const exp = vw.ex[1],
              kv = kvFor(P.dS, "BTCUSDT"),
              cX = (r) => cx0 + (exp.get(r) || 0) * kv * vs;
            /* the bells' axis = the day's candle, wick low to high,
               body open to close (today: live), green up, black
               down; rk = the P's and D's ages (rank written at the
               end) */
            const rk = [];
            {
              /* its first / last 15m candle, by binary search */
              const at = (t) => {
                  let a = 0, b = k15.length;
                  while (a < b) {
                    const m = (a + b) >> 1;
                    if (k15[m].t < t) a = m + 1;
                    else b = m;
                  }
                  return a;
                },
                i0 = at(P.dS),
                i1 = at(nextDay(P.dS)) - 1,
                o = i1 >= i0 ? k15[i0].o : null,
                c = i1 >= i0 ? k15[i1].c : null;
              g.strokeStyle = g.fillStyle = o != null && c < o
                ? "#000" : "#089981";
              /* the wick, its high and low capped with a dash */
              const yh = Y(Math.max(...P.ps.map((q) => q.h))),
                yl = Y(Math.min(...P.ps.map((q) => q.l)));
              g.lineWidth = 1;
              g.beginPath();
              g.moveTo(cx0 - 1, yh);
              g.lineTo(cx0 - 1, yl);
              g.stroke();
              g.lineWidth = 2;
              g.beginPath();
              g.moveTo(cx0 - 7, yh);
              g.lineTo(cx0 + 5, yh);
              g.moveTo(cx0 - 7, yl);
              g.lineTo(cx0 + 5, yl);
              g.stroke();
              const yo = Y(Math.max(o, c)),
                yc = Y(Math.min(o, c));
              if (o != null)
                g.fillRect(cx0 - 4, yo, 6, Math.max(1, yc - yo));
            }
            /* the delta's normal curve, left of the axis */
            const dc = dCurve(P, vw, sp, kv, vf, exp);
            perfLine(P, dc, cx0 - 2, (e) => -e * kv * vs,
              "#000");
            /* its P's: a black line to the curve; age = the
               average period of the row's bricks */
            const ag = (X) => {
              const w = P.rows.get(Math.floor(X.px / P.step));
              return w && w.length ? rowAge(w) : 99;
            };
            (dc.ps || []).forEach((Q, k) => {
              const y = Y(Q.px);
              g.strokeStyle = "#000";
              g.lineWidth = 2;
              g.setLineDash([[], [8, 4], [3, 3]][k]);
              g.beginPath();
              /* to the delta's curve */
              g.moveTo(cx0 - 2, y);
              g.lineTo(cx0 - 2 - (dc.get(Math.floor(Q.px /
                P.step)) || 0) * kv * vs, y);
              g.stroke();
              g.setLineDash([]);
            });
            /* each bell's middle: P's right, D's left */
            const wx = (m, X) =>
              (m.get(Math.floor(X.px / P.step)) || 0) * kv * vs;
            sp.forEach((S) =>
              rk.push([ag(S), cx0 + wx(exp, S) / 2, S.px, 0, S,
                1]));
            (dc.ps || []).forEach((Q) =>
              rk.push([ag(Q), cx0 - 2 - wx(dc, Q) / 2, Q.px, 0, 0,
                -1]));
            /* by age; each one's move vs the one before (1: the
               day before's last bell, else its last vipoc): its
               number's colour and, for a P, its BF lead side */
            let q0 = rkEnd.has(prevDay(P.dS))
              ? rkEnd.get(prevDay(P.dS))
              : vipocs(dayProf(prevDay(P.dS))).pop();
            rk.sort((a, b) => a[0] - b[0]).forEach((e) => {
              e[3] = q0 == null ? 0 : e[2] >= q0 ? 1 : -1;
              q0 = e[2];
            });
            const dm = new Map(rk.filter((e) => e[4])
              .map((e) => [e[4], e[3]]));
            /* each bell shaded as its number, very light (Inv:
               strong, P's only up to their volume): a row goes to
               its nearest P (right) / D (left) */
            const aS = vpInv ? 0.6 : 0.12,
              aL = vpInv ? 0.12 : 0.6;
            const sb = batch(),
              /* of: the shade's start, moved from x0 */
              shade = (sd, m, x0, wf, of) => {
              const bs = rk.filter((e) => e[5] === sd);
              if (bs.length) m.forEach((v, r) => {
                const c = (r + 0.5) * P.step,
                  b = bs.reduce((a, e) => Math.abs(e[2] - c) <
                    Math.abs(a[2] - c) ? e : a),
                  w = wf(v, r),
                  xs = x0 + (of ? of(v, r) : 0),
                  yT = Y((r + 1) * P.step);
                if (Math.abs(w) < 0.5 || !b[3]) return;
                sb.rect(b[3] > 0 ? `rgba(8,153,129,${aS})`
                  : `rgba(229,57,53,${aS})`, Math.min(xs, xs + w), yT,
                  Math.abs(w), Y(r * P.step) - yT);
              });
            };
            /* Miss: the missing part from the axis, the volume
               after it */
            shade(1, exp, cx0, (v, r) => vpInv || vpMiss
              ? Math.min(v * kv, vw.rw.get(r) || 0) * vs
              : v * kv * vs,
              vpMiss ? (v, r) =>
                Math.max(0, v * kv - (vw.rw.get(r) || 0)) * vs
              : null);
            /* D's as P's: the delta bars in the shade, up to
               their curve; rows out of any D (under D_MIN) grey;
               Miss: the missing part from the axis, the bar after */
            const dp = dc.dp || new Map(),
              dMiss = (v, r) =>
                Math.max(0, v * kv - (dp.get(r) || 0));
            shade(-1, dc, cx0 - 2, (v, r) =>
              -Math.min(v * kv, dp.get(r) || 0) * vs,
              vpMiss ? (v, r) => -dMiss(v, r) * vs : null);
            dp.forEach((q, r) => {
              const w = q * vs,
                yT = Y((r + 1) * P.step);
              if (w >= 0.5 && !dc.has(r))
                sb.rect("rgba(67,70,81,.35)",
                cx0 - 2 - w, yT, w, Y(r * P.step) - yT);
            });
            sb.fill();
            /* what a row lacks vs the curve (negative delta),
               the black curve filled from its volume, in its
               nearest P's number colour (black: soft black) */
            const bp = rk.filter((e) => e[5] === 1),
              nb = batch();
            exp.forEach((e, r) => {
              const x0 = cx0 + (vw.rw.get(r) || 0) * vs,
                yT = Y((r + 1) * P.step),
                c = (r + 0.5) * P.step,
                b = bp.length && bp.reduce((a, q) =>
                  Math.abs(q[2] - c) < Math.abs(a[2] - c)
                    ? q : a);
              if (cX(r) - x0 < 0.25 || yT > bot ||
                yT + rowH < top)
                return;
              nb.rect(!b || !b[3] ? "rgba(67,70,81,.45)"
                : b[3] > 0 ? `rgba(8,153,129,${aL})`
                  : `rgba(229,57,53,${aL})`,
                vpMiss ? cx0 : x0, yT,
                cX(r) - x0, Y(r * P.step) - yT);
            });
            /* D's: what a row's delta lacks vs its D curve, in
               its nearest D's colour, leftwards */
            const bd = rk.filter((e) => e[5] === -1);
            if (bd.length) dc.forEach((e, r) => {
              const xb = cx0 - 2 - (dp.get(r) || 0) * vs,
                xc = cx0 - 2 - e * kv * vs,
                yT = Y((r + 1) * P.step),
                c = (r + 0.5) * P.step,
                b = bd.reduce((a, q) =>
                  Math.abs(q[2] - c) < Math.abs(a[2] - c) ? q : a);
              if (xb - xc < 0.25 || !b[3] || yT > bot ||
                yT + rowH < top)
                return;
              nb.rect(b[3] > 0 ? `rgba(8,153,129,${aL})`
                : `rgba(229,57,53,${aL})`,
                vpMiss ? cx0 - 2 - (xb - xc) : xc, yT, xb - xc,
                Y(r * P.step) - yT);
            });
            nb.fill();
            /* BF: the lead wing's empty part, from its closed
               volume to the curve, over the other fills: blue, to
               stand out on green and red bells */
            const bf = bellFill(P, sp, vw, kv, vf, dm);
            const lb = batch();
            bf.ps.forEach((F) => F.lead.forEach((r) => {
              const x0 = cx0 + (bf.rw.get(r) || 0) * vs,
                yT = Y((r + 1) * P.step);
              if (cX(r) - x0 > 0.5)
                lb.rect("rgba(30,90,220,.85)",
                  vpMiss ? cx0 : x0, yT,
                  cX(r) - x0, Y(r * P.step) - yT);
            }));
            lb.fill();
            perfLine(P, exp, cx0, (e) => e * kv * vs, "#000");
            /* its vipocs: black lines to the curve */
            drawPs(P, sp, cx0, (S) => cX(Math.floor(S.px / P.step)));
            /* the clip ends here: numbers and dots never cut */
            g.restore();
            /* P's and D's ranked by age together, 1 = oldest, in
               the middle of each bell; green above the one before
               (1: the day before's last), red below */
            g.save();
            g.font = "bold 12px ui-monospace,Menlo,monospace";
            g.textAlign = "center";
            g.textBaseline = "middle";
            g.strokeStyle = "#fff";
            g.lineWidth = 3;
            rk.forEach(([, x, px, mv], i) => {
              g.fillStyle = !mv ? "#000"
                : mv > 0 ? "#089981" : "#e53935";
              g.strokeText(i + 1, x, Y(px));
              g.fillText(i + 1, x, Y(px));
            });
            /* BS: each bell's grid score as a dot
               right of its P's curve / left of its D's: red <= 0,
               pale red to 0.25 sigma (~one round trip), green
               to 1 (ranged), dark green above (strong range);
               faded while running; the day's live bell of its
               kind whose latest place (last) is nearest it,
               within a vol */
            if (showScores && scores.length) {
              const own = scores.filter((q) => q.sc != null &&
                  dayOf(q.birth - 1) === P.dS),
                pin = (X, kind, x) => {
                  const at = (q) => Math.abs((q.last ?? q.px) - X.px),
                    m = own.filter((q) => q.kind === kind &&
                      at(q) < vf);
                  if (!m.length) return;

              if (cfg.main) g.globalAlpha = 0.8;
              g.strokeStyle = col;
              g.fillStyle = col;
              const yo = Y(c.o),
                yc = Y(c.c),
                yT = Math.min(yo, yc),
                hB = Math.max(1, Math.abs(yo - yc));
              g.beginPath();
              g.moveTo(xm, Y(c.h));
              g.lineTo(xm, yT);
              g.moveTo(xm, yT + hB);
              g.lineTo(xm, Y(c.l));
              g.stroke();
              g.fillRect(x + 1, yT, Math.max(1, w - 2), hB);
              g.restore();
            });
          /*
           * circles: green bullish, black bearish; main chart
           * (any type): in the middle of the candle (high to
           * low), so a small one is not missed; the 15s window:
           * below bullish bars, above bearish ones
           */
          geo.forEach((o) => {
            const f = bigs.get(o.c);
            if (!f || side) return;
            const c = o.c;
            if (c.c === c.o) return;
            const bull = c.c > c.o,
              y = ha || cfg.main ? Y((c.h + c.l) / 2)
                : bull ? Y(c.l) + 12 : Y(c.h) - 12;
            if (y < top || y > bot) return;
            g.fillStyle = bull ? "#4caf50" : "#000000";
            g.beginPath();
            g.arc(o.x + o.w / 2, y, 5, 0, 6.2832);
            g.fill();
          });
          /*
           * vertical grid: a line every 6 hours counted from
           * UTC midnight, where the day and its levels change
           * (01, 07, 13, 19 on a London summer clock), drawn
           * behind everything
           */
          const SIX = 21600000,
            p2 = (v) => String(v).padStart(2, "0"),
            slot = (t) => Math.floor(t / SIX),
            marks = cfg.main
              ? geo.filter(
                  (o, i) => i && slot(o.c.t) !== slot(geo[i - 1].c.t),
                )
              : [];
          g.save();
          g.globalCompositeOperation = "destination-over";
          g.lineWidth = 1.5;
          marks.forEach((o) => {
            const xm = Math.round(o.x + o.w / 2) + 0.5,
              mid0 = new Date(o.c.t).getUTCHours() < 6;
            if (!mid0) return;
            /* midnight solid navy like the 0 line, the
               others dashed black like the vol steps */
            g.strokeStyle = mid0
              ? "rgba(0,51,102,.35)"
              : "rgba(0,0,0,.5)";
            g.setLineDash(mid0 ? [] : [3, 3]);
            g.lineWidth = mid0 ? 0.4 : 0.3;
            g.beginPath();
            g.moveTo(xm, top);
            g.lineTo(xm, bot);
            g.stroke();
          });
          g.restore();
          /* time labels: on the 6-hour lines when there are
             at least two of them, else every few candles */

          g.fillStyle = "#6b7684";
          g.textAlign = "center";
          const every = Math.ceil(vis.length / 8);
          /* none in the full-screen strip, none spilling left
             of the chart */
          let lastX = side ? 1e9 : x0 - 26;
          if (marks.length >= 2)
            marks.forEach((o) => {
              /* the line's time on the local clock; the date
                 (UTC) on the line that starts a day */
              const xm = o.x + o.w / 2,
                d = new Date(slot(o.c.t) * SIX);
              if (xm - lastX < 46) return;
              lastX = xm;
              g.fillText(
                d.getUTCHours()
                  ? p2(d.getHours()) + ":" + p2(d.getMinutes())
                  : d.toLocaleDateString([], {
                      day: "2-digit",
                      month: "short",
                      timeZone: "UTC",
                    }),
                xm,
                bot + 10,
              );
            });
          else
            geo.forEach((o, i) => {
              /* uneven volume widths: keep labels apart */
              const xm = o.x + o.w / 2;
              if (i % every === 0 && xm - lastX >= 46) {
                const d = new Date(o.c.t);
                lastX = xm;
                g.fillText(
                  p2(d.getHours()) +
                    ":" +
                    p2(d.getMinutes()) +
                    (sec() ? ":" + p2(d.getSeconds()) : ""),
                  o.x + o.w / 2,
                  bot + 10,
                );
              }
            });
          /* user lines (Alt+H / Alt+V) */

          view = {
            hi,
            lo,
            top,
            bot,
            ch,
            px0,
            x0,
            tR,
            pS,
            pcW,
            tpoW,
            /* the window under px: "pc", "tpo" or the chart */
            win: (px) =>
              pcW && px >= pS && px < x0 - 5
                ? "pc"
                : tpoW && px < tR
                  ? "tpo"
                  : null,
            pcGeo,
            pfX,
            icons,
            pcN: pcShow,
            pcSl,
            tpoSl: cP,
            colW,
            zp,
            Y,
            pc: cw / slots,
            /* HA: the magnet's big candles and zigzag pivots */
            ha: ha ? { b: bigs, z: [] } : null,
          };
          /*
           * l.lo = first point, l.hi = second point: the
           * dashed line sits 34% from the first point
           */
          const drawBox = (l, sel) => {
            const mx = Math.max(l.lo, l.hi),
              mn = Math.min(l.lo, l.hi),
              yT = Y(mx),
              yB = Y(mn),
              xs = xsOf(l),
              p66 = l.hi + 0.66 * (l.lo - l.hi),
              y66 = Y(p66),
              /* drawn upwards candle green, downwards black */
              rgb = l.hi >= l.lo ? "8,153,129" : "0,0,0";
            g.save();
            g.beginPath();
            g.rect(xs, top, px0 - xs, bot - top);
            g.clip();
            /* light grey box; only the part from the first
               point to the dashed line in green / black */
            g.fillStyle = "rgba(0,0,0,.05)";
            g.fillRect(xs, yT, px0 - xs, yB - yT);
            const y0 = Y(l.lo);
            g.fillStyle = "rgba(" + rgb + ",.2)";
            g.fillRect(
              xs,
              Math.min(y0, y66),
              px0 - xs,
              Math.abs(y0 - y66),
            );
            g.strokeStyle = "rgba(0,0,0,.25)";
            g.lineWidth = sel ? 2 : 1;
            g.setLineDash([]);
            g.strokeRect(xs, yT, px0 - xs, yB - yT);
            g.strokeStyle = "rgba(" + rgb + ",.5)";
            g.setLineDash([5, 4]);
            g.beginPath();
            g.moveTo(xs, y66);
            g.lineTo(px0, y66);
            g.stroke();
            g.setLineDash([]);
            g.restore();
            [
              [mx, yT],
              [p66, y66],
              [mn, yB],
            ].forEach(([pv, yy]) => {
              if (yy >= top && yy <= bot)
                ptag(yy, pv.toFixed(DP), "rgb(" + rgb + ")");
            });
          };
          /*
           * ZFB: over all the loaded candles,
           * one following channel. Until the first big candle it is
           * as tall as the day's vol. A big candle the same way only
           * resizes it, so the leg goes on; one the other way, or a
           * close out of it on the far side, turns it. Each channel's
           * extreme is a pivot, where it was made; a leg takes its
           * channel's colour: yellow down, blue up. Dashed = open.
           */
          const zfb = (ha) => {
            const piv = zfbPiv(arr),
              where = new Map(geo.map((o) => [o.c, o])),
              nP = piv.length;
            /* HA: the open leg thin and solid, to the most
               extreme price since its origin */
            if (ha && nP > 1) {
              const z = piv[nP - 1];
              for (
                let k = arr.indexOf(piv[nP - 2].c) + 1;
                k < arr.length;
                k++
              ) {
                const q = arr[k];
                if (okC(q) && (z.low ? q.l < z.p : q.h > z.p)) {
                  z.p = z.low ? q.l : q.h;
                  z.c = q;
                }
              }
            }
            /* legs' times for the crosshair; the open one runs on */
            zLegs = piv.slice(1).map((z, i) =>
              [piv[i].c.t, i === nP - 2 ? Infinity : z.c.t]);
            /* pivots off screen: where their candle would be,
               a slot each from the first one shown, so a leg
               keeps its true slope (the clip cuts it) */
            const iOf = (t) => {
              let a = 0, b = arr.length;
              while (a < b) {
                const m = (a + b) >> 1;
                if (arr[m].t < t) a = m + 1;
                else b = m;
              }
              return a;
            };
            const i0 = iOf(geo[0].c.t),
              gx0 = geo[0].x + geo[0].w / 2;
            const xOf = (z) => {
              const o = where.get(z.c);
              return o ? o.x + o.w / 2
                : gx0 + (iOf(z.c.t) - i0) * sw;
            };
            /* clipped at the candles' edge: nothing in the
               margin for candles panned out of view */
            g.save();
            g.beginPath();
            g.rect(x0, top, x1 - x0, bot - top);
            g.clip();
            g.lineWidth = 2;
            piv.forEach((z, i) => {
              if (!i) return;
              const a = piv[i - 1],
                xa = xOf(a),
                xb = xOf(z);
              if (view.ha)
                view.ha.z.push({ x: xb, p: z.p, o: where.get(z.c) });
              /* both ends on one candle (it wicked and turned):
                 drawn vertical */
              if (xb < x0 || xa > px0 || a.c.t < warm) return;
              g.strokeStyle = z.low
                ? "rgb(230,159,0)"
                : "rgb(41,98,255)";
              const open = i === nP - 1;
              g.lineWidth = open && ha ? 1 : 2;
              g.setLineDash(open && !ha ? [6, 4] : []);
              g.beginPath();
              g.moveTo(xa, Y(a.p));
              g.lineTo(xb, Y(z.p));
              g.stroke();
            });
            g.restore();
          };
          zLegs = [];
          /* zOk: see the top; the first 3 x BIG_WIN candles warm up
             (big needs a full window), not shown */
          const warm = arr.length ? arr[Math.min(arr.length - 1,
              3 * BIG_WIN)].t : 0;
          if (cfg.main && !side && geo.length && zOk) zfb(ha);
          /*
           * own orders (from orders.js): a segment at the
           * order price for as long as the order was alive,
           * as thick as its quantity; dot = filled,
           * cancelled just stops, open orders run to the edge
           */
          /* my orders (O) */
          const ords = showOrders ? orders : [];
          if (ords.length) {
            const n = arr.length;
            const tEnd = off > 0 && n - off < n
              ? arr[n - off].t
              : Infinity;
            const tFirst = geo[0].c.t;
            const mq = Math.max(...ords.map((o) => o.qty));
            g.save();
            g.beginPath();
            g.rect(x0, top, px0 - x0, bot - top);
            g.clip();
            ords.forEach((o) => {
              const y = Y(o.price);
              const gone = o.t1 != null && o.t1 < tFirst;
              if (y < top || y > bot || o.t0 >= tEnd || gone)
                return;
              const a = geoAt(o.t0);
              const ended = o.t1 != null && o.t1 < tEnd;
              const b = ended ? geoAt(o.t1) : null;
              let xs = a ? a.x + a.w / 2 : x0;
              let xe = b ? b.x + b.w / 2 : px0;
              if (xe - xs < 6) {
                xs -= 3;
                xe = xs + 6;
              }
              const col = o.buy ? "#56b4e9" : "#e69f00";
              g.strokeStyle = g.fillStyle = col;
              g.lineWidth = Math.max(1.5, (10 * o.qty) / mq);
              g.globalAlpha = ended ? 0.55 : 0.9;
              g.setLineDash([]);
              g.beginPath();
              g.moveTo(xs, y);
              g.lineTo(xe, y);
              if (showLines) g.stroke();
              g.globalAlpha = 1;
              g.lineWidth = 1.5;
              g.beginPath();
              if (ended && o.filled) {
                /* dot in the order's colour, bigger for
                   bigger sizes (area follows quantity) */
                const rDot = 2 + 4 * Math.sqrt(o.qty / mq);
                g.fillStyle = col;
                g.arc(xe, y, rDot, 0, 6.2832);
                g.fill();
              }
            });
            g.restore();
            g.lineWidth = 1;
          }
          /*
           * the same orders in the PF: a time maps to the last
           * column started by then; older than the first shown
           * column = its left edge, still open = the right edge
           */
          if (ords.length && pcPf && pfX.length) {
            const mq = Math.max(...ords.map((o) => o.qty)),
              xR = pL + pcW,
              xAt = (tt) => {
                let x = pL;
                for (const [t0, xm] of pfX) if (t0 <= tt) x = xm;
                return x;
              };
            g.save();
            g.beginPath();
            g.rect(pL, top, pcW, bot - top);
            g.clip();
            ords.forEach((o) => {
              const y = Y(o.price),
                ended = o.t1 != null;
              if (y < top || y > bot) return;
              if (ended && o.t1 < pfX[0][0]) return;
              let xs = xAt(o.t0),
                xe = ended ? xAt(o.t1) : xR;
              if (xe - xs < 6) {
                xs -= 3;
                xe = xs + 6;
              }
              const col = o.buy ? "#56b4e9" : "#e69f00";
              g.strokeStyle = g.fillStyle = col;
              g.lineWidth = Math.max(1.5, (10 * o.qty) / mq);
              g.globalAlpha = ended ? 0.55 : 0.9;
              g.beginPath();
              g.moveTo(xs, y);
              g.lineTo(xe, y);
              if (showLines) g.stroke();
              g.globalAlpha = 1;
              if (ended && o.filled) {
                g.beginPath();
                g.arc(xe, y, 2 + 4 * Math.sqrt(o.qty / mq), 0, 7);
                g.fill();
              }
            });
            g.restore();
            g.lineWidth = 1;
          }
          lines.forEach((l) => {
            const sel = l === hl || l === drag;
            g.strokeStyle = g.fillStyle = "#8e44ad";
            g.lineWidth = sel ? 2 : 1;
            g.setLineDash([]);
            g.beginPath();
            if (l.k === "h") {
              /* green above the last price, black below */
              const lp = mid != null ? mid : arr[arr.length - 1].c,
                col = l.p >= lp ? "#089981" : "#000000";
              g.strokeStyle = col;
              g.lineWidth = sel ? 6 : 4;
              const y = Y(l.p);
              if (y >= top && y <= bot) {
                g.moveTo(4, y);
                g.lineTo(px0, y);
                g.globalAlpha = 0.5;
                g.stroke();
                g.globalAlpha = 1;
                ptag(y, l.p.toFixed(DP), col);
              }
            } else if (l.k === "v") {
              /* a time has no side: black */
              g.strokeStyle = "#000000";
              g.lineWidth = sel ? 6 : 4;
              const o = geoAt(l.t);
              if (o) {
                const cx = o.x + o.w / 2;
                g.moveTo(cx, top);
                g.lineTo(cx, bot);
                g.globalAlpha = 0.5;
                g.stroke();
                g.globalAlpha = 1;
                ttag(cx, dlabel(l.t), "#000000");
              }
            } else if (l.k === "d") {
              /* marine blue above the last price, dark red below */
              const y = Y(l.p),
                lp = mid != null ? mid : arr[arr.length - 1].c,
                col = l.p >= lp ? "#0b2e6b" : "#8b0000";
              if (y >= top && y <= bot) {
                /* the chart part starts at the candle of its
                   time (or just before); on the main chart a
                   part over the PF / profiles too (dSide),
                   wherever the line was drawn */
                const o = geoAt(l.t),
                  xm = o ? o.x + o.w / 2 : x0,
                  xp = dSide(l);
                g.strokeStyle = g.fillStyle = col;
                g.lineWidth = sel ? 3 : 2;
                g.beginPath();
                g.moveTo(xp != null ? xp : xm, y);
                if (xp != null) {
                  g.lineTo(x0 - 5, y);
                  g.moveTo(xm, y);
                }
                g.lineTo(px0, y);
                g.stroke();
                [xp, xm].forEach((x) => {
                  if (x == null) return;
                  g.beginPath();
                  g.arc(x, y, sel ? 2.5 : 1.5, 0, 6.2832);
                  g.fill();
                });
                ptag(y, l.p.toFixed(DP), col);
              }
            } else if (l.k === "b") drawBox(l, sel);
            g.lineWidth = 1;
          });
          if (dotTool) {
            g.font = "11px ui-monospace,Menlo,monospace";
            g.fillStyle = "#1f3a93";
            g.textAlign = "left";
            g.textBaseline = "middle";
            g.fillText(
              "Dot: click a point (Esc cancels)",
              x0 + 8,
              top + 10,
            );
          }
          if (boxTool) {
            g.font = "11px ui-monospace,Menlo,monospace";
            g.fillStyle = "#5b6b7d";
            g.textAlign = "left";
            g.textBaseline = "middle";
            g.fillText(
              boxTool === 1
                ? "Box: click the bottom level"
                : "Box: click the top level (Esc cancels)",
              x0 + 8,
              top + 10,
            );
          }
          /* full-width icons, on top of the drawings */
          /* DPoc / profiles full screen: blank the chart
             strip, the last price and scale stay */
          if (side) {
            g.fillStyle = "#ffffff";
            g.fillRect(x0 - 2, 0, px0 - x0 + 2, H);
          }
          if (cfg.main) {
            /* PF: a cross at its top left closes it; once
               closed, a PF tag there on the chart opens it */
            if (pcW || (cfg.tpo && !pcPf && !full)) {
              const x = pcW ? pL + 6 : x0 + 4,
                y = top + 4;
              g.save();
              g.setLineDash([]);
              g.lineWidth = 1.5;
              g.strokeStyle = "#8a94a3";
              g.fillStyle = "#6b7684";
              if (pcW) {
                g.beginPath();
                g.moveTo(x, y);
                g.lineTo(x + 9, y + 9);
                g.moveTo(x + 9, y);
                g.lineTo(x, y + 9);
                g.stroke();
                icons.push({ k: "x|pc", x: x - 4, y: y - 4, w: 17,
                  h: 17 });
              } else {
                g.font = "11px ui-monospace,Menlo,monospace";
                g.textAlign = "left";
                g.textBaseline = "top";
                g.strokeRect(x - 0.5, y - 1.5, 40, 15);
                g.fillText("+PF", x + 4, y + 1);
                icons.push({ k: "o|pc", x: x - 2, y: y - 3, w: 44,
                  h: 19 });
              }
              g.restore();
            }
            if (pcW) icon("pc", pL, pL + pcW);
            if (pcW) alIcons("pf", pL + pcW);
            if (tpoW) icon("tpo", 1, tR - 1);
            if (tpoW) alIcons("vp", tR - 1);
            if (!side) {
              icon("main", x0 - 3, px0 - 2);
              alIcons("main", px0 - 2, 0, "HA");
              alIcons("zz", px0 - 2, 1, "ZZ");
            }
          } else alIcons("mini", px0 - 2);
          /* the waiting axis tags, ladder ones underneath */
          tagsNow = true;
          tq.filter((a) => a[2] === "#fff")
            .concat(tq.filter((a) => a[2] !== "#fff"))
            .forEach((a) => ptag(...a));
          /* 15s: its name at the bottom, as the PF's (under the
             price axis, clear of the time labels) */
          if (!cfg.main) {
            g.font = "11px ui-monospace,Menlo,monospace";
            g.fillStyle = "#6b7684";
            g.textAlign = "center";
            g.fillText("15s", (px0 + W) / 2, bot + 10);
          }
          /* last price, on top of the drawings and their tags */

          const last = vis[vis.length - 1],
            lp = mid != null ? mid : last.c,
            ly = Math.max(top, Math.min(bot, Y(lp)));
          /* soft black */
          const LP = "#434651";
          g.strokeStyle = LP;
          g.setLineDash([]);
          g.lineWidth = 2;
          g.beginPath();
          g.moveTo(4, Math.round(ly) + 0.5);
          g.lineTo(px0, Math.round(ly) + 0.5);
          g.stroke();
          /*
           * tag sits left of the axis so it does not cover the
           * level tags of drawings; a second one at the line's
           * left end
           */
          {
            /* bigger and bold on the main chart */
            g.save();
            if (cfg.main)
              g.font = "bold 14px ui-monospace,Menlo,monospace";
            const lt = lp.toFixed(DP),
              lw = g.measureText(lt).width + 12,
              th = cfg.main ? 24 : 18;
            g.textAlign = "left";
            g.textBaseline = "middle";
            /* and one on the profiles' right edge */
            [px0 - lw, 4]
              .concat(cfg.tpo && tpoW ? [pL - 2 - lw] : [])
              .forEach((tx) => {
              g.fillStyle = LP;
              g.fillRect(tx, ly - th / 2, lw, th);
              g.fillStyle = "#ffffff";
              g.fillText(lt, tx + 6, ly);
            });
            g.restore();
          }
          /* hover */

          /* crosshair line / tag background / tag text */
          const XH = "rgba(184,134,11,.8)",
            XB = "#ffe58a",
            XF = "#1a1f26";
          tpoT = null;
          if (
            mouse &&
            mouse.x >= 4 &&
            mouse.x <= px0 &&
            mouse.y >= top &&
            mouse.y <= bot
          ) {
            const inTpo = mouse.x < x0 - 5,
              o = !inTpo && hover >= 0 && geo[hover],
              cx = o ? o.x + o.w / 2 : mouse.x,
              pv = hi - ((mouse.y - top) / ch) * (hi - lo);
            g.strokeStyle = XH;
            g.setLineDash([4, 4]);
            g.beginPath();
            g.moveTo(cx, top);
            g.lineTo(cx, bot);
            g.moveTo(4, mouse.y);
            g.lineTo(px0, mouse.y);
            g.stroke();
            g.setLineDash([]);
            ptag(mouse.y, pv.toFixed(DP), XB, XF);
            /* and on the profiles' right edge, as the last
               price; maximised, on the left edge too */
            const t = pv.toFixed(DP),
              w = g.measureText(t).width + 12,
              lTag = (x) => {
                g.fillStyle = XB;
                g.fillRect(x, mouse.y - 9, w, 18);
                g.fillStyle = XF;
                g.textAlign = "left";
                g.textBaseline = "middle";
                g.fillText(t, x + 6, mouse.y);
              };
            if (cfg.tpo && tpoW) lTag(pL - 2 - w);
            if (fl) lTag(4);
            let lbl = null;
            if (o) lbl = dlabel(o.c.t);
            /* over the PF: the hovered column's start time */
            else if (
              pcW &&
              mouse.x >= pS &&
              mouse.x < x0 - 5
            ) {
              const t = pfTime(mouse.x);
              if (t != null) lbl = dlabel(t);
            } else if (inTpo) {
              const P = profs.find(
                (q) =>
                  q.show &&
                  mouse.x >= q.cx0 - 2 &&
                  mouse.x <= q.cx0 + colW,
              );
              /* a BS dot under the pointer: its score */
              const hd = P && (P.bsDots || []).find((q) =>
                Math.hypot(q.x - mouse.x, q.y - mouse.y) < 9);
              if (hd) {
                const v = hd.b.sc,
                  t = hd.b.kind + " grid " + (v > 0 ? "+" : "") +
                    v.toFixed(2) + "σ" +
                    (hd.b.fin ? "" : " running");
