              [5, "5d"],
              [7, "7d"],
            ],
            () => nTpo,
            (v) => (nTpo = v),
          );
          mkBtns(
            $("nBtns"),
            [
              [36, "36"],
              [288, "288"],
              [576, "576"],
            ],
            /* a button shows that many candles, back at
               the latest one with the usual room */
            () =>
              [36, 288, 576].find(
                (v) => slotsFor(v) === N,
              ),
            (v) => {
              N = slotsFor(v);
              off = home();
            },
          );
        }

        function setTF(v) {
          TF = v;
          off = home();
          lock = null;
          draft = null;
          boxTool = 0;
          dotTool = 0;
          $("sym").textContent = SYM + " " + v;
          draw();
        }
        if (cfg.main && !cfg.vp) ui();
        if (window.ResizeObserver)
          new ResizeObserver(() => size()).observe(cv);
        size();
        return api;
      }
      const mainChart = makeChart($("c"), {
        main: true,
        mode: "std",
        /* one day of 5m candles, a fifth of the width free */
        N: 288,
        room: 0.2,
        tpo: true,
      });
      const miniChart = makeChart($("mc"), {
        main: false,
        mode: "lb",
        N: 200,
        /* 15% free on the right; new bricks push it left */
        room: 0.15,
        tpo: false,
      });
      charts = [mainChart, miniChart];

      /*
       * Ctrl+S (or Cmd+S) saves drawings + all settings in
       * this browser's localStorage; restored on reload
       */

      const SAVE_KEY = "btcfdusd-state-v2";
      /* raise this whenever the default vol / B / O change */
      const DEFAULTS_VER = 42;
      function toast(t) {
        const el = $("toast");
        el.textContent = t;
        el.style.opacity = 1;
        clearTimeout(toast.h);
        toast.h = setTimeout(() => {
          el.style.opacity = 0;
        }, 1800);
      }
      let miniBox = null;
      function snapshot() {
        const r = mini.getBoundingClientRect();
        if (r.width > 0)
          miniBox = {
            x: Math.round(r.left),
            y: Math.round(r.top),
            w: Math.round(r.width),
            h: Math.round(r.height),
          };
        return {
          v: 2,
          dv: DEFAULTS_VER,
          pcPf,
          showOrders,
          showLines,
          showScores,
          vpInv,
          vpMiss,
          lines: lines.filter(
            (l) => !(l.k === "b" && l.lo === l.hi),
          ),
          main: mainChart.getState(),
          mini: miniChart.getState(),
          win: Object.assign(
            { hidden: mini.style.display === "none" },
            miniBox || {},
          ),
        };
      }
      function restore() {
        let st = null;
        try {
          st = JSON.parse(
            localStorage.getItem(SAVE_KEY) || "null",
          );
        } catch (e) {}
        if (!st) {
          try {
            const old = JSON.parse(
              localStorage.getItem("btcfdusd-drawings-v1") ||
                "null",
            );
            if (Array.isArray(old)) st = { lines: old };
          } catch (e) {}
        }
        if (!st) return;
        if (Array.isArray(st.lines))
          lines.push(...st.lines.filter((l) => l && l.k));
        /* version 32: the defaults are the user's set, older
           saved toggles are dropped */
        if (!(st.dv >= 32)) return schedule();
        /* vol / B / O / L saved before version 2 of the
           defaults are ignored */
        const cur = st.dv >= 2;
        /* PF: default changed in version 9 */
        if (st.dv >= 9 && typeof st.pcPf === "boolean")
          setPcPf(st.pcPf);
        /* O / L: defaults changed in version 6 */
        const cur6 = st.dv >= 6;
        if (cur6 && typeof st.showOrders === "boolean")
          setShowOrders(st.showOrders);
        if (cur6 && typeof st.showLines === "boolean")
          setShowLines(st.showLines);
        /* BS: new in version 39, on by default */
        if (st.dv >= 39 && typeof st.showScores === "boolean")
          setShowScores(st.showScores);
        /* Inv: off by default since version 42 */
        if (st.dv >= 42 && typeof st.vpInv === "boolean")
          setVpInv(st.vpInv);
        /* Miss: new in version 41, on by default */
        if (st.dv >= 41 && typeof st.vpMiss === "boolean")
          setVpMiss(st.vpMiss);
        /*
         * A reload behaves like Alt+X, except that drawings
         * and settings are kept: the view (zoom, pan, price
         * scale, floating window) always starts from its
         * default, so only timeframe and TPO days are taken
         * from the saved chart state; the main chart always
         * opens on standard candles (Std).
         */
        /* TPO days: back to 3 in version 24 */
        const keep = (s) =>
          s && { TF: s.TF, nTpo: st.dv >= 24 ? s.nTpo : 3 };
        mainChart.setState(keep(st.main));
        miniChart.setState(keep(st.mini));
        schedule();
      }
      addEventListener("keydown", (e) => {
        if (
          (e.ctrlKey || e.metaKey) &&
          !e.altKey &&
          String(e.key).toLowerCase() === "s"
        ) {
          e.preventDefault();
          try {
            const snap = snapshot();
            localStorage.setItem(SAVE_KEY, JSON.stringify(snap));
            toast(
              "Settings and drawings saved (" +
                snap.lines.length +
                " drawings)",
            );
          } catch (err) {
            toast("Could not save: browser storage is blocked");
          }
        }
      });

      /*
       * floating 15s line-break window: drag the top-left
       * grip to resize (anchored bottom-right)
       */

      const mini = $("mini");
      /* keep the window inside the viewport */
      function setMiniBox(bx) {
        const w = Math.max(240, Math.min(innerWidth, bx.w)),
          h = Math.max(160, Math.min(innerHeight, bx.h));
        mini.style.left =
          Math.max(0, Math.min(innerWidth - w, bx.x)) + "px";
        mini.style.top =
          Math.max(0, Math.min(innerHeight - h, bx.y)) + "px";
        mini.style.width = w + "px";
        mini.style.height = h + "px";
      }
      /* default: minimum size, bottom-left corner (setMiniBox
         clamps y to the bottom) */
      const miniHome = () =>
        setMiniBox({ x: 0, y: innerHeight, w: 240, h: 160 });
      miniHome();
      addEventListener("resize", () => {
        const r = mini.getBoundingClientRect();
        if (r.width > 0)
          setMiniBox({
            x: r.left,
            y: r.top,
            w: r.width,
            h: r.height,
          });
      });
      /*
       * resize from any corner; the opposite corner stays
       * put
       */
      document.querySelectorAll("#mini .grip").forEach((gp) =>
        gp.addEventListener("pointerdown", (e) => {
          const c = gp.dataset.c,
            r = mini.getBoundingClientRect(),
            sx = e.clientX,
            sy = e.clientY;
          gp.setPointerCapture(e.pointerId);
          e.preventDefault();
          const mv = (ev) => {
            const dx = ev.clientX - sx,
              dy = ev.clientY - sy;
            let x1 = r.left,
              x2 = r.right,
              y1 = r.top,
              y2 = r.bottom;
            if (c[1] === "l")
              x1 = Math.max(
                0,
                Math.min(r.right - 240, r.left + dx),
              );
            else
              x2 = Math.min(
                innerWidth,
                Math.max(r.left + 240, r.right + dx),
              );
            if (c[0] === "t")
              y1 = Math.max(
                0,
                Math.min(r.bottom - 160, r.top + dy),
              );
            else
              y2 = Math.min(
                innerHeight,
                Math.max(r.top + 160, r.bottom + dy),
              );
            setMiniBox({ x: x1, y: y1, w: x2 - x1, h: y2 - y1 });
          };
          const up = () => {
            gp.removeEventListener("pointermove", mv);
            gp.removeEventListener("pointerup", up);
          };
          gp.addEventListener("pointermove", mv);
          gp.addEventListener("pointerup", up);
        }),
      );
      /* title bar: move the window */
      $("mhead").addEventListener("pointerdown", (e) => {
        if (e.target.closest && e.target.closest("button"))
          return;
        const hd = $("mhead"),
          r = mini.getBoundingClientRect(),
          sx = e.clientX,
          sy = e.clientY;
        hd.setPointerCapture(e.pointerId);
        e.preventDefault();
        const mv = (ev) =>
          setMiniBox({
            x: r.left + ev.clientX - sx,
            y: r.top + ev.clientY - sy,
            w: r.width,
            h: r.height,
          });
        const up = () => {
          hd.removeEventListener("pointermove", mv);
          hd.removeEventListener("pointerup", up);
        };
        hd.addEventListener("pointermove", mv);
        hd.addEventListener("pointerup", up);
      });
      $("mx").onclick = () => {
        mini.style.display = "none";
      };

      /* Alt+R: default zoom and pan, floating window back to
         its corner. Alt+X: the same, plus drawings deleted. */
      addEventListener("keydown", (e) => {
        if (e.altKey && e.code === "KeyR") {
          e.preventDefault();
          miniHome();
          mainChart.resetView();
          miniChart.resetView();
          schedule();
          toast("View reset");
        } else if (e.altKey && e.code === "KeyX") {
          e.preventDefault();
          if (
            lines.length &&
            !confirm(
              "Reset both charts and delete all " +
                lines.length +
                " drawings?",
            )
          )
            return;
          lines = [];
          linesSig = "";
          /* back to the minimum size, bottom-left corner */
          mini.style.display = "flex";
          miniHome();
          mainChart.resetView();
          miniChart.resetView();
          schedule();
          toast("Charts reset to default, drawings deleted");
        }
      });
      /* Drawings Clear button: delete every drawing */
      $("drawClr").onclick = () => {
        if (!lines.length) return toast("No drawings");
        lines = [];
        schedule();
        toast("Drawings deleted");
      };
      $("sym").textContent = SYM + " " + TF;
      document.title = SYM;
      restore();
      /* a fresh page starts as after Alt+R: settings kept,
         views back home */
      miniHome();
      mainChart.resetView();
      miniChart.resetView();
      $("ordTog").onclick = () => setShowOrders(!showOrders);
      $("ordLineTog").onclick = () => setShowLines(!showLines);
      $("bsTog").onclick = () => setShowScores(!showScores);
      $("invTog").onclick = () => setVpInv(!vpInv);
      $("missTog").onclick = () => setVpMiss(!vpMiss);
      /* phone: tabs Main / VP / PF / 15s, each its chart full
         screen (15s: the floating window over everything) */
      if (matchMedia("(pointer: coarse)").matches &&
        Math.min(screen.width, screen.height) < 600) {
        const tb = $("tabs"),
          hd = document.querySelector("header"),
          sz = () => {
            document.body.style.setProperty("--hd",
              hd.offsetHeight + "px");
            requestAnimationFrame(() =>
              charts.forEach((c) => c.size()));
          },
          lit = (k) => [...tb.children].forEach((b) =>
            (b.className = b.dataset.k === k ? "a" : "")),
          /* Split: VP pane (its own chart, on the profiles) on
             top, the main chart under it */
          go = (k) => {
            document.body.classList.toggle("t15", k === "m15");
            if (k !== "m15")
              mainChart.full(k === "split" ? "main" : k);
            document.body.dataset.tab = k;
            lit(k);
            sz();
          };
        document.body.classList.add("phone");
        charts.push(makeChart($("cvp"), { main: true, vp: true,
          mode: "eq", N: 288, room: 0.2, tpo: true }));
        [["split", "Split"], ["main", "Main"], ["tpo", "VP"],
          ["pc", "PF"], ["m15", "15s"]].forEach(([k, l]) => {
          const b = document.createElement("button");
          b.textContent = l;
          b.dataset.k = k;
          b.onclick = () => go(k);
          tb.appendChild(b);
        });
        addEventListener("full", (e) => {
          if (document.body.dataset.tab === "m15" ||
            (document.body.dataset.tab === "split" &&
              e.detail === "main")) return;
          document.body.dataset.tab = e.detail || "";
          lit(e.detail);
        });
        new ResizeObserver(sz).observe(hd);
        go("split");
      }
      /* installable app: only when served over https */
      if (
        "serviceWorker" in navigator &&
        location.protocol === "https:"
      )
        navigator.serviceWorker.register("sw.js").catch(() => {});
      loadOrders();
      loadVol();
      connect();
      idb.get("k15").then((a) => {
        if (!Array.isArray(a) || !a.length ||
          a[a.length - 1].t < Date.now() - 9 * 864e5) return;
        k15 = k15.length ? a.filter((c) => c.t < k15[0].t)
          .concat(k15) : a;
        schedule();
      });
      idb.get("big").then((a) => {
        (a || []).forEach(([k, f]) => bigK.has(k) ||
          bigK.set(k, f));
        schedule();
      });
      idb.get("rmeds").then((a) => {
        (a || []).forEach(([d, x]) => rowMeds.has(d) ||
          rowMeds.set(d, x));
        schedule();
      });
      idb.get("vols").then((a) => {
        (a || []).forEach(([d, x]) => volDays.has(d) ||
          volDays.set(d, x));
        schedule();
      });
      /* daily volumes now, not at the first profile draw */
      loadDVol("BTCUSDT");
      loadDVol(SYM);
      hist(IV, () => seedIv(IV));
      hist("15m", () => seedIv("15m"));
      load15(null);
    </script>
  </body>
</html>
