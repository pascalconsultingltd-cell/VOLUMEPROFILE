    <script>
      /* DP = decimals shown on prices */
      const SYM = "BTCFDUSD",
        IV = "5m",
        TPO_MS = 1800000,
        DP = 0;
      /*
       * TPO letter colours by UTC hour: Asia (red) →
       * Europe (blue) → US open (green) → US late (yellow)
       */

      const STOPS = [
        [0, [229, 57, 53]],
        [8, [30, 100, 230]],
        [14, [8, 153, 129]],
        [21, [225, 165, 0]],
      ];
      /*
       * 'big candle + high volume' circles: window length
       * and percentile (nearest-rank, as in the Pine
       * script)
       */
      const BIG_WIN = 150,
        BIG_PERC = 0.95;
      const LET =
        "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz";
      function tpoColor(i, a = 1) {
        const h = Math.min(21, i * 0.5);
        let k = 0;
        while (k < STOPS.length - 2 && h > STOPS[k + 1][0]) k++;
        const [h0, c0] = STOPS[k],
          [h1, c1] = STOPS[k + 1],
          f = Math.max(0, Math.min(1, (h - h0) / (h1 - h0)));
        const rgb = c0.map((v, j) =>
          Math.round(v + (c1[j] - v) * f),
        );
        return "rgba(" + rgb.join(",") + "," + a + ")";
      }
      function kl(h, q) {
        return h + "/api/v3/klines?symbol=" + SYM + "&" + q;
      } /* klines URL */
      const REST = [
        "https://api.binance.com",
        "https://data-api.binance.vision",
      ];
      const WS = [
        "wss://stream.binance.com:9443",
        "wss://data-stream.binance.vision",
      ];
      /*
       * k5 = 5m candles (main chart), k15 = 15m candles
       * (TPO profiles), c15 = 15s candles (line-break
       * window / 15s view)
       */

      let k5 = [],
        k15 = [],
        c15 = [],
        charts = [],
        mid = null,
        xh = null,
        activeChart = null,
        lines = [],
        linesSig = "",
        nTpo = 3,
        TF = "5m",
        hostI = 0,
        retry = 0,
        ws;
      let conn = "connecting",
        everOpen = false,
        lastT = null;
      const histFail = new Set(),
        seeded = {},
        olderBusy = {},
        olderEnd = {};
      /*
       * automatic box on the latest high-volume candle (B
       * button)
       */
      let autoBox = true;
      function setAutoBox(v) {
        autoBox = !!v;
        $("boxTog").className = autoBox ? "a" : "";
        schedule();
      }
      /* own orders on the chart (O button) */
      let showOrders = false;
      function setShowOrders(v) {
        showOrders = !!v;
        $("ordTog").className = showOrders ? "a" : "";
        schedule();
      }
      /* order lines (L button): off keeps only the
         execution dots */
      let showLines = true;
      function setShowLines(v) {
        showLines = !!v;
        $("ordLineTog").className = showLines ? "a" : "";
        schedule();
      }
      /*
       * vol step typed in the header: a price amount, or a
       * percent of yesterday's POC when it ends with %
       */
      /*
       * Own orders. A Python job may keep a file orders.js
       * next to this page, of the form
       *   window.ORDERS = [ ...Binance order objects... ];
       * using Binance's own fields: side, price, origQty,
       * executedQty, cummulativeQuoteQty, status, time,
       * updateTime. It is loaded as a script because a page
       * opened by double-click may not read a data file.
       * No file: nothing is drawn and the chart is unchanged.
       */
      let orders = [];
      function readOrder(o) {
        const live =
          o.status === "NEW" || o.status === "PARTIALLY_FILLED";
        const avg = +o.cummulativeQuoteQty / +o.executedQty;
        return {
          buy: String(o.side).toUpperCase() === "BUY",
          price: +o.price || avg,
          qty: +o.origQty,
          t0: +o.time,
          t1: live ? null : +o.updateTime,
          filled: o.status === "FILLED",
        };
      }
      function loadOrders() {
        const s = document.createElement("script");
        const next = (ok) => {
          s.remove();
          setTimeout(loadOrders, ok ? 3000 : 20000);
        };
        window.ORDERS = undefined;
        s.onload = () => {
          const a = window.ORDERS;
          if (Array.isArray(a)) {
            orders = a
              .map(readOrder)
              .filter(
                (o) =>
                  Number.isFinite(o.price) &&
                  o.qty > 0 &&
                  Number.isFinite(o.t0),
              );
            schedule();
          }
          next(Array.isArray(a));
        };
        s.onerror = () => next(false);
        s.src = "orders.js?t=" + Date.now();
        document.head.appendChild(s);
      }
      let volN = 0,
        volPct = false;
      function setVol(s) {
        s = String(s || "")
          .trim()
          .replace(",", ".");
        const n = parseFloat(s);
        volN = Number.isFinite(n) && n > 0 ? n : 0;
        volPct = s.endsWith("%");
        schedule();
      }

      const $ = (id) => document.getElementById(id);
      const HELP = $("info").textContent;
      const toC = (a) => ({
        t: a[0],
        o: +a[1],
        h: +a[2],
        l: +a[3],
        c: +a[4],
        v: +a[5],
        bv: +a[9],
      });

      /*
       * connection state + any history that could not be
       * loaded
       */
      function stat() {
        $("dot").className = conn.startsWith("live")
          ? "dot on"
          : "dot";
        $("st").textContent =
          conn +
          (histFail.size
            ? " · history failed: " + [...histFail].join(", ")
            : "");
      }
      /*
       * vol=false for the kline-backed stores: trades only
       * move the price there, volume comes from the kline
       * stream (no double counting)
       */

      function feed(arr, ms, p, q, T, m, vol) {
        const t = Math.floor(T / ms) * ms;
        let c = arr[arr.length - 1];
        if (!c || t > c.t) {
          c = { t, o: p, h: p, l: p, c: p, v: 0, bv: 0 };
          arr.push(c);
          charts.forEach((h) => h.newCandle(arr));
          if (arr.length > 8000) arr.shift();
        } else if (t < c.t) {
          return;
        }
        c.h = Math.max(c.h, p);
        c.l = Math.min(c.l, p);
        c.c = p;
        if (vol) {
          c.v += q;
          if (!m) c.bv += q;
        }
      }
      /*
       * Join between 1s history and live trades for the
       * 15s store: history owns every second before `cut`,
       */

      /*
       * the trade stream owns everything from `cut` on.
       * `seam` collects the live part of the 15s bucket
       * that contains `cut`.
       */

      let cut = null,
        seam = null,
        cutArm = false,
        cutDone = null;
      function armCut() {
        cut = null;
        seam = null;
        cutArm = true;
        return new Promise((res) => {
          /* no trades: carry on without a cut */
          const t = setTimeout(() => {
            cutDone = null;
            cutArm = false;
            if (cut != null) setTimeout(res, 1500);
            else res();
          }, 4000);
          cutDone = () => {
            clearTimeout(t);
            cutDone = null;
            res();
          };
        });
      }
      function addTrade(p, q, T, m) {
        /* ignore malformed trades */
        if (
          !Number.isFinite(p) ||
          !Number.isFinite(q) ||
          !Number.isFinite(T)
        )
          return;
        lastT = T;
        if (cutArm) {
          cut = Math.floor(T / 1000) * 1000 + 1000;
          cutArm = false;
        }
        if (cut != null) {
          if (
            T >= cut &&
            T < Math.floor(cut / 15000) * 15000 + 15000
          ) {
            if (!seam) seam = { h: p, l: p, c: p, v: 0, bv: 0 };
            seam.h = Math.max(seam.h, p);
            seam.l = Math.min(seam.l, p);
            seam.c = p;
            seam.v += q;
            if (!m) seam.bv += q;
          }
          /*
           * the seconds before the cut are now closed on the
           * exchange
           */
          if (cutDone && T >= cut + 1000) cutDone();
        }
        feed(k5, 300000, p, q, T, m, false);
        feed(k15, 900000, p, q, T, m, false);
        feed(c15, 15000, p, q, T, m, true);
        if (mid == null)
          $("px").textContent = document.title = p.toFixed(DP);
        schedule();
      }
      /*
       * 5m store feeds the 5m view, 15m store feeds the
       * TPO profiles
       */
      function onKline(k) {
        const A = k.i === "15m" ? k15 : k5;
        /* ignore malformed klines */
        if (
          ![k.t, k.o, k.h, k.l, k.c, k.v, k.V].every((v) =>
            Number.isFinite(+v),
          )
        )
          return;
        let c = A.find((x) => x.t === k.t);
        if (!c) {
          c = { t: k.t };
          A.push(c);
          charts.forEach((h) => h.newCandle(A));
          A.sort((a, b) => a.t - b.t);
        }
        Object.assign(c, {
          o: +k.o,
          h: +k.h,
          l: +k.l,
          c: +k.c,
          v: +k.v,
          bv: +k.V,
        });
        schedule();
      }
      async function fetch1s(end) {
        for (let tr = 0; tr < 2; tr++)
          for (const h of REST) {
            try {
              const j = await fj(
                kl(h, "interval=1s&limit=1000&endTime=" + end),
              );
              if (Array.isArray(j)) return j;
            } catch (e) {}
          }
        return null;
      }
      /*
       * 15s candles from 1s klines ending at `end`:
       * `pages` pages of 1000s, fetched 11 at a time,
       * newest first; stops as soon as the callback
       * returns true
       */

      async function seed15(m, end, pages, lim, cb) {
        const B = 11,
          seen = new Set();
        for (let i = 0; i < pages; i += B) {
          const res = await Promise.all(
            Array.from(
              { length: Math.min(B, pages - i) },
              (_, k) => fetch1s(end - (i + k) * 1000000),
            ),
          );
          let any = false;
          res.forEach((j) => {
            if (!j) return;
            j.forEach((a) => {
              if (seen.has(a[0]) || (lim != null && a[0] >= lim))
                return;
              seen.add(a[0]);
              any = true;
              const t = Math.floor(a[0] / 15000) * 15000;
              let c = m.get(t);
              if (!c) {
                c = {
                  t,
                  o: +a[1],
                  h: +a[2],
                  l: +a[3],
                  c: +a[4],
                  v: 0,
                  bv: 0,
                  fo: a[0],
                  lt: a[0],
                };
                m.set(t, c);
              }
              c.h = Math.max(c.h, +a[2]);
              c.l = Math.min(c.l, +a[3]);
              if (a[0] < c.fo) {
                c.fo = a[0];
                c.o = +a[1];
              }
              if (a[0] >= c.lt) {
                c.lt = a[0];
                c.c = +a[4];
              }
              c.v += +a[5];
              c.bv += +a[9];
            });
          });
          if (cb() === true) break;
          if (!any) break;
        }
      }
      /*
       * Days are UTC days (00:00 to 00:00 UTC) for the TPO
       * profiles, the levels and the vertical grid. This is
       * the one place that defines a day: dayOf = the UTC
       * midnight that starts t's day.
       */
      const dayOf = (t) => Math.floor(t / 86400000) * 86400000;
      const prevDay = (dS) => dS - 86400000;
      const nextDay = (dS) => dS + 86400000;
      function schedule() {
        charts.forEach((h) => h.sched());
      }
      /*
       * since==null: first load, adaptive (keeps fetching
       * older 1s history until the 15s line-break chart
       * has enough bricks, up to ≈18h)
       */

      /*
       * since=time: backfill after a reconnect, from that
       * time up to now
       */

      async function fill15(since) {
        await armCut();
        const lim = cut,
          end = lim != null ? lim - 1 : Date.now(),
          first = since == null,
          TARGET = 450;
        const pages = first
          ? 66
          : Math.max(
              1,
              Math.min(
                66,
                Math.ceil((end - since) / 1000000) + 1,
              ),
            );
        const m = new Map();
        let bricks = 0,
          joined = false;
        await seed15(m, end, pages, lim, () => {
          /*
           * add the live part of the bucket that straddles the
           * cut, once
           */
          if (!joined) {
            joined = true;
            const b =
              lim != null && seam
                ? m.get(Math.floor(lim / 15000) * 15000)
                : null;
            if (b) {
              b.h = Math.max(b.h, seam.h);
              b.l = Math.min(b.l, seam.l);
              b.c = seam.c;
              b.v += seam.v;
              b.bv += seam.bv;
            }
            cut = null;
            seam = null;
          }
          let lo = Infinity;
          m.forEach((c, t) => {
            if (t < lo) lo = t;
          });
          const all = new Map(c15.map((c) => [c.t, c]));
          /*
           * a backfill's oldest bucket may be partial: keep
           * the one we have
           */
          m.forEach((c, t) => {
            if (!first && t === lo && all.has(t)) return;
            all.set(t, c);
          });
          c15 = [...all.values()]
            .sort((x, y) => x.t - y.t)
            .slice(-8000);
          if (first) {
            bricks = lbBars(c15).length;
            $("mst").textContent =
              bricks >= TARGET
                ? ""
                : "loading 15s " + bricks + "/" + TARGET;
          }
          schedule();
          return first && bricks >= TARGET;
        });
        cut = null;
        seam = null;
        if (first)
          $("mst").textContent =
            m.size && bricks < TARGET
              ? "15s history: only " +
                bricks +
                " bricks available"
              : "";
        return m.size > 0;
      }
      /* 15s fills run one at a time */
      let q15 = Promise.resolve();
      const load15 = (since) =>
        hist(
          "15s",
          () =>
            (q15 = q15
              .then(() => fill15(since))
              .catch((e) => {
                console.error(e);
                return false;
              })),
        );
      /*
       * Three-line break bricks built from candle closes;
       * each brick carries the volume since the previous
       * brick
       */

              kl(h, "interval=" + iv + "&limit=" + lim),

            if (!Array.isArray(j) || !j.length) continue;
            const arr = j.map(toC),
              f = arr[0].t,
              lt = arr[arr.length - 1].t,

              kl(

              arr = j.map(toC).filter((c) => c.t < cur[0].t);

              g.fillStyle =
                r === P.poc
                  ? "rgba(0,51,102,.25)"
                  : "rgba(47,128,200,.08)";
              g.fillRect(
                cx0 - 2,
                Y((r + 1) * P.step),
                colW + 2,
                rowH,
              );
            }
            P.rows.forEach((lst, r) => {
              const yT = Y((r + 1) * P.step);
              if (yT > bot || yT + rowH < top) return;
              lst.forEach((idx, k) => {
                g.fillStyle = tpoColor(idx, 0.72);
                g.fillRect(
                  cx0 + k * lw,
                  yT + 0.5,
                  Math.max(1, lw - 1),
                  Math.max(1, rowH - 1),
                );
              });
            });
          }
          g.restore();
          /*
           * 15m history needed: three days before the oldest
           * day on the chart (its previous day, plus the two
           * that set that day's row size), and likewise for
           * the profiles
           */
          if (cfg.tpo && seeded["15m"] && k15.length) {
            /* a little over the days needed, to be safe */
            const d0 = dayOf(geo[0].c.t),
              need =
                Math.min(d0 - 3 * DAY, dayStart - (cnt + 1) * DAY) -
                7200000;
            if (need < k15[0].t) older("15m");
          }
          if (cfg.tpo) {
            g.strokeStyle = "#cfd5dc";
            g.beginPath();
            g.moveTo(x0 - 5, top);
            g.lineTo(x0 - 5, bot);
            g.stroke();
          }
          /* session legend + day labels under each profile */

          g.font = "10px ui-monospace,Menlo,monospace";
          g.textBaseline = "middle";
          profs.forEach((P) => {
            if (!P.show) return;
            const gr = g.createLinearGradient(
              P.cx0,
              0,
              P.cx0 + colW,
              0,
            );
            STOPS.forEach(([h, c]) =>
              gr.addColorStop(h / 21, `rgb(${c})`),
            );
            g.fillStyle = gr;
            g.fillRect(P.cx0, bot + 6, colW, 5);
            g.fillStyle = "#6b7684";
            g.textAlign = "left";
            if (P.d === cnt - 1)
              [
                ["Asia", 0],
                ["EU", 8],
                ["US", 14],
              ].forEach(([t, h]) =>
                g.fillText(t, P.cx0 + (colW * h) / 21, bot + 19),
              );
            g.fillText(
              new Date(P.dS).toLocaleDateString([], {
                weekday: "short",
                day: "2-digit",
                timeZone: "UTC",
              }) + (colW > 150 ? " · TPO 30m UTC" : ""),
              P.cx0,
              bot + 32,
            );
          });
          g.font = "11px ui-monospace,Menlo,monospace";
          /* a horizontal stroke between two x positions */
          const hseg = (yv, xa, xb, col, dash, wd) => {
            const y = Y(yv);
            if (y < top || y > bot) return;
            g.strokeStyle = col;
            g.lineWidth = wd;
            g.setLineDash(dash);
            g.beginPath();
            g.moveTo(xa, y);
            g.lineTo(xb, y);
            g.stroke();
            g.setLineDash([]);
            g.lineWidth = 1;
          };
          /*
           * Reference levels, cut per UTC day: over each day's
           * candles the chart shows the POC band, the value
           * area and the vol steps of the day before it. So
           * today uses yesterday's levels, yesterday uses the
           * day before's, and so on.
           */
          const segs = [];
          if (cfg.tpo)
            geo.forEach((o) => {
              const dS = dayOf(o.c.t),
                s = segs[segs.length - 1];
              if (s && s.dS === dS) s.xb = o.x + o.w;
              else segs.push({ dS, xa: o.x, xb: o.x + o.w });
            });
          if (segs.length) segs[segs.length - 1].xb = px0;
          segs.forEach((sg, i) => {
            const R = dayProf(prevDay(sg.dS));
            if (R.poc == null || !R.full) return;
            /*
             * the last day on the chart also runs its POC band
             * and vol lines across the TPO profiles, and is the
             * one whose prices are written in the axis
             */
            const last = i === segs.length - 1,
              own = [sg.xa, sg.xb],
              spans = last ? [[0, x0 - 5], own] : [own],
              pT = (R.poc + 1) * R.step,
              pB = R.poc * R.step,
              pc = (pT + pB) / 2,
              vah = (R.b + 1) * R.step,
              val = R.a * R.step,
              v = volPct ? (pc * volN) / 100 : volN,
              /* kS thins the ladder below 16px spacing */
              kS = Math.max(
                1,
                Math.ceil(16 / ((v * ch) / (hi - lo))),
              ),
              inK = (k) =>
                k < 5000 && (pc + k * v <= hi || pc - k * v >= lo);
            g.save();
            g.beginPath();
            g.rect(0, top, px0, bot - top);
            g.clip();
            /* value area: pale blue, chart only */
            g.fillStyle = "rgba(47,128,200,.13)";
            g.fillRect(
              sg.xa,
              Y(vah),
              sg.xb - sg.xa,
              Y(val) - Y(vah),
            );
            /* POC: a navy band one TPO row tall */
            g.fillStyle = "rgba(0,51,102,.3)";
            spans.forEach(([xa, xb]) =>
              g.fillRect(xa, Y(pT), xb - xa, Y(pB) - Y(pT)),
            );
            g.restore();
            /* vol ladder: solid navy zero through the POC,
               then a dashed step every 1x, 2x, 3x... */
            if (volN > 0)
              spans.forEach(([xa, xb]) => {
                hseg(pc, xa, xb, "#003366", [], 1.5);
                for (let k = kS; inK(k); k += kS)
                  [pc + k * v, pc - k * v].forEach((p) =>
                    hseg(p, xa, xb, "rgba(0,0,0,.5)", [3, 3], 1),
                  );
              });
            if (!last) return;
            /* prices in the axis column, on white patches */
            const tag = (p, col) => {
              const y = Y(p);
              if (y >= top && y <= bot)
                ptag(y, p.toFixed(DP), "#fff", col);
            };
            tag(pc, "#003366");
            tag(vah, "#2f80c8");
            tag(val, "#2f80c8");
            if (volN > 0) {
              const name = (p, t, col) => {
                const y = Y(p);
                if (y < top || y > bot) return;
                g.fillStyle = col;
                g.textAlign = "right";
                g.textBaseline = "middle";
                g.fillText(t, px0 - 4, y - 7);
              };
              name(pc, "0", "#003366");
              for (let k = kS; inK(k); k += kS) {
                name(pc + k * v, "+" + k, "#000000");
                tag(pc + k * v, "#000000");
                name(pc - k * v, "−" + k, "#000000");
                tag(pc - k * v, "#000000");
              }
            }
          });

          /* candles */

          geo.forEach(({ x, w, c }) => {
            const col = c.c >= c.o ? "#089981" : "#000000",
              xm = x + w / 2;
            g.save();
            g.beginPath();
            g.rect(x0, top, cw, bot - top);
            g.clip();
            g.strokeStyle = col;
            g.fillStyle = col;
            g.beginPath();
            g.moveTo(xm, Y(c.h));
            g.lineTo(xm, Y(c.l));
            g.stroke();
            const yo = Y(c.o),
              yc = Y(c.c);
            g.fillRect(
              x + 1,
              Math.min(yo, yc),
              Math.max(1, w - 2),
              Math.max(1, Math.abs(yo - yc)),
            );
            g.restore();
          });
          /*
           * circles: green below bullish bars, black above
           * bearish bars
           */
          if (cfg.main) {
            const fl = bigFlags(
              arr,
              Math.max(0, arr.length - off - N),
              Math.min(arr.length, arr.length - off),
            );
            geo.forEach((o) => {
              const f = fl.get(o.c);
              if (!f) return;
              const c = o.c;
              if (c.c === c.o) return;
              const bull = c.c > c.o,
                y = bull ? Y(c.l) + 12 : Y(c.h) - 12;
              if (y < top || y > bot) return;
              g.fillStyle = bull ? "#4caf50" : "#000000";
              g.beginPath();
              g.arc(o.x + o.w / 2, y, 5, 0, 6.2832);
              g.fill();
            });
          }
          /*
           * vertical grid: a line every 6 hours counted from
           * UTC midnight, where the day and its levels change
           * (01, 07, 13, 19 on a London summer clock), drawn
           * behind everything
           */
          const SIX = 21600000,
            p2 = (v) => String(v).padStart(2, "0"),
            slot = (t) => Math.floor(t / SIX),
            marks = cfg.main
              ? geo.filter(
                  (o, i) => i && slot(o.c.t) !== slot(geo[i - 1].c.t),
                )
              : [];
          g.save();
          g.globalCompositeOperation = "destination-over";
          g.lineWidth = 1.5;
          marks.forEach((o) => {
            const xm = Math.round(o.x + o.w / 2) + 0.5,
              mid0 = new Date(o.c.t).getUTCHours() < 6;
            /* midnight solid navy like the 0 line, the
               others dashed black like the vol steps */
            g.strokeStyle = mid0 ? "#003366" : "rgba(0,0,0,.5)";
            g.setLineDash(mid0 ? [] : [3, 3]);
            g.lineWidth = mid0 ? 1.5 : 1;
            g.beginPath();
            g.moveTo(xm, top);
            g.lineTo(xm, bot);
            g.stroke();
          });
          g.restore();
          /* time labels: on the 6-hour lines when there are
             at least two of them, else every few candles */

          g.fillStyle = "#6b7684";
          g.textAlign = "center";
          const every = Math.ceil(vis.length / 8);
          let lastX = -1e9;
          if (marks.length >= 2)
            marks.forEach((o) => {
              /* the line's time on the local clock; the date
                 (UTC) on the line that starts a day */
              const xm = o.x + o.w / 2,
                d = new Date(slot(o.c.t) * SIX);
              if (xm - lastX < 46) return;
              lastX = xm;
              g.fillText(
                d.getUTCHours()
                  ? p2(d.getHours()) + ":" + p2(d.getMinutes())
                  : d.toLocaleDateString([], {
                      day: "2-digit",
                      month: "short",
                      timeZone: "UTC",
                    }),
                xm,
                bot + 10,
              );
            });
          else
            geo.forEach((o, i) => {
              if (i % every === 0) {
                const d = new Date(o.c.t);
                g.fillText(
                  p2(d.getHours()) +
                    ":" +
                    p2(d.getMinutes()) +
                    (sec() ? ":" + p2(d.getSeconds()) : ""),
                  o.x + o.w / 2,
                  bot + 10,
                );
              }
            });
          /* user lines (Alt+H / Alt+V) */

          view = {
            hi,
            lo,
            top,
            bot,
            ch,
            px0,
            x0,
            Y,
            pc: cw / slots,
          };
          /*
           * l.lo = first point, l.hi = second point: the
           * dashed line sits 34% from the first point
           */
          const drawBox = (l, sel) => {
            const mx = Math.max(l.lo, l.hi),
              mn = Math.min(l.lo, l.hi),
              yT = Y(mx),
              yB = Y(mn),
              o = geoAt(l.t),
              xs = o ? o.x + o.w / 2 : x0,
              p66 = l.hi + 0.66 * (l.lo - l.hi),
              y66 = Y(p66);
            g.save();
            g.beginPath();
            g.rect(xs, top, px0 - xs, bot - top);
            g.clip();
            g.fillStyle = "rgba(120,130,145,.18)";
            g.fillRect(xs, yT, px0 - xs, yB - yT);
            g.strokeStyle = "rgba(91,107,125,.5)";
            g.lineWidth = sel ? 2 : 1;
            g.setLineDash([]);
            g.strokeRect(xs, yT, px0 - xs, yB - yT);
            g.setLineDash([5, 4]);
            g.beginPath();
            g.moveTo(xs, y66);
            g.lineTo(px0, y66);
            g.stroke();
            g.setLineDash([]);
            g.restore();
            [
              [mx, yT],
              [p66, y66],
              [mn, yB],
            ].forEach(([pv, yy]) => {
              if (yy >= top && yy <= bot)
                ptag(yy, pv.toFixed(DP), "#5b6b7d");
            });
          };
          /*
           * Automatic channel on the latest big-volume candle.
           * It is as tall as that candle (high to low) and it
           * trails the market: after a down candle its bottom
           * follows every new low, after an up candle its top
           * follows every new high. It is drawn as a channel,
           * candle by candle, so the moving edges are visible
           * from the start.
           * When a candle closes out of it on the far side
           * (above when following lows, below when following
           * highs), that channel stops there and a new one of
           * the same height starts in the opposite direction,
           * and so on. Following highs = green, lows = black.
           */
          if (cfg.main && autoBox) {
            let k = arr.length - 1;
            for (; k >= BIG_WIN - 1; k--) {
              const c = arr[k];
              if (okC(c) && c.c !== c.o && isBig(arr, k)) break;
            }
            if (k >= BIG_WIN - 1) {
              const A = arr[k],
                ht = A.h - A.l,
                where = new Map(geo.map((o) => [o.c, o])),
                runs = [];
              let dn = A.c < A.o,
                ext = dn ? A.l : A.h,
                pts = [{ c: A, ext }];
              for (let j = k + 1; j < arr.length; j++) {
                const q = arr[j];
                if (!okC(q)) continue;
                ext = dn ? Math.min(ext, q.l) : Math.max(ext, q.h);
                pts.push({ c: q, ext });
                const out = dn ? q.c > ext + ht : q.c < ext - ht;
                if (!out) continue;
                runs.push({ dn, pts, live: false });
                dn = !dn;
                ext = dn ? q.l : q.h;
                pts = [{ c: q, ext }];
              }
              runs.push({ dn, pts, live: true });
              runs.forEach((r) => {
                /* far = the side away from the trailed edge;
                   the 66% line sits 34% in from it */
                const far = (e) => (r.dn ? e + ht : e - ht),
                  p66 = (e) => e + 0.66 * (far(e) - e),
                  rgb = r.dn ? "0,0,0" : "8,153,129",
                  n = r.pts.length,
                  sg = [];
                r.pts.forEach((p, i) => {
                  const o = where.get(p.c);
                  if (!o) return;
                  const xm = o.x + o.w / 2,
                    end = i === n - 1;
                  sg.push({
                    e: p.ext,
                    xa: i ? o.x : xm,
                    xb: end ? (r.live ? px0 : xm) : o.x + o.w,
                  });
                });
                if (!sg.length) return;
                const edge = (f, back) => {
                  (back ? [...sg].reverse() : sg).forEach((s) => {
                    const y = Y(f(s.e));
                    g.lineTo(back ? s.xb : s.xa, y);
                    g.lineTo(back ? s.xa : s.xb, y);
                  });
                };
                g.save();
                g.beginPath();
                g.rect(x0, top, px0 - x0, bot - top);
                g.clip();
                g.beginPath();
                g.moveTo(sg[0].xa, Y(sg[0].e));
                edge((e) => e, false);
                edge(far, true);
                g.closePath();
                g.fillStyle = "rgba(" + rgb + ",.13)";
                g.fill();
                g.strokeStyle = "rgba(" + rgb + ",.5)";
                g.lineWidth = 1;
                g.setLineDash([]);
                g.stroke();
                g.setLineDash([5, 4]);
                g.beginPath();
                g.moveTo(sg[0].xa, Y(p66(sg[0].e)));
                edge(p66, false);
                g.stroke();
                g.setLineDash([]);
                g.restore();
                /* current prices of the live channel, when
                   its latest candle is on screen */
                if (!r.live || !where.has(r.pts[n - 1].c)) return;
                const e = r.pts[n - 1].ext;
                [e, p66(e), far(e)].forEach((pv) => {
                  const yy = Y(pv);
                  if (yy >= top && yy <= bot)
                    ptag(yy, pv.toFixed(DP), "rgb(" + rgb + ")");
                });
              });
              g.lineWidth = 1;
            }
          }
          /*
           * own orders (from orders.js): a segment at the
           * order price for as long as the order was alive,
           * as thick as its quantity; dot = filled,
           * cancelled just stops, open orders run to the edge
           */
          if (showOrders && orders.length) {
            const n = arr.length;
            const tEnd = off > 0 && n - off < n
              ? arr[n - off].t
              : Infinity;
            const tFirst = geo[0].c.t;
            const mq = Math.max(...orders.map((o) => o.qty));
            g.save();
            g.beginPath();
            g.rect(x0, top, px0 - x0, bot - top);
            g.clip();
            orders.forEach((o) => {
              const y = Y(o.price);
              const gone = o.t1 != null && o.t1 < tFirst;
              if (y < top || y > bot || o.t0 >= tEnd || gone)
                return;
              const a = geoAt(o.t0);
              const ended = o.t1 != null && o.t1 < tEnd;
              const b = ended ? geoAt(o.t1) : null;
              let xs = a ? a.x + a.w / 2 : x0;
              let xe = b ? b.x + b.w / 2 : px0;
              if (xe - xs < 6) {
                xs -= 3;
                xe = xs + 6;
              }
              const col = o.buy ? "#56b4e9" : "#e69f00";
              g.strokeStyle = g.fillStyle = col;
              g.lineWidth = Math.max(1.5, (10 * o.qty) / mq);
              g.globalAlpha = ended ? 0.55 : 0.9;
              g.setLineDash([]);
              g.beginPath();
              g.moveTo(xs, y);
              g.lineTo(xe, y);
              if (showLines) g.stroke();
              g.globalAlpha = 1;
              g.lineWidth = 1.5;
              g.beginPath();
              if (ended && o.filled) {
                /* dot in the order's colour, bigger for
                   bigger sizes (area follows quantity) */
                const rDot = 2 + 4 * Math.sqrt(o.qty / mq);
                g.fillStyle = col;
                g.arc(xe, y, rDot, 0, 6.2832);
                g.fill();
              }
            });
            g.restore();
            g.lineWidth = 1;
          }
          lines.forEach((l) => {
            const sel = l === hl || l === drag;
            g.strokeStyle = g.fillStyle = "#8e44ad";
            g.lineWidth = sel ? 2 : 1;
            g.setLineDash([]);
            g.beginPath();
            if (l.k === "h") {
              g.strokeStyle = "#1f3a93";
              g.lineWidth = sel ? 6 : 4;
              const y = Y(l.p);
              if (y >= top && y <= bot) {
                g.moveTo(4, y);
                g.lineTo(px0, y);
                g.globalAlpha = 0.5;
                g.stroke();
                g.globalAlpha = 1;
                ptag(y, l.p.toFixed(DP), "#1f3a93");
              }
            } else if (l.k === "v") {
              g.strokeStyle = "#1f3a93";
              g.lineWidth = sel ? 6 : 4;
              const o = geoAt(l.t);
              if (o) {
                const cx = o.x + o.w / 2;
                g.moveTo(cx, top);
                g.lineTo(cx, bot);
                g.globalAlpha = 0.5;
                g.stroke();
                g.globalAlpha = 1;
                ttag(cx, dlabel(l.t), "#1f3a93");
              }
            } else if (l.k === "d") {
              const o = geoAt(l.t),
                xs = o ? o.x + o.w / 2 : x0,
                y = Y(l.p);
              if (y >= top && y <= bot) {
                g.strokeStyle = g.fillStyle = "#1f3a93";
                g.lineWidth = sel ? 3 : 2;
                g.beginPath();
                g.moveTo(xs, y);
                g.lineTo(px0, y);
                g.stroke();
                g.beginPath();
                g.arc(xs, y, sel ? 2.5 : 1.5, 0, 6.2832);
                g.fill();
                ptag(y, l.p.toFixed(DP), "#1f3a93");
              }
            } else if (l.k === "b") drawBox(l, sel);
            g.lineWidth = 1;
          });
          if (dotTool) {
            g.font = "11px ui-monospace,Menlo,monospace";
            g.fillStyle = "#1f3a93";
            g.textAlign = "left";
            g.textBaseline = "middle";
            g.fillText(
              "Dot: click a point (Esc cancels)",
              x0 + 8,
              top + 10,
            );
          }
          if (boxTool) {
            g.font = "11px ui-monospace,Menlo,monospace";
            g.fillStyle = "#5b6b7d";
            g.textAlign = "left";
            g.textBaseline = "middle";
            g.fillText(
              boxTool === 1
                ? "Box: click the bottom level"
                : "Box: click the top level (Esc cancels)",
              x0 + 8,
              top + 10,
            );
          }
          /* last price */

          const last = vis[vis.length - 1],
            lp = mid != null ? mid : last.c,
            ly = Math.max(top, Math.min(bot, Y(lp)));
          g.strokeStyle = "#000000";
          g.setLineDash([4, 3]);
          g.lineWidth = 2;
          g.beginPath();
          g.moveTo(4, ly);
          g.lineTo(px0, ly);
          g.stroke();
          g.lineWidth = 1;
          g.setLineDash([]);
          /*
           * tag sits left of the axis so it does not cover the
           * level tags of drawings
           */
          {
            const lt = lp.toFixed(DP),
              lw = g.measureText(lt).width + 10;
            g.fillStyle = "#000000";
            g.fillRect(px0 - lw, ly - 9, lw, 18);
            g.fillStyle = "#ffffff";
            g.textAlign = "left";
            g.textBaseline = "middle";
            g.fillText(lt, px0 - lw + 5, ly);
          }
          /* hover */

          /* crosshair line / tag background / tag text */
          const XH = "rgba(184,134,11,.8)",
            XB = "#ffe58a",
            XF = "#1a1f26";
          if (
            mouse &&
            mouse.x >= 4 &&
            mouse.x <= px0 &&
            mouse.y >= top &&
            mouse.y <= bot
          ) {
            const inTpo = mouse.x < x0 - 5,
              o = !inTpo && hover >= 0 && geo[hover],
              cx = o ? o.x + o.w / 2 : mouse.x,
              pv = hi - ((mouse.y - top) / ch) * (hi - lo);
            g.strokeStyle = XH;
            g.setLineDash([4, 4]);
            g.beginPath();
            g.moveTo(cx, top);
            g.lineTo(cx, bot);
            g.moveTo(4, mouse.y);
            g.lineTo(px0, mouse.y);
            g.stroke();
            g.setLineDash([]);
            ptag(mouse.y, pv.toFixed(DP), XB, XF);
            let lbl = null;
            if (o) lbl = dlabel(o.c.t);
            else if (inTpo) {
              const P = profs.find(
                (q) =>
                  q.show &&
                  mouse.x >= q.cx0 - 2 &&
                  mouse.x <= q.cx0 + colW,
              );
              if (P && P.poc != null) {
                const ri = Math.floor(pv / P.step),
                  k = Math.floor((mouse.x - P.cx0) / P.lw),
                  lst = P.rows.get(ri),
                  idx = lst && lst[k];
                /* TPO periods are UTC half-hours: say so */
                if (idx != null) {
                  const f = (t) =>
                      new Date(t).toLocaleTimeString([], {
                        hour: "2-digit",

      /*
       * Ctrl+S (or Cmd+S) saves drawings + all settings in
       * this browser's localStorage; restored on reload
       */

      const SAVE_KEY = "btcfdusd-state-v2";
      /* raise this whenever the default vol / B / O change */
      const DEFAULTS_VER = 3;
      function toast(t) {
        const el = $("toast");
        el.textContent = t;
        el.style.opacity = 1;
        clearTimeout(toast.h);
        toast.h = setTimeout(() => {
          el.style.opacity = 0;
        }, 1800);
      }
      let miniBox = null;
      function snapshot() {
        const r = mini.getBoundingClientRect();
        if (r.width > 0)
          miniBox = {
            x: Math.round(r.left),
            y: Math.round(r.top),
            w: Math.round(r.width),
            h: Math.round(r.height),
          };
        return {
          v: 2,
          dv: DEFAULTS_VER,
          vol: $("vol").value,
          autoBox,
          showOrders,
          showLines,
          lines: lines.filter(
            (l) => !(l.k === "b" && l.lo === l.hi),
          ),
          main: mainChart.getState(),
          mini: miniChart.getState(),
          win: Object.assign(
            { hidden: mini.style.display === "none" },
            miniBox || {},
          ),
        };
      }
      function restore() {
        let st = null;
        try {
          st = JSON.parse(
            localStorage.getItem(SAVE_KEY) || "null",
          );
        } catch (e) {}
        if (!st) {
          try {
            const old = JSON.parse(
              localStorage.getItem("btcfdusd-drawings-v1") ||
                "null",
            );
            if (Array.isArray(old)) st = { lines: old };
          } catch (e) {}
        }
        if (!st) return;
        if (Array.isArray(st.lines))
          lines.push(...st.lines.filter((l) => l && l.k));
        /* vol / B / O / L saved before version 2 of the
           defaults are ignored */
        const cur = st.dv >= 2;
        if (cur && typeof st.autoBox === "boolean")
          setAutoBox(st.autoBox);
        if (cur && typeof st.showOrders === "boolean")
          setShowOrders(st.showOrders);
        if (cur && typeof st.showLines === "boolean")
          setShowLines(st.showLines);
        if (cur && typeof st.vol === "string") {
          $("vol").value = st.vol;
          setVol(st.vol);
        }
        /*
         * A reload behaves like Alt+R, except that drawings
         * and settings are kept: the view (zoom, pan, price
         * scale, floating window) always starts from its
         * default, so only mode / timeframe / TPO days are
         * taken from the saved chart state.
         */
        const keep = (s) =>
          s && { mode: s.mode, TF: s.TF, nTpo: s.nTpo };
        mainChart.setState(keep(st.main));
        miniChart.setState(keep(st.mini));
        schedule();
      }
      addEventListener("keydown", (e) => {
        if (
          (e.ctrlKey || e.metaKey) &&
          !e.altKey &&
          String(e.key).toLowerCase() === "s"
        ) {
          e.preventDefault();
          try {
            const snap = snapshot();
            localStorage.setItem(SAVE_KEY, JSON.stringify(snap));
            toast(
              "Settings and drawings saved (" +
                snap.lines.length +
                " drawings)",
            );
          } catch (err) {
            toast("Could not save: browser storage is blocked");
          }
        }
      });

      /*
       * floating 15s line-break window: drag the top-left
       * grip to resize (anchored bottom-right)
       */

      const mini = $("mini");
      /* keep the window inside the viewport */
      function setMiniBox(bx) {
        const w = Math.max(240, Math.min(innerWidth, bx.w)),
          h = Math.max(160, Math.min(innerHeight, bx.h));
        mini.style.left =
          Math.max(0, Math.min(innerWidth - w, bx.x)) + "px";
        mini.style.top =
          Math.max(0, Math.min(innerHeight - h, bx.y)) + "px";
        mini.style.width = w + "px";
        mini.style.height = h + "px";
      }
      /* default: minimum size, top-left corner of the page */
      {
        const r0 = mini.getBoundingClientRect();
        setMiniBox({
          x: 0,
          y: 0,
          w: 240,
          h: 160,
        });
      }
      addEventListener("resize", () => {
        const r = mini.getBoundingClientRect();
        if (r.width > 0)
          setMiniBox({
            x: r.left,
            y: r.top,
            w: r.width,
            h: r.height,
          });
      });
      /*
       * resize from any corner; the opposite corner stays
       * put
       */
      document.querySelectorAll("#mini .grip").forEach((gp) =>
        gp.addEventListener("pointerdown", (e) => {
          const c = gp.dataset.c,
            r = mini.getBoundingClientRect(),
            sx = e.clientX,
            sy = e.clientY;
          gp.setPointerCapture(e.pointerId);
          e.preventDefault();
          const mv = (ev) => {
            const dx = ev.clientX - sx,
              dy = ev.clientY - sy;
            let x1 = r.left,
              x2 = r.right,
              y1 = r.top,
              y2 = r.bottom;
            if (c[1] === "l")
              x1 = Math.max(
                0,
                Math.min(r.right - 240, r.left + dx),
              );
            else
              x2 = Math.min(
                innerWidth,
                Math.max(r.left + 240, r.right + dx),
              );
            if (c[0] === "t")
              y1 = Math.max(
                0,
                Math.min(r.bottom - 160, r.top + dy),
              );
            else
              y2 = Math.min(
                innerHeight,
                Math.max(r.top + 160, r.bottom + dy),
              );
            setMiniBox({ x: x1, y: y1, w: x2 - x1, h: y2 - y1 });
          };
          const up = () => {
            gp.removeEventListener("pointermove", mv);
            gp.removeEventListener("pointerup", up);
          };
          gp.addEventListener("pointermove", mv);
          gp.addEventListener("pointerup", up);
        }),
      );
      /* title bar: move the window */
      $("mhead").addEventListener("pointerdown", (e) => {
        if (e.target.closest && e.target.closest("button"))
          return;
        const hd = $("mhead"),
          r = mini.getBoundingClientRect(),
          sx = e.clientX,
          sy = e.clientY;
        hd.setPointerCapture(e.pointerId);
        e.preventDefault();
        const mv = (ev) =>
          setMiniBox({
            x: r.left + ev.clientX - sx,
            y: r.top + ev.clientY - sy,
            w: r.width,
            h: r.height,
          });
        const up = () => {
          hd.removeEventListener("pointermove", mv);
          hd.removeEventListener("pointerup", up);
        };
        hd.addEventListener("pointermove", mv);
        hd.addEventListener("pointerup", up);
      });
      $("mx").onclick = () => {
        mini.style.display = "none";
      };
      $("miniTog").onclick = () => {
        mini.style.display =
          mini.style.display === "none" ? "flex" : "none";
        miniChart.size();
      };

      addEventListener("keydown", (e) => {
        if (e.altKey && e.code === "KeyR") {
          e.preventDefault();
          if (
            lines.length &&
            !confirm(
              "Reset both charts and delete all " +
                lines.length +
                " drawings?",
            )
          )
            return;
          lines = [];
          linesSig = "";
          /* back to the minimum size, in the top-left
             corner of the page, over the header */
          mini.style.display = "flex";
          mini.style.width = "";
          mini.style.height = "";
          {
            const r = mini.getBoundingClientRect();
            setMiniBox({
              x: 0,
              y: 0,
              w: 240,
              h: 160,
            });
          }
          mainChart.resetView();
          miniChart.resetView();
          schedule();
          toast("Charts reset to default, drawings deleted");
        }
      });
      $("sym").textContent = SYM + " " + TF;
      document.title = SYM;
      /* default vol step, overridden by a saved layout */
      setVol($("vol").value);
      restore();
      $("boxTog").onclick = () => setAutoBox(!autoBox);
      $("ordTog").onclick = () => setShowOrders(!showOrders);
      $("ordLineTog").onclick = () => setShowLines(!showLines);
      $("vol").addEventListener("input", (e) =>
        setVol(e.target.value),
      );
      /* installable app: only when served over https */
      if (
        "serviceWorker" in navigator &&
        location.protocol === "https:"
      )
        navigator.serviceWorker.register("sw.js").catch(() => {});
      loadOrders();
      connect();
      hist(IV, () => seedIv(IV));
      hist("15m", () => seedIv("15m"));
      load15(null);
    </script>
  </body>
</html>
