          const pocRgb = (dS) => {
            const A = dayProf(dS),
              B = dayProf(prevDay(dS));
            if (A.poc == null || B.poc == null || !B.full)
              return "0,51,102";
            const d =
              (A.poc + 0.5) * A.step - (B.poc + 0.5) * B.step;
            return d < 0 ? "0,0,0" : "8,153,129";
          };
          /* the TPO profiles drawn at the left of the chart */
          const colW = (tpoW - 6 - (nTpo - 1) * gap) / nTpo,
            cnt = cfg.tpo && tpoW > 0 ? nTpo : 0;
          profs = [];
          /* tb whole days back, tf = the slide in between; one
             more day on the left while sliding */
          const tb = Math.floor(tpoBack),
            tf = tpoBack - tb,
            ex = cnt && tf > 0 ? 1 : 0,
            tpoDays = [dayStart - tb * DAY];
          while (tpoDays.length < cnt + ex)
            tpoDays.unshift(prevDay(tpoDays[0]));
          const zp = [];
          /* zigzag points from the last 15 days, whatever the
             profiles show, so the swings do not depend on the
             view (30 days loads 4x the 15m history, 2.5x the
             draw time): each day's POCs in order of their
             earliest brick, x = where their row ends (off
             screen if not shown) */
          const lastD = tpoDays[tpoDays.length - 1],
            zd = [];
          const zn = cnt && k15.length ? 15 : 0;
          for (let k = 0, s = dayOf(Date.now()); k < zn; k++)
            if (dayR.has(s - k * DAY)) zd.unshift(s - k * DAY);
          zd.forEach((dS) => {
            /* a day's points (price, first brick, row length,
               widest row) are kept; today's are redone when
               its 15m candle changes */
            const lk = k15[k15.length - 1],
              key = [
                dS,
                volAmt,
                k15[0].t,
                dS < dayOf(Date.now()) ? "" : lk.t + "|" + lk.v,
              ].join();
            let zc = zCache.get(key);
            if (!zc) {
              const Q = dayProf(dS),
                vf = volAmt > 0 ? volAmt : Q.step * 10;
              zc =
                Q.poc == null
                  ? []
                  : subPocs(Q.dS, Q.ps, vf, Q.step)
                      .map((S) => {
                        const row =
                          Q.rows.get(Math.floor(S.px / Q.step)) ||
                          [];
                        return {
                          p: S.px,
                          f: row.length ? Math.min(...row) : 99,
                          n: Math.max(1, row.length),
                          m: Q.maxC,
                        };
                      })
                      .sort((a, b) => a.f - b.f);
              if (zCache.size > 500) zCache.clear();
              zCache.set(key, zc);
            }
            const d = cnt + ex - 1 - Math.round((lastD - dS) / DAY),
              cx0 = 6 + (d - ex + tf) * (colW + gap);
            zc.forEach((z) =>
              zp.push({
                x: cx0 + (z.n - 0.5) * Math.min(11, (colW - 2) / z.m),
                y: Y(z.p),
                p: z.p,
                f: z.f,
                ds: dS,
              }),
            );
          });
          /*
           * St, no repaint: the colours (row -> colour) of day
           * dS's bricks as at the close of its period i, from
           * its rows and sub POCs up to then; kept in stFz
           * once that period has closed
           */
          /*
           * frozen on the vol.js value (else the vol box) and on
           * the day's own range so far, so neither the vol box
           * nor the days shown change them; m.step = their row
           * size, look colours up by price
           */
          const stFor = (dS, i) => {
            const vC = volFile || (volAmt > 0 ? volAmt : 0),
              P = dayProf(
                dS,
                vC ? Math.max(1, Math.ceil(vC / 10)) : undefined,
              ),
              vf = vC || P.step * 10,
              ps = P.ps.filter((q) => q.i <= i),
              key = [dS, i, vf, P.step].join();
            if (stFz.has(key)) return stFz.get(key);
            const rows = new Map();
            P.rows.forEach((l, r) => {
              const f = l.filter((x) => x <= i);
              if (f.length) rows.set(r, f);
            });
            const m = ps.length
              ? stepCols(
                  rows,
                  P.step,
                  subPocs(dS, ps, vf, P.step),
                )
              : new Map();
            m.step = P.step;
            if (dS + (i + 1) * TPO_MS <= Date.now()) {
              if (stFz.size > 3000) stFz.clear();
              stFz.set(key, m);
            }
            return m;
          };
          /* each POC's previous one in time (the day before's
             last for a day's first), for its colour */
          const zPrev = new Map(
            zp.map((q, i) => [
              q.ds + "|" + q.p,
              i ? zp[i - 1].p : null,
            ]),
          );
          /* Alt+R: prices centred on the previous day's last
             sub POC (the ladder's 0; else the latest POC), 6
             vol steps above and below, once the POCs are in */
          if (pocHome && zp.length && volAmt > 0) {
            const yd = prevDay(dayOf(Date.now())),
              q = zp.filter((z) => z.ds === yd).pop(),
              p = (q || zp[zp.length - 1]).p;
            lock = { hi: p + 6 * volAmt, lo: p - 6 * volAmt };
            ysc = 1;
            ypan = 0;
            pocHome = false;
            sched();
          } else if (!cnt || !(volAmt > 0)) pocHome = false;
          g.save();
          g.beginPath();
          g.rect(0, top, tR, bot - top);
          g.clip();
          g.font = "10px ui-monospace,Menlo,monospace";
          g.textBaseline = "middle";
          for (let d = 0; d < cnt + ex; d++) {
            const Q = dayProf(tpoDays[d]),
              cx0 = 6 + (d - ex + tf) * (colW + gap),
              rowH = (ch * Q.step) / (hi - lo),
              lw = Math.min(11, (colW - 2) / Q.maxC),
              P = Object.assign(
                { d, cx0, show: true, rowH, lw },
                Q,
              );
            profs.push(P);
            if (P.poc == null) continue;
            /* UD: the whole day black when its last ipoc in time
               is under its first (one ipoc: under the day
               before's last), else green */
            const ipocs = (q) =>
              q.ps.length
                ? subPocs(
                    q.dS,
                    q.ps,
                    volAmt > 0 ? volAmt : q.step * 10,
                    q.step,
                  )
                    .map((S) => {
                      const w = q.rows.get(Math.floor(S.px / q.step));
                      return [w ? Math.min(...w) : 99, S.px];
                    })
                    .sort((x, y) => x[0] - y[0])
                    .map((x) => x[1])
                : [];
            let ud = null;
            if (showUD || udZz) {
              const o = ipocs(P),
                ref = o.length > 1
                  ? o[0]
                  : ipocs(dayProf(prevDay(P.dS))).pop();
              if (o.length && ref != null)
                ud = o[o.length - 1] < ref ? "#000" : "#089981";
            }
            P.ud = ud;
            for (let r = P.a; r <= P.b; r++) {
              if (!showVA && r !== P.poc) continue;
              g.fillStyle =
                r === P.poc
                  ? "rgba(" + pocRgb(prevDay(tpoDays[d])) + ",.25)"
                  : "rgba(47,128,200,.08)";
              g.fillRect(
                cx0 - 2,
                Y((r + 1) * P.step),
                colW + 2,
                rowH,
              );
            }
            const vf = volAmt > 0 ? volAmt : P.step * 10;
            const sp = subPocs(P.dS, P.ps, vf, P.step),
              /* St, no repaint: a closed period's bricks keep
                 the colours they had at its close (stFor); the
                 forming period shows its time colour */
              shut = (i) => P.dS + (i + 1) * TPO_MS <= Date.now(),
              stAt = (i) => stFor(P.dS, i);
            /*
             * VP alert: the colour of today's latest closed
             * period at its close price (1 green, -1 red, 0
             * else) against the period before it
             */
            if (P.dS === dayOf(Date.now()) && k15.length) {
              const cls = (i) => {
                  const e = P.dS + (i + 1) * TPO_MS;
                  let c = null;
                  for (let j = k15.length - 1; j >= 0; j--)
                    if (k15[j].t < e && okC(k15[j])) {
                      c = k15[j].c;
                      break;
                    }
                  const col =
                    c == null
                      ? ""
                      : stAt(i).get(Math.floor(c / stAt(i).step)) ||
                        "";
                  return {
                    c,
                    z: col.startsWith("rgba(8,153,129")
                      ? 1
                      : col.startsWith("rgba(229,57,53")
                        ? -1
                        : 0,
                  };
                },
                shuts = P.ps.filter((q) => shut(q.i)),
                L = shuts[shuts.length - 1],
                Lp = shuts[shuts.length - 2],
                ev = [];
              if (L && Lp) {
                const a = cls(L.i),
                  b = cls(Lp.i);
                if (a.z && a.z !== b.z)
                  ev.push({
                    id: "v" + P.dS + "|" + L.i,
                    up: a.z > 0,
                    txt:
                      (a.z > 0 ? "green " : "red ") + a.c.toFixed(0),
                  });
              }
              vpEv = { ctx: [vf, P.step].join(), ev };
            }
            let iNow = -1,
              rNow = null;
            if (P.dS === dayOf(Date.now()) && k15.length) {
              P.rows.forEach((l) =>
                l.forEach((i) => (iNow = Math.max(iNow, i))),
              );
              rNow = Math.floor(
                (mid != null ? mid : k15[k15.length - 1].c) / P.step,
              );
            }

            P.rows.forEach((lst, r) => {
              const yT = Y((r + 1) * P.step);
              if (yT > bot || yT + rowH < top) return;
              lst.forEach((idx, k) => {
                g.fillStyle = showUD && ud
                  ? ud
                  : stCol && shut(idx)
                    ? stAt(idx).get(
                        Math.floor(
                          ((r + 0.5) * P.step) / stAt(idx).step,
                        ),
                      ) || SGREY
                    : tpoColor(idx, 0.72);
                g.fillRect(
                  cx0 + k * lw,
                  yT + 0.5,
                  Math.max(1, lw - 1),
                  Math.max(1, rowH - 1),
                );
                /* today's latest brick (current period, price
                   row): border in the last price blue */
                if (r === rNow && idx === iNow) {
                  g.strokeStyle = "#2962ff";
                  g.lineWidth = 1.5;
                  g.strokeRect(
                    cx0 + k * lw,
                    yT + 0.5,
                    Math.max(1, lw - 1),
                    Math.max(1, rowH - 1),
                  );
                }
              });
            });
            /* sub POCs: P1 solid, P2 dashed, P3 dotted, each
               tagged with its price and its birth brick; green
               above the POC before it, black below (navy with
               none before it); St: the earliest session in
               its row */
            sp.forEach(
              (S, k) => {
                const y = Y(S.px),
                  pv = zPrev.get(P.dS + "|" + S.px),
                  row = P.rows.get(Math.floor(S.px / P.step)),
                  c =
                    stCol && row && row.length
                      ? tpoColor(Math.min(...row))
                      : pv == null
                      ? "#003366"
                      : S.px < pv
                        ? "#000"
                        : "#089981",
                  tx = "P" + (k + 1) + " " + S.px.toFixed(DP) +
                    " ·" + S.born.toFixed(0);
                g.strokeStyle = c;
                g.lineWidth = 3;
                g.setLineDash([[], [8, 4], [3, 3]][k]);
                g.beginPath();
                g.moveTo(cx0 - 2, y);
                g.lineTo(cx0 + colW, y);
                g.stroke();
                g.setLineDash([]);
                /* white halo so the tag reads over bricks */
                g.font = "bold 11px ui-monospace,Menlo,monospace";
                g.textAlign = "left";
                g.strokeStyle = "#fff";
                g.lineWidth = 3;
                g.strokeText(tx, cx0, y - 9);
                g.fillStyle = c;
                g.fillText(tx, cx0, y - 9);
              },
            );
          }
          /*
           * UD zigzag (ZZ on): the shown days' colours set the
           * way, the prices set the pivots. Seeking a top (green
           * days) any day's higher high moves it, a black day's
           * too; the first black day then starts the bottom
           * from its low, which any lower low moves, a green
           * day's too; and so on
           */
          if (udZz) {
            const piv = [];
            profs.forEach((P) => {
              if (!P.ud || !P.ps.length) return;
              const up = P.ud !== "#000",
                h = Math.max(...P.ps.map((q) => q.h)),
                l = Math.min(...P.ps.map((q) => q.l)),
                /* on the profile's own axis, where its bricks
                   start */
                x = P.cx0,
                z = piv[piv.length - 1];
              if (!z) return piv.push({ up, px: up ? h : l, x });
              if (z.up ? h > z.px : l < z.px)
                [z.px, z.x] = [z.up ? h : l, x];
              if (z.up !== up) piv.push({ up, px: up ? h : l, x });
            });
            g.strokeStyle = "#7b1fa2";
            g.lineWidth = 2.5;
            g.setLineDash([]);
            g.beginPath();
            piv.forEach((q, i) =>
              i ? g.lineTo(q.x, Y(q.px)) : g.moveTo(q.x, Y(q.px)),
            );
            g.stroke();
            piv.forEach((q) => {
              g.fillStyle = q.up ? "#089981" : "#000";
              g.beginPath();
              g.arc(q.x, Y(q.px), 4, 0, 7);
              g.fill();
            });
            g.lineWidth = 1;
          }
          /* swing zigzag over the days' POCs; dashed = open */
          const zs = swings(zp),
            /* a leg ending past the swing before it of the same
               kind (a new high or a new low): green / red, else
               golden */
            legCol = (from, to, prev) =>
              prev && to.p > from.p && to.p > prev.p
                ? "#089981"
                : prev && to.p < from.p && to.p < prev.p
                  ? "#e53935"
                  : "rgba(230,159,0,.9)";
          g.lineWidth = 3.5;
          g.lineJoin = "round";
          g.lineCap = "round";
          zs.forEach(({ q }, i) => {
            if (!i || udZz) return;
            g.strokeStyle = legCol(
              zs[i - 1].q,
              q,
              i > 1 && zs[i - 2].q,
            );
            g.beginPath();
            g.moveTo(zs[i - 1].q.x, zs[i - 1].q.y);
            g.lineTo(q.x, q.y);
            g.stroke();
          });
          /* nested zigzags (see nests), thinner per level */
          (udZz ? [] : nests(zp, 4).slice(1)).forEach((z0, k) => {
            g.lineWidth = 2 * 0.7 ** k;
            z0.forEach(({ q }, i) => {
              if (!i) return;
              g.strokeStyle = legCol(
                z0[i - 1].q,
                q,
                i > 1 && z0[i - 2].q,
              );
              g.beginPath();
              g.moveTo(z0[i - 1].q.x, z0[i - 1].q.y);
              g.lineTo(q.x, q.y);
              g.stroke();
            });
          });
          /* zo = where the open leg ends */
          let zo = null;
          if (zs.length && zp.length - 1 > zs[zs.length - 1].i) {
            /* the open leg runs to the extreme since the last
               pivot: highest after a low, lowest after a high */
            const L = zs[zs.length - 1],
              a = L.q,
              hiNext = L.up !== true,
              z = zp
                .slice(L.i + 1)
                .reduce((m, q) =>
                  hiNext ? (q.p >= m.p ? q : m) : q.p <= m.p ? q : m,
                );
            g.setLineDash([6, 5]);
            g.lineWidth = 2;
            g.strokeStyle = legCol(
              a,
              z,
              zs.length > 1 && zs[zs.length - 2].q,
            );
            g.beginPath();
            g.moveTo(a.x, a.y);
            g.lineTo(z.x, z.y);
            if (!udZz) g.stroke();
            g.setLineDash([]);
            zo = z;
          }
          g.restore();
          /* POC bands from both ends of the last solid leg, the
             open leg's end, and every P1 / P2 / P3 of yesterday
             and today, right across DPoc and the chart, price
             tagged; each in its POC's colour (green above the
             POC before it, black below) */
          const today0 = dayOf(Date.now());
          (!pocBand ? [] : [
            ...new Set(
              (zs.length > 1 ? zs.slice(-2).map(({ q }) => q) : [])
                .concat(zo ? [zo] : [])
                .concat(
                  zp.filter(
                    (z) =>
                      z.ds === today0 || z.ds === prevDay(today0),
                  ),
                ),
            ),
          ]).forEach((q) => {
              if (q.y < top || q.y > bot) return;
              const pv = zPrev.get(q.ds + "|" + q.p),
                rc =
                  pv == null
                    ? "#003366"
                    : q.p < pv
                      ? "#000"
                      : "#089981";
              g.save();
              g.beginPath();
              g.rect(0, top, px0, bot - top);
              g.clip();
              /*
               * a band 3 bricks tall (no line), so it reads as a
               * POC, not a drawing: the outer bricks faint in its
               * colour, the middle one as the profile shows the
               * POC row (its latest brick: St colour once
               * closed, else its time colour)
               */
              const P = dayProf(q.ds),
                bs = P.step,
                xa = Math.max(0, q.x),
                band = (a, b, col) => {
                  const y1 = Y(q.p + a * bs);
                  g.fillStyle = col;
                  g.fillRect(xa, y1, px0 - xa, Y(q.p + b * bs) - y1);
                },
                row = P.rows.get(Math.floor(q.p / bs)) || [],
                li = row.length ? Math.max(...row) : null,
                done =
                  li != null &&
                  q.ds + (li + 1) * TPO_MS <= Date.now(),
                m = stCol && done ? stFor(q.ds, li) : null,
                mid =
                  li == null
                    ? SGREY
                    : m
                      ? m.get(Math.floor(q.p / m.step)) || SGREY
                      : tpoColor(li, 0.45),
                out =
                  rc === "#000"
                    ? "rgba(0,0,0,.12)"
                    : rc === "#089981"
                      ? "rgba(8,153,129,.18)"
                      : "rgba(0,51,102,.14)";
              band(1.5, 0.5, out);
              band(-0.5, -1.5, out);
              band(0.5, -0.5, mid);
              g.restore();
              ptag(q.y, q.p.toFixed(DP), rc);
            });
          /*
           * 15m history needed: three days before the oldest
           * day on the chart (its previous day, plus the two
           * that set that day's row size), and likewise for
           * the profiles
           */
          if (cfg.tpo && seeded["15m"] && k15.length) {
            /* a little over the days needed, to be safe */
            const d0 = dayOf(geo[0].c.t),
              need =
                Math.min(
                  d0 - 3 * DAY,
                  dayStart - (cnt + 2 + tb) * DAY,
                  /* the zigzag's 15 days */
                  dayOf(Date.now()) - 17 * DAY,
                ) -
                7200000;
            if (need < k15[0].t) older("15m");
          }
          /* the profiles sit in a soft rounded frame, like DPoc */
          /* frames touch: profiles | DPoc | chart */
          if (cfg.tpo && tpoW) panel(1, sL - 1);
          /* and the main chart, axis included */
          if (cfg.main) panel(x0 - 3, W - x0 + 1);
          /* session legend + day labels under each profile */

          g.font = "10px ui-monospace,Menlo,monospace";
          g.textBaseline = "middle";
          profs.forEach((P) => {
            /* legends only under whole profiles */
            const cut = P.cx0 < 4 || P.cx0 + colW > tR + 1;
            /* no legend for empty (future) days either */
            if (!P.show || cut || P.poc == null) return;
            const gr = g.createLinearGradient(
              P.cx0,
              0,
              P.cx0 + colW,
              0,
            );
            STOPS.forEach(([h, c]) =>
              gr.addColorStop(h / 21, `rgb(${c})`),
            );
            g.fillStyle = gr;
            g.fillRect(P.cx0, bot + 6, colW, 5);
            g.fillStyle = "#6b7684";
            g.textAlign = "left";
            if (P.d === tpoDays.length - 1)
              [
                ["Asia", 0],
                ["EU", 8],
                ["US", 14],
              ].forEach(([t, h]) =>
                g.fillText(t, P.cx0 + (colW * h) / 21, bot + 19),
              );
            g.fillText(
              new Date(P.dS).toLocaleDateString([], {
                weekday: "short",
                day: "2-digit",
                timeZone: "UTC",
              }) + (colW > 150 ? " · TPO 30m UTC" : ""),
              P.cx0,
              bot + 32,
            );
          });
          g.font = "11px ui-monospace,Menlo,monospace";
          /* a horizontal stroke between two x positions */
          const hseg = (yv, xa, xb, col, dash, wd) => {
            const y = Y(yv);
            if (y < top || y > bot) return;
            g.strokeStyle = col;
            g.lineWidth = wd;
            g.setLineDash(dash);
            g.beginPath();
            g.moveTo(xa, y);
            g.lineTo(xb, y);
            g.stroke();
            g.setLineDash([]);
            g.lineWidth = 1;
          };
          /*
           * Reference levels, cut per UTC day: over each day's
           * candles the chart shows the POC band, the value
           * area and the vol steps of the day before it. So
           * today uses yesterday's levels, yesterday uses the
           * day before's, and so on.
           */
          const segs = [];
          if (cfg.tpo)
            geo.forEach((o) => {
              const dS = dayOf(o.c.t),
                s = segs[segs.length - 1];
              if (s && s.dS === dS) s.xb = o.x + o.w;
              else segs.push({ dS, xa: o.x, xb: o.x + o.w });
            });
          if (segs.length) segs[segs.length - 1].xb = px0;
          /*
           * HL off: one fixed ladder for every day, from the
           * latest day's reference (yesterday's POC); HL on:
           * each day from its own day before's POC
           */
          const zDay = segs.length
              ? prevDay(segs[segs.length - 1].dS)
              : null,
            zR = zDay != null ? dayProf(zDay) : null,
            /* 0 = that day's last sub POC in time (where the
               zigzag and its dashed ray sit), else its POC row */
            zLast = zp.filter((q) => q.ds === zDay).pop(),
            zFix = zLast
              ? zLast.p
              : zR && zR.poc != null && zR.full
                ? (zR.poc + 0.5) * zR.step
                : null,
            zCol = zFix != null ? "rgb(" + pocRgb(zDay) + ")" : null;
          segs.forEach((sg, i) => {
            const R = dayProf(prevDay(sg.dS));
            if (R.poc == null || !R.full) return;
            const pRgb = pocRgb(prevDay(sg.dS)),
              pCol = "rgb(" + pRgb + ")";
            /*
             * the last day on the chart also runs its POC band
             * and vol lines across the TPO profiles, and is the
             * one whose prices are written in the axis
             */
            const last = i === segs.length - 1,
              own = [sg.xa, sg.xb],
              spans = last ? [[0, x0 - 5], own] : [own],
              pT = (R.poc + 1) * R.step,
              pB = R.poc * R.step,
              pc = (pT + pB) / 2,
              vah = (R.b + 1) * R.step,
              val = R.a * R.step,
              fx = !hlLad && zFix != null,
              z0 = fx ? zFix : pc,
              v = volPct ? (z0 * volN) / 100 : volN,
              /* kS thins the ladder below 16px spacing */
              kS = Math.max(
                1,
                Math.ceil(16 / ((v * ch) / (hi - lo))),
              ),
              inK = (k) =>
                k < 5000 && (z0 + k * v <= hi || z0 - k * v >= lo);
            g.save();
            g.beginPath();
            g.rect(0, top, px0, bot - top);
            g.clip();
            /* value area: light blue, chart only */
            g.fillStyle = "rgba(47,128,200,.25)";
            if (showVA)
              g.fillRect(
                sg.xa,
                Y(vah),
                sg.xb - sg.xa,
                Y(val) - Y(vah),
              );
            /* POC: a band 3 TPO rows tall (the POC row and one
               each side), coloured by pocRgb */
            g.fillStyle = "rgba(" + pRgb + ",.3)";
            (showPOC ? spans : []).forEach(([xa, xb]) =>
              g.fillRect(
                xa,
                Y(pT + R.step),
                xb - xa,
                Y(pB - R.step) - Y(pT + R.step),
              ),
            );
            /* a finished day also shows its own POC over its
               own candles, solid; carried to the next day it is
               shaded, so each POC covers its day and the next */
            const Q = dayProf(sg.dS),
              done = sg.dS < dayOf(arr[arr.length - 1].t);
            if (showPOC && done && Q.poc != null && Q.full) {
              const qT = Y((Q.poc + 2) * Q.step);
              g.fillStyle = "rgb(" + pocRgb(sg.dS) + ")";
              g.fillRect(
                sg.xa,
                qT,
                sg.xb - sg.xa,
                Y((Q.poc - 1) * Q.step) - qT,
              );
            }
            /* today: the developing POC, gold, stepping as it
               moved through the day */
            const devP = [];
            if (!done && Q.dev.length)
              geo.forEach((o) => {
                if (dayOf(o.c.t) !== sg.dS) return;
                let k = Math.floor((o.c.t - sg.dS) / TPO_MS);
                while (k > 0 && Q.dev[k] == null) k--;
                const p = Q.dev[k],
                  r = devP[devP.length - 1];
                if (p == null) return;
                if (r && r.p === p) r.xb = o.x + o.w;
                else devP.push({ p, xa: o.x, xb: o.x + o.w });
              });
            if (devP.length) devP[devP.length - 1].xb = sg.xb;
            g.fillStyle = "rgba(212,160,23,.55)";
            (showPOC ? devP : []).forEach(({ p, xa, xb }) =>
              g.fillRect(
                xa,
                Y((p + 2) * Q.step),
                xb - xa,
                Y((p - 1) * Q.step) - Y((p + 2) * Q.step),
              ),
            );
            g.restore();
            /*
             * Vol ladder. It starts on the previous day's
             * POC: solid navy zero, then a dashed step every
             * 1x, 2x, 3x... With the HL button the reference
             * can move. The day's running high and low are
             * both followed: a close more than 2 steps below
             * the high makes that high the reference (black,
             * steps going down), a close more than 2 steps
             * above the low makes that low the reference
             * (green, steps going up), whichever comes first.
             * After that only the other side is followed,
             * counted from that candle, and they alternate.
             * ref = the high / low in use (null = the POC),
             * up = side followed (null = both), runs =
             * stretches of the day with one reference.
             */
            const lv = ({ ref, refUp }) => {
              const a = [];
              if (ref == null) {
                a.push([z0, "0", fx ? zCol : pCol, 1]);
                for (let k = kS; inK(k); k += kS)
                  a.push(
                    [z0 + k * v, "+" + k, "#000000"],
                    [z0 - k * v, "−" + k, "#000000"],
                  );
                return a;
              }
              const s = refUp ? -1 : 1,
                n = refUp ? "H−" : "L+",
                col = refUp ? "#000000" : "#089981",
                at = (k) => ref + s * k * v,
                inV = (p) => (refUp ? p >= lo : p <= hi);
              /* 4th value: solid line, on even steps */
              for (let k = 0; k < 5000 && inV(at(k)); k += kS)
                a.push([at(k), k ? n + k : n[0], col, k % 2 === 0]);
              return a;
            };
            const runs = [{ ref: null, xa: sg.xa, xb: sg.xb }];
            if (volN > 0 && hlLad) {
              let up = null,
                H = -1e12,
                L = 1e12,
                ref = null,
                refUp;
              const step = (c) => {
                H = Math.max(H, c.h);
                L = Math.min(L, c.l);
                const dn = up !== false && c.c < H - 2 * v,
                  ris = up !== true && c.c > L + 2 * v;
                if (!dn && !ris) return;
                /* both on one giant candle: a red one takes
                   the high, a green one the low */
                refUp = dn && ris ? c.c < c.o : dn;
                ref = refUp ? H : L;
                up = !refUp;
                H = c.h;
                L = c.l;
              };
              /* day's candles left of the view count too */
              if (!i)
                arr.forEach((c) => {
                  if (
                    okC(c) &&
                    dayOf(c.t) === sg.dS &&
                    c.t < geo[0].c.t
                  )
                    step(c);
                });
              runs.length = 0;
              geo.forEach((o) => {
                if (dayOf(o.c.t) !== sg.dS) return;
                step(o.c);
                const r = runs[runs.length - 1],
                  xb = o.x + o.w;
                if (r && r.ref === ref && r.refUp === refUp)
                  r.xb = xb;
                else runs.push({ ref, refUp, xa: o.x, xb });
              });
              if (last) runs[runs.length - 1].xb = sg.xb;
            }
            /* last day: its latest levels cross the TPO area */
            const end = runs[runs.length - 1],
              tpoRun = Object.assign({}, end, { xa: 0, xb: x0 - 5 });
            if (volN > 0)
              (last ? [tpoRun].concat(runs) : runs).forEach((r) =>
                /* "0": no line under the POC band, dashed when
                   the band is off */
                lv(r).forEach(([p, t, col, solid]) =>
                  t === "0" && showPOC ? 0 : hseg(
                    p,
                    r.xa,
                    r.xb,
                    col === "#000000" ? "rgba(0,0,0,.5)" : col,
                    solid && t !== "0" ? [] : [3, 3],
                    t.length > 1 ? 1 : 1.5,
                  ),
                ),
              );
            if (!last) return;
            /* prices in the axis column, on white patches */
            const tag = (p, col) => {
              const y = Y(p);
              if (y >= top && y <= bot)
                ptag(y, p.toFixed(DP), "#fff", col);
            };
            if (showPOC) tag(pc, pCol);
            /* developing POC price, mid-brick */
            if (showPOC && devP.length) {
              const dp = devP[devP.length - 1].p;
              tag((dp + 0.5) * Q.step, "#b8860b");
            }
            if (showVA) {
              tag(vah, "#2f80c8");
              tag(val, "#2f80c8");
            }
            if (volN > 0) {
              const name = (p, t, col) => {
                const y = Y(p);
                if (y < top || y > bot) return;
                g.fillStyle = col;
                g.textAlign = "right";
                g.textBaseline = "middle";
                g.fillText(t, px0 - 4, y - 7);
              };
              lv(end).forEach(([p, t, col]) => {
                name(p, t, col);
                tag(p, col);
              });
            }
          });

          /*
           * POC candles (PC button), over every loaded day.
           * Each day's POC is red (below the day before's) or
           * green. A red POC lower than the previous red POC
           * makes a black candle, a green POC higher than the
           * previous green one a green candle: open at the
           * earlier POC, close at the later, high / low over
           * the days between.
           * SPoc: the same over every sub POC in time order
           * (by earliest brick within a day), each against
           * the previous POC instead of the day before's.
           */
          /*
           * full-width icons, top right of each window: four
           * bare corner brackets, light grey, darker while the
           * mouse is over that window; pointing inward (exit)
           * when that window is the full one. xl = the
           * window's left edge. icons = their boxes, for clicks.
           */
          const icons = [];
          /* alert toggles left of it: up / down triangles,
             filled green / black while armed; row = 0 or 1
             (under), lb = a name on their left */
          const alIcons = (w, xr, row = 0, lb) => {
            if (lb) {
              g.font = "10px ui-monospace,Menlo,monospace";
              g.fillStyle = "#6b7684";
              g.textAlign = "right";
              g.textBaseline = "middle";
              g.fillText(lb, xr - 58, top + 9.5 + row * 18);
            }
            ["dn", "up"].forEach((dir, i) => {
              const x = xr - 36 - i * 18,
                y = top + 3 + row * 18,
                up = dir === "up",
                on = alerts[w + "|" + dir];
              icons.push({
                k: "a|" + w + "|" + dir,
                x: x - 3,
                y: y - 3,
                w: 18,
                h: 19,
              });
              g.save();
              g.setLineDash([]);
              g.beginPath();
              g.moveTo(x + 1, up ? y + 10 : y + 3);
              g.lineTo(x + 11, up ? y + 10 : y + 3);
              g.lineTo(x + 6, up ? y + 2 : y + 11);
              g.closePath();
              g.lineWidth = 1.2;
              g.strokeStyle = on
                ? up
                  ? "#089981"
                  : "#000"
                : "#b4bdc8";
              g.fillStyle = up ? "#089981" : "#000";
              if (on) g.fill();
              else g.stroke();
              g.restore();
            });
          };
          const icon = (k, xl, xr) => {
            const x = xr - 16,
              y = top + 3,
              on = full === k,
              over =
                mouse &&
                mouse.x >= xl &&
                mouse.x <= xr &&
                mouse.y >= top &&
                mouse.y <= bot;
            /* click area a little larger than the drawing */
            icons.push({ k, x: x - 3, y: y - 3, w: 19, h: 19 });
            g.save();
            g.setLineDash([]);
            g.lineWidth = 1.5;
            g.strokeStyle = over || on ? "#5b6470" : "#b4bdc8";
            g.beginPath();
            (on
              ? [
                  [3, 5, 5, 5, 5, 3],
                  [8, 3, 8, 5, 10, 5],
                  [10, 8, 8, 8, 8, 10],
                  [5, 10, 5, 8, 3, 8],
                ]
              : [
                  [3, 6, 3, 3, 6, 3],
                  [7, 3, 10, 3, 10, 6],
                  [10, 7, 10, 10, 7, 10],
                  [6, 10, 3, 10, 3, 7],
                ]
            ).forEach(([a, b, c, d, e2, f2]) => {
              g.moveTo(x + a, y + b);
              g.lineTo(x + c, y + d);
              g.lineTo(x + e2, y + f2);
            });
            g.stroke();
            g.restore();
          };
          /*
           * the P&F columns in the DPoc panel, on the chart's
           * price scale. Box colour by its delta (taker buys -
           * sells). Each column is a line (green buyers, black
           * sellers); a box whose |delta| tops the 95th
           * percentile of the BIG_WIN boxes before it is drawn
           * as a real brick, green buys, black sells. A column
           * whose volume tops that of the BIG_WIN columns
           * before it gets a dot: green below a buyer column,
           * black above a seller one. Rolling, as on the
           * candles (see pfHot).
           */
          const drawPfCols = (all, shown, jOf, pa, sl, st) => {
            /* Vc: the volume profile's colour for a brick
               traded at time t on row r: same day, same
               period (the last closed one while it forms),
               same price, as the profile shows it */
            const vcAt = (t, r) => {
              const dS = dayOf(t);
              let i = Math.floor((t - dS) / TPO_MS);
              if (dS + (i + 1) * TPO_MS > Date.now()) i--;
              if (i < 0) return "";
              const m = stFor(dS, i);
              const row = Math.floor(((r + 0.5) * st) / m.step);
              return m.get(row) || "";
            };
            const hs = pfHot(all, st),
              ci = new Map(all.map((c, k) => [c, k])),
              shade = (c, r) => [
                (c.d.get(r) || 0) < 0 ? "#000" : "#089981",
                hs.hot.has(ci.get(c) + "|" + r),
              ];
            /* Br: bw = brick width, bricks touch (+.5 hides
               seams); hotB = highlighted boxes,
               drawn last with a brick each side */
            const bw = Math.max(3, sl) + 0.5,
              hotB = [],
              /* each shown column's x, for the swing marks */
              xs = new Map();
            shown.forEach((c, i) => {
              /* bricks wide (at least 7px), line hairline-thin */
              const xm = pa + sl * jOf(i),
                w = Math.max(7, sl * 0.9),
                x = xm - w / 2;
              pfX.push([c.t0, xm]);
              xs.set(c, xm);
              /* Br: every box a brick, coloured by the time the
                 column first traded it, as the profiles; the
                 end bricks cut at the real high / low */
              if (pfBr)
                for (let r = c.lo; r <= c.hi; r++) {
                  /* a brick the column jumped over: its start time */
                  const t = c.tm.has(r) ? c.tm.get(r) : c.t0;
                  const yT = Y(Math.min((r + 1) * st, c.ph)),
                    yB = Y(Math.max(r * st, c.pl)),
                    [col, solid] = shade(c, r);
                  /* Sg: green above the latest green signal,
                     black below the latest black one, a thin
                     neutral blue line in between */
                  const k = ci.get(c),
                    gT = hs.gTop[k],
                    bB = hs.bBot[k],
                    vc = pfVc ? vcAt(t, r) : null,
                    vcOn =
                      vc != null &&
                      (vc.startsWith("rgba(8,153,129") ||
                        vc.startsWith("rgba(229,57,53")),
                    sg = pfSg && vc == null,
                    up = sg && gT != null && r * st >= gT,
                    dn = sg && bB != null && (r + 1) * st <= bB,
                    thin =
                      (sg && !up && !dn) || (vc != null && !vcOn),
                    w = thin ? 1.5 : bw;
                  /* Vc: the profile's green / red at this price */
                  g.fillStyle = vcOn
                    ? vc
                    : up
                    ? "#089981"
                    : dn
                      ? "#000"
                      : thin
                        ? "#7f9fc8"
                        : tpoColor(
                            Math.floor((t % 86400000) / TPO_MS),
                          );
                  g.fillRect(
                    xm - w / 2,
                    yT,
                    w,
                    Math.max(1, yB - yT) + 0.5,
                  );
                  if (solid && pfHl) hotB.push([xm, r, col]);
                }
              /* the column as one line, buyers green / sellers
                 black, then a real brick on the strongest boxes */
              if (!pfBr) {
                g.strokeStyle = c.up ? "#089981" : "#000";
                g.lineWidth = 1;
                g.beginPath();
                g.moveTo(xm, Y(c.ph));
                g.lineTo(xm, Y(c.pl));
                g.stroke();
                g.lineWidth = 1;
                for (let r = c.lo; r <= c.hi; r++) {
                  const [col, solid] = shade(c, r);
                  if (!solid || !pfHl) continue;
                  /* at least 6px tall, centred on its box */
                  const yT = Y((r + 1) * st),
                    yB = Y(r * st),
                    h = Math.max(6, yB - yT - 1);
                  g.fillStyle = col;
                  g.fillRect(x, (yT + yB) / 2 - h / 2, w, h);
                }
              }
              pcGeo.push({
                xa: xm - sl / 2,
                xb: xm + sl / 2,
                c: {
                  o: c.pl,
                  h: c.ph,
                  l: c.pl,
                  c: c.ph,
                },
              });
              if (!pfHl || !hs.dot.has(ci.get(c))) return;
              /* radius 5, as the big-candle circles, clear of
                 the column, vivid green as the highlights,
                 outlined in black */
              const rd = 5,
                y = c.up
                  ? Y(c.pl) + rd + 8
                  : Y(c.ph) - rd - 8;
              g.beginPath();
              g.arc(xm, y, rd, 0, 7);
              g.fillStyle = c.up ? "#00e676" : "#000";
              g.fill();
              g.strokeStyle = "#000";
              g.lineWidth = 1;
              g.stroke();
            });
            /* highlighted box, green buys / black sells, with
               one more brick each side so it stands out */
            hotB.forEach(([xm, r, col]) => {
              const yT = Y((r + 1) * st),
                yB = Y(r * st),
                h = Math.max(6, yB - yT - 1);
              /* a vivid green, to stand out from the bricks */
              g.fillStyle = col === "#000" ? col : "#00e676";
              [-1, 0, 1].forEach((k) =>
                g.fillRect(
                  xm + k * sl - bw / 2,
                  (yT + yB) / 2 - h / 2,
                  bw,
                  h,
                ),
              );
              /* black border round the three */
              g.strokeStyle = "#000";
              g.lineWidth = 1;
              g.strokeRect(
                xm - sl - bw / 2 - 0.5,
                (yT + yB) / 2 - h / 2 - 0.5,
                2 * sl + bw + 1,
                h + 1,
              );
            });
            /*
             * P&F swings (Colour on): the bricks in the order
             * they traded, green / black by Sg (blue ignored).
             * A black run that goes a brick under the lowest
             * one of the black run before the last green run
             * is a swing down, the mirror a swing up; a small
             * triangle on the brick that breaks, once per run
             */
            if (pfSg) {
              const br = [];
              all.forEach((c, k) => {
                const gT = hs.gTop[k],
                  bB = hs.bBot[k];
                for (let r = c.lo; r <= c.hi; r++) {
                  const z =
                    gT != null && r * st >= gT
                      ? 1
                      : bB != null && (r + 1) * st <= bB
                        ? -1
                        : 0;
                  const t = c.tm.has(r) ? c.tm.get(r) : c.t0;
                  if (z) br.push([t, c, r, z]);
                }
              });
              br.sort((a, b) => a[0] - b[0]);
              const last = new Map();
              let run = 0,
                ext = 0,
                done = false;
              br.forEach(([, c, r, z]) => {
                if (z !== run) {
                  if (run) last.set(run, ext);
                  [run, ext, done] = [z, r, false];
                } else
                  ext = z > 0 ? Math.max(ext, r) : Math.min(ext, r);
                const L = last.get(z);
                if (done || L == null || (z > 0 ? r <= L : r >= L))
                  return;
                done = true;
                if (!xs.has(c)) return;
                const x = xs.get(c),
                  y = z > 0 ? Y(r * st) + 3 : Y((r + 1) * st) - 3,
                  e = z > 0 ? 8 : -8;
                g.beginPath();
                g.moveTo(x, y);
                g.lineTo(x - 5, y + e);
                g.lineTo(x + 5, y + e);
                g.closePath();
                g.fillStyle = z > 0 ? "#089981" : "#000";
                g.fill();
                g.strokeStyle = "#fff";
                g.lineWidth = 1;
                g.stroke();
              });
            }
          };
          /* pcGeo: DPoc candles and their x, for the magnet */
          const pcGeo = [],
            /* pfX: shown P&F columns [start time, x] */
            pfX = [];
          let pcShow = 0,
            pcSl = 0,
            spShow = 0;
          if (pcW) {
            const pa = pL,
              pv = (dS) => {
                const P = dayProf(dS);
                if (P.poc == null || !P.full) return null;
                return (P.poc + 0.5) * P.step;
              },
              days = [];
            for (
              let d = dayOf(k15.length ? k15[0].t : dayStart);
              d <= dayStart;
              d = nextDay(d)
            )
              days.push(d);
            /* POC candles: day POCs, or sub POCs (sub) */
            /* te: end of the latest brick in a POC's row (the
               time a drawing on its candle refers to) */
            const pocEnd = (dS, p) => {
              const P = dayProf(dS),
                l = P.rows.get(Math.floor(p / P.step));
              return l && l.length
                ? dS + (Math.max(...l) + 1) * TPO_MS - 1
                : nextDay(dS) - 1;
            };
            const pocCds = (sub) => {
              const seq = [];
              if (sub)
                days.forEach((dS) => {
                  const P = dayProf(dS);
                  if (P.poc == null || !P.full) return;
                  const vf = volAmt > 0 ? volAmt : P.step * 10;
                  subPocs(dS, P.ps, vf, P.step)
                    .map((S) => {
                      const r = P.rows.get(Math.floor(S.px / P.step));
                      return {
                        dS,
                        p: S.px,
                        f: r ? Math.min(...r) : 99,
                      };
                    })
                    .sort((a, b) => a.f - b.f)
                    .forEach((o) => seq.push(o));
                });
              const info = (
                  sub
                    ? seq.map((o, k) => ({
                        ...o,
                        k,
                        up: k ? o.p >= seq[k - 1].p : null,
                      }))
                    : days.map((dS) => {
                        const p = pv(dS),
                          q = pv(prevDay(dS)),
                          up = p == null || q == null ? null : p >= q;
                        return { dS, p, up };
                      })
                ).filter((o) => o.up != null),
                cds = [];
              [true, false].forEach((up) => {
                const s = info.filter((o) => o.up === up);
                for (let i = 1; i < s.length; i++) {
                  const a = s[i - 1],
                    b = s[i];
                  if (up ? b.p <= a.p : b.p >= a.p) continue;
                  /* th / tl: when the high / low traded (a POC:
                     its day's end) */
                  const eod = (o) => nextDay(o.dS) - 1;
                  let h = Math.max(a.p, b.p),
                    l = Math.min(a.p, b.p),
                    th = a.p >= b.p ? eod(a) : eod(b),
                    tl = a.p <= b.p ? eod(a) : eod(b);
                  if (sub) {
                    /* sub POCs: high / low from the opening POC's
                       first brick to the closing POC's, 15m */
                    const ta = a.dS + a.f * TPO_MS,
                      tb = b.dS + (b.f + 1) * TPO_MS;
                    let j = 0,
                      m = k15.length;
                    while (j < m) {
                      const md = (j + m) >> 1;
                      if (k15[md].t < ta) j = md + 1;
                      else m = md;
                    }
                    for (; j < k15.length && k15[j].t < tb; j++) {
                      const c = k15[j];
                      if (!okC(c)) continue;
                      if (c.h > h) [h, th] = [c.h, c.t];
                      if (c.l < l) [l, tl] = [c.l, c.t];
                    }
                  } else
                    for (let d = a.dS; d <= b.dS; d = nextDay(d)) {
                      const r = dayR.get(d);
                      if (r) {
                        if (r.h > h) [h, th] = [r.h, d];
                        if (r.l < l) [l, tl] = [r.l, d];
                      }
                    }
                  cds.push({
                    t: b.dS,
                    k: b.k,
                    o: a.p,
                    c: b.p,
                    h,
                    l,
                    up,
                    te: pocEnd(b.dS, b.p),
                    /* times of open / close (their days' end),
                       high, low: what a drawing on them uses */
                    oe: eod(a),
                    ce: eod(b),
                    th,
                    tl,
                  });
                }
              });
              cds.sort((m, n) => m.t - n.t || m.k - n.k || 0);
              /* SPoc: today's candle so far (hollow) from the
                 sub POC before today's latest one to it, when
                 the rule above has not closed one today */
              const b = seq[seq.length - 1],
                a = seq[seq.length - 2],
                last = cds[cds.length - 1];
              if (
                sub &&
                a &&
                b.dS === dayOf(Date.now()) &&
                !(
                  last &&
                  last.t === b.dS &&
                  last.k === seq.length - 1
                )
              ) {
                const eod = (o) => nextDay(o.dS) - 1;
                let h = Math.max(a.p, b.p),
                  l = Math.min(a.p, b.p),
                  th = a.p >= b.p ? eod(a) : eod(b),
                  tl = a.p <= b.p ? eod(a) : eod(b);
                const ta = a.dS + a.f * TPO_MS;
                k15.forEach((c) => {
                  if (c.t < ta || !okC(c)) return;
                  if (c.h > h) [h, th] = [c.h, c.t];
                  if (c.l < l) [l, tl] = [c.l, c.t];
                });
                cds.push({
                  t: b.dS,
                  k: seq.length - 1,
                  o: a.p,
                  c: b.p,
                  h,
                  l,
                  up: b.p >= a.p,
                  live: true,
                  te: pocEnd(b.dS, b.p),
                  oe: eod(a),
                  ce: eod(b),
                  th,
                  tl,
                });
              }
              return cds;
            };
            /* pf: the panel shows the P&F (not when the POC
               candles window is full screen) */
            const pf = pcPf && full !== "sp";
            const cds = pf ? [] : pocCds(pcSub);
            /* P&F: columns from yesterday's and today's trades,
               box = the brick */
            const pst = pfStep(),
              d1 = dayOf(Date.now());
            if (pf) {
              loadAggr(d1 - DAY);
              loadAggr(d1);
            }
            const pfc = pf ? pfCols([d1 - DAY, d1], pst) : [];
            /* one candle per profile-column width, as many as
               fit; fetch older 15m days until they are there */
            const nFit = pf
                ? pfN
                : pcN || Math.max(3, Math.floor(pcW / (colW + gap))),
              sl = pcW / nFit;
            pcShow = nFit;
            pcSl = sl;
            const need = nFit + pcBack;
            if (!pf && cds.length < need && !olderEnd["15m"])
              older("15m");
            g.save();
            g.beginPath();
            g.rect(pa, top, pcW, bot - top);
            g.clip();
            /* same price scale as the chart */
            /* pb = what is loaded so far; pcBack waits for more;
               negative = empty slots on the right. P&F keeps
               15% of them (home), so new columns push it left */
            const items = pf ? pfc : cds,
              room = items.length - nFit,
              home = pf ? -Math.round(nFit * 0.15) : 0,
              pb = Math.max(1 - nFit, Math.min(pcBack + home, room));
            if (olderEnd["15m"]) pcBack = pb - home;
            /* ib whole candles back; the newest sits in slot
               nFit - 1 + pb */
            const ib = Math.floor(pb),
              k0 = Math.max(0, items.length - nFit - ib - 1),
              k1 = Math.min(items.length, items.length - ib),
              cv2 = items.slice(k0, k1),
              YP = Y,
              jOf = (i) => nFit - items.length + k0 + i + pb + 0.5;
            /* POC candles: slot j of width sl from pa */
            /* simplified zigzag over POC candles: swings of
               their closes, legs past the swing before them
               green / red, else golden */
            const cdZig = (list, pa, sl, jOf) =>
              nests(
                list.map((c, i) => ({
                  x: pa + sl * jOf(i),
                  y: YP(c.c),
                  p: c.c,
                })),
                4,
              ).forEach((zs, k) => {
              /* nested levels (see nests) thinner */
              g.lineWidth = 2 * 0.7 ** k;
              g.lineCap = "round";
              zs.forEach(({ q }, i) => {
                if (!i) return;
                const a = zs[i - 1].q,
                  pr = i > 1 && zs[i - 2].q;
                g.strokeStyle =
                  pr && q.p > a.p && q.p > pr.p
                    ? "#089981"
                    : pr && q.p < a.p && q.p < pr.p
                      ? "#e53935"
                      : "rgba(230,159,0,.9)";
                g.beginPath();
                g.moveTo(a.x, a.y);
                g.lineTo(q.x, q.y);
                g.stroke();
              });
              g.lineWidth = 1;
            });
            const drawCds = (list, pa, sl, jOf) =>
            list.forEach((c, i) => {
              const j = jOf(i),
                xm = pa + sl * j,
                col = c.up ? "#089981" : "#000000";
              pcGeo.push({ xa: xm - sl / 2, xb: xm + sl / 2, c });
              g.strokeStyle = g.fillStyle = col;
              /* wick a bit fatter than the chart's */
              g.lineWidth = 1.75;
              g.beginPath();
              g.moveTo(xm, YP(c.h));
              g.lineTo(xm, YP(c.l));
              g.stroke();
              g.lineWidth = 1;
              const yo = YP(c.o),
                yc = YP(c.c);
              /* closing on today's POC (not final yet, or the
                 hollow one so far): yellow body, edged in its
                 colour */
              const bx = [
                xm - sl * 0.35,
                Math.min(yo, yc),
                sl * 0.7,
                Math.max(1, Math.abs(yo - yc)),
              ];
              if (c.live || c.t === dayOf(Date.now())) {
                g.fillStyle = "#f2c200";
                g.fillRect(...bx);
                g.strokeRect(...bx);
              } else g.fillRect(...bx);
            });
            if (pf) drawPfCols(pfc, cv2, jOf, pa, sl, pst);
            else {
              drawCds(cv2, pa, sl, jOf);
              cdZig(cv2, pa, sl, jOf);
            }
            g.restore();
            /* the SPoc window (4 windows): the latest sub POC
               candles that fit, 12px each, newest on the right */
            if (spW) {
              const sc = pocCds(pcSub),
                n = spN || Math.max(3, Math.floor(spW / 12)),
                ssl = spW / n,
                /* spBack: candles dragged back; negative = empty
                   slots on the right */
                sb = Math.max(
                  1 - n,
                  Math.min(sc.length - 1, Math.round(spBack)),
                ),
                sbp = Math.max(0, sb),
                sh = sc.slice(
                  Math.max(0, sc.length - sbp - n - Math.min(0, sb)),
                  sc.length - sbp,
                ),
                sa = sL + 5;
              g.save();
              g.beginPath();
              g.rect(sa, top, spW, bot - top);
              g.clip();
              const sj = (i) =>
                n - sh.length + i + 0.5 + Math.min(0, sb);
              drawCds(sh, sa, ssl, sj);
              cdZig(sh, sa, ssl, sj);
              g.restore();
              panel(sL, spOff);
              g.fillStyle = "#6b7684";
              g.textAlign = "center";
              g.fillText(
                pcSub ? "SPoc" : "DPoc",
                sL + spOff / 2,
                bot + 10,
              );
              spShow = n;
              if (!sh.length)
                g.fillText(
                  "no pair yet",
                  sL + spOff / 2,
                  (top + bot) / 2,
                );
            }
            /* framed, named, and says so when it is empty */
            panel(pa, pcW);
            g.fillStyle = "#6b7684";
            g.textAlign = "center";
            const pm = pa + pcW / 2;
            g.fillText(
              pf
                ? "P&F, box " + pst
                : pcSub
                  ? "sub POC candles"
                  : "POC candles",
              pm,
              bot + 10,
            );
            if (!items.length)
              g.fillText(
                pf ? "loading trades" : "no pair yet",
                pm,
                (top + bot) / 2,
              );

          }

          /* candles */

          (exG ? [exG].concat(geo) : geo).forEach(({ x, w, c }) => {
            const col = c.c >= c.o ? "#089981" : "#000000",
              xm = x + w / 2;
            g.save();
            g.beginPath();
            g.rect(x0, top, px0 - x0, bot - top);
            g.clip();
            g.strokeStyle = col;
            g.fillStyle = col;
            g.beginPath();
            g.moveTo(xm, Y(c.h));
            g.lineTo(xm, Y(c.l));
            g.stroke();
            const yo = Y(c.o),
              yc = Y(c.c);
            g.fillRect(
              x + 1,
              Math.min(yo, yc),
              Math.max(1, w - 2),
              Math.max(1, Math.abs(yo - yc)),
            );
            g.restore();
          });
          /*
           * circles: green below bullish bars, black above
           * bearish bars; the 15s window gets its own
           */
          {
            const fl = bigFlags(
              arr,
              Math.max(0, arr.length - off - N),
              Math.min(arr.length, arr.length - off),
            );
            geo.forEach((o) => {
              const f = fl.get(o.c);
              if (!f || side) return;
              const c = o.c;
              if (c.c === c.o) return;
              const bull = c.c > c.o,
                y = bull ? Y(c.l) + 12 : Y(c.h) - 12;
              if (y < top || y > bot) return;
              g.fillStyle = bull ? "#4caf50" : "#000000";
              g.beginPath();
              g.arc(o.x + o.w / 2, y, 5, 0, 6.2832);
              g.fill();
            });
          }
          /*
           * vertical grid: a line every 6 hours counted from
           * UTC midnight, where the day and its levels change
           * (01, 07, 13, 19 on a London summer clock), drawn
           * behind everything
           */
          const SIX = 21600000,
            p2 = (v) => String(v).padStart(2, "0"),
            slot = (t) => Math.floor(t / SIX),
            marks = cfg.main
              ? geo.filter(
                  (o, i) => i && slot(o.c.t) !== slot(geo[i - 1].c.t),
                )
              : [];
          g.save();
          g.globalCompositeOperation = "destination-over";
          g.lineWidth = 1.5;
          marks.forEach((o) => {
            const xm = Math.round(o.x + o.w / 2) + 0.5,
              mid0 = new Date(o.c.t).getUTCHours() < 6;
            if (!mid0 && !showGrid) return;
            /* midnight solid navy like the 0 line, the
               others dashed black like the vol steps */
            g.strokeStyle = mid0
              ? "rgba(0,51,102,.35)"
              : "rgba(0,0,0,.5)";
            g.setLineDash(mid0 ? [] : [3, 3]);
            g.lineWidth = mid0 ? 0.4 : 0.3;
            g.beginPath();
            g.moveTo(xm, top);
            g.lineTo(xm, bot);
            g.stroke();
          });
          g.restore();
          /* time labels: on the 6-hour lines when there are
             at least two of them, else every few candles */

          g.fillStyle = "#6b7684";
          g.textAlign = "center";
          const every = Math.ceil(vis.length / 8);
          /* none in the full-screen strip, none spilling left
             of the chart */
          let lastX = side ? 1e9 : x0 - 26;
          if (marks.length >= 2)
            marks.forEach((o) => {
              /* the line's time on the local clock; the date
                 (UTC) on the line that starts a day */
              const xm = o.x + o.w / 2,
                d = new Date(slot(o.c.t) * SIX);
              if (xm - lastX < 46) return;
              lastX = xm;
              g.fillText(
                d.getUTCHours()
                  ? p2(d.getHours()) + ":" + p2(d.getMinutes())
                  : d.toLocaleDateString([], {
                      day: "2-digit",
                      month: "short",
                      timeZone: "UTC",
                    }),
                xm,
                bot + 10,
              );
            });
          else
            geo.forEach((o, i) => {
              /* uneven volume widths: keep labels apart */
              const xm = o.x + o.w / 2;
              if (i % every === 0 && xm - lastX >= 46) {
                const d = new Date(o.c.t);
                lastX = xm;
                g.fillText(
                  p2(d.getHours()) +
                    ":" +
                    p2(d.getMinutes()) +
                    (sec() ? ":" + p2(d.getSeconds()) : ""),
                  o.x + o.w / 2,
                  bot + 10,
                );
              }
            });
          /* user lines (Alt+H / Alt+V) */

          view = {
            hi,
            lo,
            top,
            bot,
            ch,
            px0,
            x0,
            tR,
            pS,
            spOff,
            pcW,
            tpoW,
            /* the window under px: "pc", "sp", "tpo" or the
               chart */
            win: (px) =>
              pcW && px >= pS && px < x0 - 5
                ? "pc"
                : spW && px >= tR && px < pS
                  ? "sp"
                  : tpoW && px < tR
                    ? "tpo"
                    : null,
            pcGeo,
            pfX,
            icons,
            pcN: pcShow,
            pcSl,
            tpoSl: colW + gap,
            colW,
            zp,
            spSl: spShow ? spW / spShow : 1,
            sL,
            spW,
            spN: spShow,
            Y,
            pc: cw / slots,
          };
          /*
           * l.lo = first point, l.hi = second point: the
           * dashed line sits 34% from the first point
           */
          const drawBox = (l, sel) => {
            const mx = Math.max(l.lo, l.hi),
              mn = Math.min(l.lo, l.hi),
              yT = Y(mx),
              yB = Y(mn),
              xs = xsOf(l),
              p66 = l.hi + 0.66 * (l.lo - l.hi),
              y66 = Y(p66),
              /* drawn upwards candle green, downwards black */
              rgb = l.hi >= l.lo ? "8,153,129" : "0,0,0";
            g.save();
            g.beginPath();
            g.rect(xs, top, px0 - xs, bot - top);
            g.clip();
            /* light grey box; only the part from the first
               point to the dashed line in green / black */
            g.fillStyle = "rgba(0,0,0,.05)";
            g.fillRect(xs, yT, px0 - xs, yB - yT);
            const y0 = Y(l.lo);
            g.fillStyle = "rgba(" + rgb + ",.2)";
            g.fillRect(
              xs,
              Math.min(y0, y66),
              px0 - xs,
              Math.abs(y0 - y66),
            );
            g.strokeStyle = "rgba(0,0,0,.25)";
            g.lineWidth = sel ? 2 : 1;
            g.setLineDash([]);
            g.strokeRect(xs, yT, px0 - xs, yB - yT);
            g.strokeStyle = "rgba(" + rgb + ",.5)";
            g.setLineDash([5, 4]);
            g.beginPath();
            g.moveTo(xs, y66);
            g.lineTo(px0, y66);
            g.stroke();
            g.setLineDash([]);
            g.restore();
            [
              [mx, yT],
              [p66, y66],
              [mn, yB],
            ].forEach(([pv, yy]) => {
              if (yy >= top && yy <= bot)
                ptag(yy, pv.toFixed(DP), "rgb(" + rgb + ")");
            });
          };
          /*
           * Automatic channels on the latest big-volume candles
           * (1 to 3 of them, chosen in the header).
           * It is as tall as that candle (high to low) and it
           * trails the market: after a down candle its bottom
           * follows every new low, after an up candle its top
           * follows every new high. It is drawn as a channel,
           * candle by candle, so the moving edges are visible
           * from the start.
           * When a candle closes out of it on the far side
           * (above when following lows, below when following
           * highs), that channel stops there and a new one of
           * the same height starts in the opposite direction,
           * and so on. Following highs = green, lows = black.
           */
          if (cfg.main && (autoBox || followBox)) {
            /* the latest nBox big candles, newest first */
            const bigs = [],
              where = new Map(geo.map((o) => [o.c, o]));
            for (
              let k = arr.length - 1;
              k >= BIG_WIN - 1 && bigs.length < nBox;
              k--
            ) {
              const c = arr[k];
              if (okC(c) && c.c !== c.o && isBig(arr, k))
                bigs.push(k);
            }
            bigs.forEach((k, bi) => {
              /* an older candle's channels stop at the next
                 big candle, which starts its own */
              const kEnd = bi ? bigs[bi - 1] : arr.length - 1,
                A = arr[k],
                ht = A.h - A.l,
                runs = [];
              let dn = A.c < A.o,
                ext = dn ? A.l : A.h,
                pts = [{ c: A, ext }];
              /* B: a static Alt+B style box on the candle, 66%
                 line placed as in its channel */
              if (autoBox)
                drawBox({ t: A.t, lo: dn ? A.h : A.l, hi: ext });
              for (let j = k + 1; j <= kEnd; j++) {
                const q = arr[j];
                if (!okC(q)) continue;
                ext = dn ? Math.min(ext, q.l) : Math.max(ext, q.h);
                pts.push({ c: q, ext });
                const out = dn ? q.c > ext + ht : q.c < ext - ht;
                if (!out) continue;
                runs.push({ dn, pts, live: false });
                dn = !dn;
                ext = dn ? q.l : q.h;
                pts = [{ c: q, ext }];
              }
              runs.push({ dn, pts, live: !bi });
              /* FB: the following channels */
              (followBox ? runs : []).forEach((r) => {
                /* far = the side away from the trailed edge;
                   the 66% line sits 34% in from it */
                const far = (e) => (r.dn ? e + ht : e - ht),
                  p66 = (e) => e + 0.66 * (far(e) - e),
                  /* FB: yellow down, blue up (B: black / green) */
                  rgb = r.dn ? "230,159,0" : "41,98,255",
                  n = r.pts.length,
                  sg = [];
                r.pts.forEach((p, i) => {
                  const o = where.get(p.c);
                  if (!o) return;
                  const xm = o.x + o.w / 2,
                    end = i === n - 1;
                  sg.push({
                    e: p.ext,
                    xa: i ? o.x : xm,
                    xb: end ? (r.live ? px0 : xm) : o.x + o.w,
                  });
                });
                if (!sg.length) return;
                const edge = (f, back) => {
                  (back ? [...sg].reverse() : sg).forEach((s) => {
                    const y = Y(f(s.e));
                    g.lineTo(back ? s.xb : s.xa, y);
                    g.lineTo(back ? s.xa : s.xb, y);
                  });
                };
                g.save();
                g.beginPath();
                g.rect(x0, top, px0 - x0, bot - top);
                g.clip();
                /* fill only the far 34%, up to the 66% line */
                g.beginPath();
                g.moveTo(sg[0].xa, Y(p66(sg[0].e)));
                edge(p66, false);
                edge(far, true);
                g.closePath();
                g.fillStyle = "rgba(" + rgb + ",.07)";
                g.fill();
                /* solid far edge only: the trailed edge is
                   not drawn */
                g.beginPath();
                g.moveTo(sg[0].xa, Y(far(sg[0].e)));
                edge(far, false);
                g.strokeStyle = "rgba(" + rgb + ",.5)";
                g.lineWidth = 1;
                g.setLineDash([]);
                g.stroke();
                g.setLineDash([5, 4]);
                g.beginPath();
                g.moveTo(sg[0].xa, Y(p66(sg[0].e)));
                edge(p66, false);
                g.stroke();
                g.setLineDash([]);
                g.restore();
                /* current prices of the live channel, when
                   its latest candle is on screen */
                if (!r.live || !where.has(r.pts[n - 1].c)) return;
                const e = r.pts[n - 1].ext;
                [p66(e), far(e)].forEach((pv) => {
                  const yy = Y(pv);
                  if (yy >= top && yy <= bot)
                    ptag(yy, pv.toFixed(DP), "rgb(" + rgb + ")");
                });
              });
            });
            g.lineWidth = 1;
          }
          /*
           * own orders (from orders.js): a segment at the
           * order price for as long as the order was alive,
           * as thick as its quantity; dot = filled,
           * cancelled just stops, open orders run to the edge
           */
          /* my orders (O) and the grid bot's (Gr) */
          const ords = (showOrders ? orders : []).concat(
            showGr ? gOrders : [],
          );
          /* grid bot levels (Gr), from each change to the
             next, between xL and xR: grid1 anchor + k x step
             (purple), grid2 / grid3 their levels (teal /
             orange) */
          const gridLv = (xOf, xL, xR) => {
            if (!showGr) return;
            g.save();
            g.beginPath();
            g.rect(xL, top, xR - xL, bot - top);
            g.clip();
            g.setLineDash([2, 3]);
            g.lineWidth = 1;
            gLv.forEach((L, f) => {
              g.beginPath();
              L.forEach(([t, a, s], i) => {
                const xs = xOf(t),
                  xe = i + 1 < L.length ? xOf(L[i + 1][0]) : xR,
                  ps = Array.isArray(a) ? a : [];
                if (xe <= xs) return;
                if (!ps.length)
                  for (
                    let p = a + Math.ceil((lo - a) / s) * s;
                    p <= hi;
                    p += s
                  )
                    ps.push(p);
                ps.forEach((p) => {
                  if (p < lo || p > hi) return;
                  g.moveTo(xs, Y(p));
                  g.lineTo(xe, Y(p));
                });
              });
              g.strokeStyle = [
                "rgba(142,68,173,.45)",
                "rgba(0,128,128,.55)",
                "rgba(230,120,0,.6)",
              ][f];
              g.stroke();
            });
            g.setLineDash([]);
            g.restore();
          };
          gridLv(
            (t) => {
              const q = geoAt(t);
              return q ? q.x + q.w / 2 : x0;
            },
            x0,
            px0,
          );
          if (pcPf && pfX.length)
            gridLv(
              (tt) => {
                let x = pL;
                for (const [t0, xm] of pfX) if (t0 <= tt) x = xm;
                return x;
              },
              pL,
              pL + pcW,
            );
          if (ords.length) {
            const n = arr.length;
            const tEnd = off > 0 && n - off < n
              ? arr[n - off].t
              : Infinity;
            const tFirst = geo[0].c.t;
            const mq = Math.max(...ords.map((o) => o.qty));
            g.save();
            g.beginPath();
            g.rect(x0, top, px0 - x0, bot - top);
            g.clip();
            ords.forEach((o) => {
              const y = Y(o.price);
              const gone = o.t1 != null && o.t1 < tFirst;
              if (y < top || y > bot || o.t0 >= tEnd || gone)
                return;
              const a = geoAt(o.t0);
              const ended = o.t1 != null && o.t1 < tEnd;
              const b = ended ? geoAt(o.t1) : null;
              let xs = a ? a.x + a.w / 2 : x0;
              let xe = b ? b.x + b.w / 2 : px0;
              if (xe - xs < 6) {
                xs -= 3;
                xe = xs + 6;
              }
              const col = o.buy ? "#56b4e9" : "#e69f00";
              g.strokeStyle = g.fillStyle = col;
              g.lineWidth = Math.max(1.5, (10 * o.qty) / mq);
              g.globalAlpha = ended ? 0.55 : 0.9;
              g.setLineDash([]);
              g.beginPath();
              g.moveTo(xs, y);
              g.lineTo(xe, y);
              if (showLines) g.stroke();
              g.globalAlpha = 1;
              g.lineWidth = 1.5;
              g.beginPath();
              if (ended && o.filled) {
                /* dot in the order's colour, bigger for
                   bigger sizes (area follows quantity) */
                const rDot = 2 + 4 * Math.sqrt(o.qty / mq);
                g.fillStyle = col;
                g.arc(xe, y, rDot, 0, 6.2832);
                g.fill();
              }
            });
            g.restore();
            g.lineWidth = 1;
          }
          /*
           * the same orders in the P&F: a time maps to the last
           * column started by then; older than the first shown
           * column = its left edge, still open = the right edge
           */
          if (ords.length && pcPf && pfX.length) {
            const mq = Math.max(...ords.map((o) => o.qty)),
              xR = pL + pcW,
              xAt = (tt) => {
                let x = pL;
                for (const [t0, xm] of pfX) if (t0 <= tt) x = xm;
                return x;
              };
            g.save();
            g.beginPath();
            g.rect(pL, top, pcW, bot - top);
            g.clip();
            ords.forEach((o) => {
              const y = Y(o.price),
                ended = o.t1 != null;
              if (y < top || y > bot) return;
              if (ended && o.t1 < pfX[0][0]) return;
              let xs = xAt(o.t0),
                xe = ended ? xAt(o.t1) : xR;
              if (xe - xs < 6) {
                xs -= 3;
                xe = xs + 6;
              }
              const col = o.buy ? "#56b4e9" : "#e69f00";
              g.strokeStyle = g.fillStyle = col;
              g.lineWidth = Math.max(1.5, (10 * o.qty) / mq);
              g.globalAlpha = ended ? 0.55 : 0.9;
              g.beginPath();
              g.moveTo(xs, y);
              g.lineTo(xe, y);
              if (showLines) g.stroke();
              g.globalAlpha = 1;
              if (ended && o.filled) {
                g.beginPath();
                g.arc(xe, y, 2 + 4 * Math.sqrt(o.qty / mq), 0, 7);
                g.fill();
              }
            });
            g.restore();
            g.lineWidth = 1;
          }
          lines.forEach((l) => {
            const sel = l === hl || l === drag;
            g.strokeStyle = g.fillStyle = "#8e44ad";
            g.lineWidth = sel ? 2 : 1;
            g.setLineDash([]);
            g.beginPath();
            if (l.k === "h") {
              /* green above the last price, black below */
              const lp = mid != null ? mid : arr[arr.length - 1].c,

              g.strokeStyle = col;

            } else if (l.k === "v") {
              /* a time has no side: black */
              g.strokeStyle = "#000000";
              g.lineWidth = sel ? 6 : 4;
              const o = geoAt(l.t);
              if (o) {
                const cx = o.x + o.w / 2;
                g.moveTo(cx, top);
                g.lineTo(cx, bot);

              const y = Y(l.p),

              if (y >= top && y <= bot) {

                const o = geoAt(l.t),

            } else if (l.k === "b") drawBox(l, sel);
            g.lineWidth = 1;
          });
          if (dotTool) {
            g.font = "11px ui-monospace,Menlo,monospace";

          /* full-width icons, on top of the drawings */
          /* DPoc / profiles full screen: blank the chart
             strip, the last price and scale stay */
          if (side) {
