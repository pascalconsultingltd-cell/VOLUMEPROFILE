            g.fillRect(x0 - 2, 0, px0 - x0 + 2, H);
          }
          if (cfg.main) {
            if (pcW) icon(full === "sp" ? "sp" : "pc", pL, pL + pcW);
            if (pcW && pcPf && full !== "sp") alIcons("pf", pL + pcW);
            if (spW) icon("sp", sL, pS);
            if (tpoW) icon("tpo", 1, tR - 1);
            if (tpoW) alIcons("vp", tR - 1);
            if (!side) {
              icon("main", x0 - 3, px0 - 2);
              alIcons("main", px0 - 2, 0, "HA");
              alIcons("fb", px0 - 2, 1, "FB");
            }
          } else alIcons("mini", px0 - 2);
          /* last price */

          const last = vis[vis.length - 1],
            lp = mid != null ? mid : last.c,
            ly = Math.max(top, Math.min(bot, Y(lp)));
          /* thin solid blue: no other line on the chart is blue */
          const LP = "#2962ff";
          g.strokeStyle = LP;
          g.setLineDash([]);
          g.lineWidth = 2;
          g.beginPath();
          g.moveTo(4, Math.round(ly) + 0.5);
          g.lineTo(px0, Math.round(ly) + 0.5);
          g.stroke();
          /*
           * tag sits left of the axis so it does not cover the
           * level tags of drawings; a second one at the line's
           * left end
           */
          {
            /* bigger and bold on the main chart */
            g.save();
            if (cfg.main)
              g.font = "bold 14px ui-monospace,Menlo,monospace";
            const lt = lp.toFixed(DP),
              lw = g.measureText(lt).width + 12,
              th = cfg.main ? 24 : 18;
            g.textAlign = "left";
            g.textBaseline = "middle";
            [px0 - lw, 4].forEach((tx) => {
              g.fillStyle = LP;

              g.fillStyle = "#ffffff";
              g.fillText(lt, tx + 6, ly);

          }

            .concat(tq.filter((a) => a[2] !== "#fff"))

          /* crosshair line / tag background / tag text */
          const XH = "rgba(184,134,11,.8)",

          if (
            mouse &&
            mouse.x >= 4 &&

            mouse.y <= bot

              o = !inTpo && hover >= 0 && geo[hover],

            const pq =

            else if (

              if (t != null) lbl = dlabel(t);
            } else if (inTpo) {
              const P = profs.find(
                (q) =>
                  q.show &&
                  mouse.x >= q.cx0 - 2 &&
                  mouse.x <= q.cx0 + colW,

              if (P && P.poc != null) {
                const ri = Math.floor(pv / P.step),
                  k = Math.floor((mouse.x - P.cx0) / P.lw),
                  lst = P.rows.get(ri),
                  idx = lst && lst[k],
                  /* the profile's day, always shown */
                  day = new Date(P.dS).toLocaleDateString([], {
                    weekday: "short",
                    day: "2-digit",
                    month: "short",
                    timeZone: "UTC",
                  });
                lbl = day;
                /* TPO periods are UTC half-hours: say so */
                if (idx != null) {
                  const f = (t) =>
                      new Date(t).toLocaleTimeString([], {
                        hour: "2-digit",
                        minute: "2-digit",
                        timeZone: "UTC",
                      }),
                    t0 = P.dS + idx * TPO_MS;
                  lbl =
                    day + " " + f(t0) + "–" + f(t0 + TPO_MS) +
                    " UTC";
                  g.strokeStyle = "#1a1f26";
                  g.lineWidth = 1.2;
                  g.strokeRect(
                    P.cx0 + k * P.lw,
                    Y((ri + 1) * P.step) + 0.5,
                    Math.max(1, P.lw - 1),
                    Math.max(1, P.rowH - 1),
                  );
                  g.lineWidth = 1;
                }
              }
            }
            if (lbl) ttag(cx, lbl, XB, XF);
            /* over the profiles: the day on top of the line too */
            if (lbl && mouse.x < tR) ttag(cx, lbl, XB, XF, true);
          }
          /*
           * the P&F gets the crosshair's time too: a line on the
           * last column started by then (end of the hovered 5m
           * candle, or the 15s brick hovered in the other chart)
           */
          {
            const o =
                mouse && mouse.x >= x0 && hover >= 0 && geo[hover],
              tx = o
                ? o.c.t + (TF === "5m" ? 300000 : 15000) - 1
                : xh && xh.from !== api && xh.t != null
                  ? xh.t
                  : null;
            let px = null,
              pt = null;
            if (tx != null && pfX.length && tx >= pfX[0][0])

              g.setLineDash([4, 4]);
              g.beginPath();
              g.moveTo(px, top);
              g.lineTo(px, bot);

              g.strokeStyle = XH;
              g.setLineDash([4, 4]);
              g.beginPath();
              g.moveTo(rx, top);
              g.lineTo(rx, bot);
              g.stroke();
              g.setLineDash([]);
              ttag(rx, dlabel(ro.c.t), XB, XF);
            }

          if (
            xh &&
            xh.from !== api &&
            !(
              mouse &&
              mouse.x >= 4 &&
              mouse.x <= px0 &&
              mouse.y >= top &&
              mouse.y <= bot

            const ry = Y(xh.p),
              ro = xh.t != null ? geoAt(xh.t) : null,
              okY = ry >= top && ry <= bot;
            g.strokeStyle = XH;
            g.lineWidth = 1;
            g.setLineDash([4, 4]);
            g.beginPath();
            if (okY) {
              g.moveTo(4, ry);
              g.lineTo(px0, ry);
            }
            if (ro) {
              const rx = ro.x + ro.w / 2;
              g.moveTo(rx, top);
              g.lineTo(rx, bot);
            }
            g.stroke();
            g.setLineDash([]);
            if (okY) ptag(ry, xh.p.toFixed(DP), XB, XF);
            if (ro) ttag(ro.x + ro.w / 2, dlabel(ro.c.t), XB, XF);
          }

           * lines are shared: redraw the other chart when they
           * change
           */
          {
            const sg = JSON.stringify(lines);
            if (sg !== linesSig) {
              linesSig = sg;
              schedule();
            }
          }
        }
        function showInfo() {
          if (!cfg.main) return;
          const o = geo && geo[hover];
          if (!o) {
            $("info").textContent = HELP;
            return;
          }
          const c = o.c,
            d = c.bv - (c.v - c.bv),
            t = new Date(c.t);
          const f = (v) => v.toFixed(DP);
          $("info").textContent = [
            t.toLocaleTimeString([], TS()),
            "O " + f(c.o),
            "H " + f(c.h),
            "L " + f(c.l),
            "C " + f(c.c),
            "Vol " + c.v.toFixed(0),
            "Δ " + d.toFixed(0),

        }
        function move(e) {
          if (!geo) return;
          const r = cv.getBoundingClientRect(),
            t = e;

            pts.set(e.pointerId, { x: e.clientX, y: e.clientY });

           * two fingers: spread zooms the time axis, moving
           * them pans; both act on the window they started in
           */
          if (pinch) {
            if (pts.size >= 2 && view) {
              const q = pinch,
                f = q.d / pdist(),
                m = pmid(),
                dx = m.x - q.x,
                dy = m.y - q.y,
                cl = (a, b, v) => Math.max(a, Math.min(b, v));
              q.x = m.x;
              q.y = m.y;
              q.ty += dy;
              if (q.w === "sp")
                spN = cl(3, 60, Math.round(q.n * f));
              else if (q.w === "pc") {
                if (pcPf && full !== "sp")
                  pfN = cl(5, 600, Math.round(q.n * f));
                else pcN = cl(3, 60, Math.round(q.n * f));
                pcBack = Math.max(
                  1 - view.pcN,
                  pcBack + dx / view.pcSl,
                );
              } else if (q.w === "tpo") {
                nTpo = cl(1, 30, Math.round(q.n * f));
                tpoBack = cl(1 - nTpo, 60, tpoBack + dx / view.tpoSl);
              } else {
                const mx = cl(20, 3000, arrLen || src().length);
                N = cl(20, mx, Math.round(q.n * f));
                const tot = off + subX + dx / view.pc;
                off = Math.floor(tot);
                subX = tot - off;
              }
              /* up / down: the price scale all windows share */
              if (Math.abs(q.ty) > 12) q.vy = true;
              if (q.vy) ypan += (dy / view.ch) * (view.hi - view.lo);
              if (cfg.main) ui();
              draw();
            }
            return;
          }
          if (divDrag && view) {
            /* each divider moves on its own: the profiles /
               DPoc edge trades width between them, so the
               chart edge (x0) stays put; the edge before the
               chart widens the panel next to it */
            const cl = (a, b, v) => Math.max(a, Math.min(b, v));
            /* SPoc | P&F edge: they trade width, x0 stays */
            if (divDrag === "sp") {
              const sw = cl(
                30,
                view.spW + view.pcW - 50,
                x - view.sL - 8,
              );
              pcPx = view.pcW - (sw - view.spW);
              spPx = sw;
            } else if (divDrag === "pc") {
              const tw = cl(80, view.x0 - 70 - view.spOff, x - 15);
              tpoFrac = tw / W;
              pcPx = view.x0 - 20 - tw - view.spOff;
            } else if (view.pcW)
              pcPx = cl(
                50,
                W * 0.75,
                x - 15 - view.tpoW - view.spOff,
              );
            else tpoFrac = cl(80, W * 0.75, x - 5) / W;
            draw();
            return;
          }
          if (sc) {
            ysc = Math.max(
              0.15,
              Math.min(
                6,
                sc.v * Math.exp((t.clientY - sc.y) / 200),
              ),
            );
            draw();
            return;
          }
          if (pan && view) {
            const dx = t.clientX - pan.x;
            /* dragging right shows older, as on the chart */
            /* fractional, so the windows slide smoothly */
            if (pan.w === "pc")
              pcBack = Math.max(
                1 - view.pcN,
                pan.b0 + dx / view.pcSl,
              );
            else if (pan.w === "sp")
              spBack = Math.max(
                1 - view.spN,
                pan.b0 + dx / view.spSl,
              );
            else if (pan.w === "tpo")
              tpoBack = Math.max(
                1 - nTpo,
                Math.min(60, pan.b0 + dx / view.tpoSl),
              );
            else {
              const tot = pan.off + dx / view.pc;
              off = Math.floor(tot);
              subX = tot - off;
            }
            const dy = t.clientY - pan.y;
            if (Math.abs(dy) > 4) pan.vy = true;
            if (pan.vy) ypan = pan.yp + (dy / view.ch) * pan.rng;
            hover = -1;
            draw();
            return;
          }
          if (boxTool === 2 && draft && view && geo && geo.length)
            draft.hi = snap(x, y).p;
          if (drag && view) {
            if (drag.k === "h") drag.p = snap(x, y).p;
            else if (drag.k === "d") {
              const sn = snap(x, y);
              drag.p = sn.p;
              drag.t = sn.o.c.t;
              /* over P&F / profiles the start is a screen x */
              drag.l = sn.left;
              drag.lk = sn.anc && sn.anc.lk;
              drag.fr = sn.anc && sn.anc.fr;
              drag.dd = sn.anc && sn.anc.dd;
            } else if (drag.k === "b") {
              if (dragEdge === "move" && moveInfo) {
                const dp =
                  (-(y - moveInfo.y) / moveInfo.ch) *
                  moveInfo.rng;
                drag.lo = moveInfo.lo + dp;
                drag.hi = moveInfo.hi + dp;
                let ci = geo.findIndex(
                  (q) => x >= q.x && x < q.x + q.w,
                );
                if (ci < 0)
                  ci = x < geo[0].x ? 0 : geo.length - 1;
                if (moveInfo.si >= 0 && moveInfo.ci >= 0)
                  drag.t =
                    geo[
                      Math.max(
                        0,
                        Math.min(
                          geo.length - 1,
                          moveInfo.si + ci - moveInfo.ci,
                        ),
                      )
                    ].c.t;
              } else drag[dragEdge] = snap(x, y).p;
            } else {
              const o = at(x);
              drag.t = o.c.t;
            }
          } else {
            const onDiv = isDiv(x, y);
            hl = onDiv ? null : hit(x, y);
            cv.style.cursor = onDiv
              ? "ew-resize"
              : hl
                ? hl.k === "b" && hitEdge === "move"
                  ? "move"
                  : hl.k === "h" || hl.k === "d" || hl.k === "b"
                    ? "ns-resize"
                    : "ew-resize"
                : view && x > view.px0
                  ? "ns-resize"
                  : "crosshair";
          }
          hover = geo.findIndex((o) => x >= o.x && x < o.x + o.w);
          showInfo();
          draw();
          /*
           * publish the crosshair (price + candle time) so the
           * other chart can mirror it
           */

          xh =
            view &&
            x >= 4 &&
            x <= view.px0 &&
            y >= view.top &&
            y <= view.bot
              ? {
                  p:
                    view.hi -
                    ((y - view.top) / view.ch) *
                      (view.hi - view.lo),
                  t:
                    hover >= 0 && geo[hover]
                      ? geo[hover].c.t
                      : pfTime(x),
                  from: api,
                }
              : null;
          charts.forEach((h) => {
            if (h !== api) h.sched();
          });
        }
        cv.addEventListener("pointermove", move);
        cv.addEventListener("pointerleave", () => {
          hover = -1;
          mouse = null;
          showInfo();
          draw();
          if (xh && xh.from === api) {
            xh = null;
            charts.forEach((h) => {
              if (h !== api) h.sched();
            });
          }
        });

        /* start time of the P&F column under x, if any */
        function pfTime(x) {
          if (!view || !view.pfX || !view.pcSl) return null;
          const q = view.pfX.find(
            ([, xm]) => Math.abs(x - xm) <= view.pcSl / 2,
          );
          return q ? q[0] : null;
        }
        /* the profiles / chart divider under x, y */
        function isDiv(x, y) {
          if (
            !cfg.tpo ||
            !view ||
            full ||
            boxTool ||
            dotTool ||
            y < view.top ||
            y > view.bot
          )
            return false;
          /* "pc" = profiles / DPoc edge, "tpo" = the edge
             before the chart */
          if (view.spW && Math.abs(x - view.pS) <= 5) return "sp";
          if (view.pcW && view.tpoW && Math.abs(x - view.tR) <= 5)
            return "pc";
          return Math.abs(x - (view.x0 - 5)) <= 5 ? "tpo" : false;
        }
        /* candle under x, clamped to the first/last one */
        function at(x) {
          return (
            geo.find((q) => x >= q.x && x < q.x + q.w) ||
            (x < geo[0].x ? geo[0] : geo[geo.length - 1])
          );
        }
        /* where a box or dot starts: its candle, or the x it
           was drawn at over DPoc / the profiles */
        /* l.l: drawn over the profiles, a main chart x; "pf":
           over the P&F, at the column of its time (the
           panel's left edge if older than those shown) */
        function xsOf(l) {
          if (l.l === "pf" && cfg.main) return pfXAt(l.t);
          /* a POC candle (else the window's left edge) */
          if (l.l === "pc" && cfg.main) {
            const d = l.dd != null ? l.dd : l.t,
              q = (view.pcGeo || []).find(
                (g2) => g2.c.t === d && g2.c.k === l.lk,
              );
            return q ? (q.xa + q.xb) / 2 : view.tR + 2;
          }
          /* a profile day's column (else the left edge) */
          if (l.l === "tp" && cfg.main) {
            const d = l.dd != null ? l.dd : l.t,
              P = profs.find((q2) => q2.dS === d && q2.show);
            return P ? P.cx0 + (l.fr || 0) * view.colW : 4;
          }
          if (l.l && cfg.main) return l.l;
          const o = geoAt(l.t);
          return o ? o.x + o.w / 2 : view ? view.x0 : 0;
        }
        /* the P&F column of time t, or the panel's left edge
           if t is older than the columns shown */
        function pfXAt(t) {
          let x = view.pS + 2;
          for (const [t0, xm] of view.pfX || []) if (t0 <= t) x = xm;
          return x;
        }
        /* a level line's start on the main chart's side
           windows: its own x over the profiles, else the P&F
           column of its time while the P&F shows */
        function dSide(l) {
          if (!cfg.main || !view) return null;
          if (typeof l.l === "number") return l.l;
          if (l.l === "pc" || l.l === "tp") return xsOf(l);
          return view.pfX && view.pfX.length ? pfXAt(l.t) : null;
        }
        function geoAt(t) {
          let r = null;
          if (geo)
            for (const q of geo) {
              if (q.c.t <= t) r = q;
              else break;
            }
          return r;
        }
        /*
         * magnet: nearest O/H/L/C of the candle under the
         * pointer, within 14px
         */
        function snap(x, y) {
          const free =
            view.hi -
            ((y - view.top) / view.ch) * (view.hi - view.lo);

        main: true,
        mode: "eq",
        /* one day of 5m candles, a fifth of the width free */
        N: 288,
        room: 0.2,
        tpo: true,
      });
      const miniChart = makeChart($("mc"), {
        main: false,
        mode: "lb",
        N: 200,
        /* 15% free on the right; new bricks push it left */
        room: 0.15,
        tpo: false,
      });
      charts = [mainChart, miniChart];

      /*
       * Ctrl+S (or Cmd+S) saves drawings + all settings in
       * this browser's localStorage; restored on reload
       */

      const SAVE_KEY = "btcfdusd-state-v2";
      /* raise this whenever the default vol / B / O change */
      const DEFAULTS_VER = 11;
      function toast(t) {
        const el = $("toast");
        el.textContent = t;
        el.style.opacity = 1;
        clearTimeout(toast.h);
        toast.h = setTimeout(() => {
          el.style.opacity = 0;
        }, 1800);
      }
      let miniBox = null;
      function snapshot() {
        const r = mini.getBoundingClientRect();
        if (r.width > 0)
          miniBox = {
            x: Math.round(r.left),
            y: Math.round(r.top),
            w: Math.round(r.width),
            h: Math.round(r.height),
          };
        return {
          v: 2,
          dv: DEFAULTS_VER,
          vol: $("vol").value,
          volDef: VOL_DEFAULT,
          autoBox,
          followBox,
          nBox,
          hlLad,
          showGrid,
          pocBand,
          showVA,
          showUD,
          udZz,
          showPOC,
          stCol,
          pcPf,
          pfBr,
          pfSg,
          pfHl,
          pfVc,
          pocC,
          pcSub,
          showOrders,
          showLines,
          showGr,
          lines: lines.filter(
            (l) => !(l.k === "b" && l.lo === l.hi),
          ),
          main: mainChart.getState(),
          mini: miniChart.getState(),
          win: Object.assign(
            { hidden: mini.style.display === "none" },
            miniBox || {},
          ),
        };
      }
      function restore() {
        let st = null;
        try {
          st = JSON.parse(
            localStorage.getItem(SAVE_KEY) || "null",
          );
        } catch (e) {}
        if (!st) {
          try {
            const old = JSON.parse(
              localStorage.getItem("btcfdusd-drawings-v1") ||
                "null",
            );
            if (Array.isArray(old)) st = { lines: old };
          } catch (e) {}
        }
        if (!st) return;
        if (Array.isArray(st.lines))
          lines.push(...st.lines.filter((l) => l && l.k));
        /* vol / B / O / L saved before version 2 of the
           defaults are ignored */
        const cur = st.dv >= 2;
        if (cur && typeof st.autoBox === "boolean")
          setAutoBox(st.autoBox);
        if (cur && [1, 2, 3].includes(st.nBox)) setNBox(st.nBox);
        if (typeof st.followBox === "boolean")
          setFollowBox(st.followBox);
        /* 6h: default changed in version 4, HL / VA in 5 */
        const cur4 = st.dv >= 4,
          cur5 = st.dv >= 5;
        if (cur5 && typeof st.hlLad === "boolean")
          setHlLad(st.hlLad);
        if (cur4 && typeof st.showGrid === "boolean")
          setShowGrid(st.showGrid);
        if (typeof st.pocBand === "boolean") setPocBand(st.pocBand);
        /* POC: default changed in version 8 */
        /* P&F: default changed in version 9 */
        if (st.dv >= 9 && typeof st.pcPf === "boolean")
          setPcPf(st.pcPf);
        if (typeof st.pfBr === "boolean") setPfBr(st.pfBr);
        if (typeof st.pfSg === "boolean") setPfSg(st.pfSg);
        if (typeof st.pfHl === "boolean") setPfHl(st.pfHl);
        if (typeof st.pfVc === "boolean") setPfVc(st.pfVc);
        if (st.dv >= 8 && typeof st.showPOC === "boolean")
          setShowPOC(st.showPOC);
        if (typeof st.stCol === "boolean") setStCol(st.stCol);
        /* DPoc: default changed in version 7 */
        /* DPoc: meaning changed in version 11 */
        if (st.dv >= 11 && typeof st.pocC === "boolean")
          setPocC(st.pocC);
        /* SPoc would switch P&F off: older saves ignored */
        /* SPoc: default changed in version 10 */
        if (st.dv >= 10 && typeof st.pcSub === "boolean")
          setPcSub(st.pcSub);
        if (cur5 && typeof st.showVA === "boolean")
          setShowVA(st.showVA);
        if (typeof st.showUD === "boolean") setShowUD(st.showUD);
        if (typeof st.udZz === "boolean") setUdZz(st.udZz);
        /* O / L: defaults changed in version 6 */
        const cur6 = st.dv >= 6;
        if (cur6 && typeof st.showOrders === "boolean")
          setShowOrders(st.showOrders);
        if (cur6 && typeof st.showLines === "boolean")
          setShowLines(st.showLines);
        if (typeof st.showGr === "boolean") setShowGr(st.showGr);
        /* a saved vol is dropped when the default has
           changed since it was saved */
        if (
          cur &&
          typeof st.vol === "string" &&
          st.volDef === VOL_DEFAULT
        ) {
          $("vol").value = st.vol;
          setVol(st.vol);
        }
        /*
         * A reload behaves like Alt+X, except that drawings
         * and settings are kept: the view (zoom, pan, price
         * scale, floating window) always starts from its
         * default, so only timeframe and TPO days are taken
         * from the saved chart state; the main chart always
         * opens on volume candles (VC).
         */
        const keep = (s) => s && { TF: s.TF, nTpo: s.nTpo };
        mainChart.setState(keep(st.main));
        miniChart.setState(keep(st.mini));
        schedule();
      }
      addEventListener("keydown", (e) => {
        if (
          (e.ctrlKey || e.metaKey) &&
          !e.altKey &&
          String(e.key).toLowerCase() === "s"
        ) {
          e.preventDefault();
          try {
            const snap = snapshot();
            localStorage.setItem(SAVE_KEY, JSON.stringify(snap));
            toast(
              "Settings and drawings saved (" +
                snap.lines.length +
                " drawings)",
            );
          } catch (err) {
            toast("Could not save: browser storage is blocked");
          }
        }
      });

      /*
       * floating 15s line-break window: drag the top-left
       * grip to resize (anchored bottom-right)
       */

      const mini = $("mini");
      /* keep the window inside the viewport */
      function setMiniBox(bx) {
        const w = Math.max(240, Math.min(innerWidth, bx.w)),
          h = Math.max(160, Math.min(innerHeight, bx.h));
        mini.style.left =
          Math.max(0, Math.min(innerWidth - w, bx.x)) + "px";
        mini.style.top =
          Math.max(0, Math.min(innerHeight - h, bx.y)) + "px";
        mini.style.width = w + "px";
        mini.style.height = h + "px";
      }
      /* default: minimum size, bottom-left corner (setMiniBox
         clamps y to the bottom) */
      const miniHome = () =>
        setMiniBox({ x: 0, y: innerHeight, w: 240, h: 160 });
      miniHome();
      addEventListener("resize", () => {
        const r = mini.getBoundingClientRect();
        if (r.width > 0)
          setMiniBox({
            x: r.left,
            y: r.top,
            w: r.width,
            h: r.height,
          });
      });
      /*
       * resize from any corner; the opposite corner stays
       * put
       */
      document.querySelectorAll("#mini .grip").forEach((gp) =>
        gp.addEventListener("pointerdown", (e) => {
          const c = gp.dataset.c,
            r = mini.getBoundingClientRect(),
            sx = e.clientX,
            sy = e.clientY;
          gp.setPointerCapture(e.pointerId);
          e.preventDefault();
          const mv = (ev) => {
            const dx = ev.clientX - sx,
              dy = ev.clientY - sy;
            let x1 = r.left,
              x2 = r.right,
              y1 = r.top,
              y2 = r.bottom;
            if (c[1] === "l")
              x1 = Math.max(
                0,
                Math.min(r.right - 240, r.left + dx),
              );
            else
              x2 = Math.min(
                innerWidth,
                Math.max(r.left + 240, r.right + dx),
              );
            if (c[0] === "t")
              y1 = Math.max(
                0,
                Math.min(r.bottom - 160, r.top + dy),
              );
            else
              y2 = Math.min(
                innerHeight,
                Math.max(r.top + 160, r.bottom + dy),
              );
            setMiniBox({ x: x1, y: y1, w: x2 - x1, h: y2 - y1 });
          };
          const up = () => {
            gp.removeEventListener("pointermove", mv);
            gp.removeEventListener("pointerup", up);
          };
          gp.addEventListener("pointermove", mv);
          gp.addEventListener("pointerup", up);
        }),
      );
      /* title bar: move the window */
      $("mhead").addEventListener("pointerdown", (e) => {
        if (e.target.closest && e.target.closest("button"))
          return;
        const hd = $("mhead"),
          r = mini.getBoundingClientRect(),
          sx = e.clientX,
          sy = e.clientY;
        hd.setPointerCapture(e.pointerId);
        e.preventDefault();
        const mv = (ev) =>
          setMiniBox({
            x: r.left + ev.clientX - sx,
            y: r.top + ev.clientY - sy,
            w: r.width,
            h: r.height,
          });
        const up = () => {
          hd.removeEventListener("pointermove", mv);
          hd.removeEventListener("pointerup", up);
        };
        hd.addEventListener("pointermove", mv);
        hd.addEventListener("pointerup", up);
      });
      $("mx").onclick = () => {
        mini.style.display = "none";
      };

      /* Alt+R: default zoom and pan, floating window back to
         its corner. Alt+X: the same, plus drawings deleted. */
      addEventListener("keydown", (e) => {
        if (e.altKey && e.code === "KeyR") {
          e.preventDefault();
          miniHome();
          mainChart.resetView();
          miniChart.resetView();
          schedule();
          toast("View reset");
        } else if (e.altKey && e.code === "KeyX") {
          e.preventDefault();
          if (
            lines.length &&
            !confirm(
              "Reset both charts and delete all " +
                lines.length +
                " drawings?",
            )
          )
            return;
          lines = [];
          linesSig = "";
          /* back to the minimum size, bottom-left corner */
          mini.style.display = "flex";
          miniHome();
          mainChart.resetView();
          miniChart.resetView();
          schedule();
          toast("Charts reset to default, drawings deleted");
        }
      });
      /* Drawings Clear button: delete every drawing */
      $("drawClr").onclick = () => {
        if (!lines.length) return toast("No drawings");
        lines = [];
        schedule();
        toast("Drawings deleted");
      };
      $("sym").textContent = SYM + " " + TF;
      document.title = SYM;
      /* default vol step, overridden by a saved layout */
      const VOL_DEFAULT = $("vol").value;
      setVol($("vol").value);
      setNBox(1);
      [...$("boxN").children].forEach(
        (b, i) => (b.onclick = () => setNBox(i + 1)),
      );
      restore();
      /* a fresh page starts as after Alt+R: settings kept,
         views back home */
      miniHome();
      mainChart.resetView();
      miniChart.resetView();
      $("ladTog").onclick = () => setHlLad(!hlLad);
      $("gridTog").onclick = () => setShowGrid(!showGrid);
      $("pbTog").onclick = () => setPocBand(!pocBand);
      $("vaTog").onclick = () => setShowVA(!showVA);
      $("udTog").onclick = () => setShowUD(!showUD);
      $("zzTog").onclick = () => setUdZz(!udZz);
      $("pcTog").onclick = () => setPocC(!pocC);
      $("spTog").onclick = () => setPcSub(!pcSub);
      $("pfTog").onclick = () => setPcPf(!pcPf);
      $("pfBrTog").onclick = () => setPfBr(!pfBr);
      $("pfSgTog").onclick = () => setPfSg(!pfSg);
      $("pfHlTog").onclick = () => setPfHl(!pfHl);
      $("pfVcTog").onclick = () => setPfVc(!pfVc);
      $("pocTog").onclick = () => setShowPOC(!showPOC);
      $("stTog").onclick = () => setStCol(!stCol);
      $("boxTog").onclick = () => setAutoBox(!autoBox);
      $("fboxTog").onclick = () => setFollowBox(!followBox);
      $("ordTog").onclick = () => setShowOrders(!showOrders);
      $("ordLineTog").onclick = () => setShowLines(!showLines);
      $("grTog").onclick = () => setShowGr(!showGr);
      $("vol").addEventListener("input", (e) => {
        volTyped = true;
        setVol(e.target.value);
      });
      $("vol").addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === "Escape") e.target.blur();
      });
      /* installable app: only when served over https */
      if (
        "serviceWorker" in navigator &&
        location.protocol === "https:"
      )
        navigator.serviceWorker.register("sw.js").catch(() => {});
      loadOrders();
      loadGrid();
      loadVol();
      connect();
      hist(IV, () => seedIv(IV));
      hist("15m", () => seedIv("15m"));
      load15(null);
    </script>
  </body>
</html>
